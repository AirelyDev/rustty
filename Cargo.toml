# rustty — virtual Cargo workspace
#
# Zig→Rust port of Ghostty (codename `rustty`) at 100% functional parity.
# Reference oracle (READ-ONLY): /Users/gael/projects/ghostty @ 4749c4e (Zig 0.15.2).
# Governed by .port/PORT_RULES.md (R1 fidelity, R2 identity-rename, R3
# self-contained / no ghostty Cargo dep, R4 acyclic crate graph, R5 gates
# invariant) and docs/superpowers/specs/2026-06-21-rustty-crate-structure-design.md.
#
# Members are listed in the strict leaves-first topological order from
# .port/phase-0/plan/PORT_PLAN.md (Section 1). A crate depends only on crates
# that appear earlier in this list (R4: acyclic, gate-enforced by
# .port/tools/cycle_check.py). The `-sys` crates and `xtask` are independent of
# the parity port order (built on demand).
#
# IMPORTANT: NO crate here depends on the ghostty tree as a Cargo dependency (R3).
# The reference is used only as an external oracle by the differential harness.

[workspace]
resolver = "2"
members = [
    # ----- 29 parity port-order crates (strict topological order) -----
    "crates/rustty-util",          #  1
    "crates/rustty-build-config",  #  2
    "crates/rustty-identity",      #  3
    "crates/rustty-datastruct",    #  4
    "crates/rustty-unicode",       #  5
    "crates/rustty-simd",          #  6
    "crates/rustty-lib",           #  7
    "crates/rustty-global",        #  8
    "crates/rustty-render-types",  #  9
    "crates/rustty-os",            # 10
    "crates/rustty-vt",            # 11  <- crown jewel
    "crates/rustty-vt-c",          # 12
    "crates/rustty-crash",         # 13
    "crates/rustty-cfg-fmt",       # 14
    "crates/rustty-args",          # 15
    "crates/rustty-apprt-api",     # 16
    "crates/rustty-font",          # 17
    # D1 three-tier split (memory `apc-glyf-font-layering-d1`): the SHAPER tier
    # ABOVE both rustty-vt and rustty-font (backend `Face` selector + CoreText/
    # FreeType faces + HarfBuzz shaping). rustty-font stays PURE below vt.
    "crates/rustty-font-shaper",
    # R1 safe wrapper over the vendored Oniguruma (`oni::*`): the regex binding
    # `rustty-vt`'s `string_map.rs` consumes behind the off-by-default
    # `oniguruma` feature. Depends only on `oniguruma-sys` (a -sys leaf).
    "crates/rustty-oniguruma",
    "crates/rustty-input",         # 18
    "crates/rustty-inspector",     # 19
    "crates/rustty-renderer",      # 20
    "crates/rustty-config",        # 21
    "crates/rustty-terminfo",      # 22
    "crates/rustty-termio",        # 23
    "crates/rustty-core",          # 24
    "crates/rustty-apprt",         # 25
    # The libghostty embedding C ABI (apprt/embedded): a NEW TOP SINK over
    # rustty-apprt (vt-c precedent). cdylib/staticlib/rlib -> librustty.{dylib,a}
    # + include/rustty-apprt.h (cbindgen, R2). Nothing depends on it
    # (EMBEDDED_BLUEPRINT §3/§5). Independent of the strict port order (a sink).
    "crates/rustty-apprt-c",
    "crates/rustty-cli",           # 26
    # Port of ghostty's src/extra/ — the shell-completion (bash/zsh/fish) + editor-
    # syntax (vim/sublime) generators. A pure byte producer above config+cli (the
    # `+gen-*` leaf); nothing depends on it (R4 acyclic). NOT in the 3234-test src/
    # contract's terminal map — scoped-mapped in check_test_counts.py (base = src/extra).
    "crates/rustty-extra",
    "crates/rustty",               # 27  <- bin (produces the `rustty` binary)
    "crates/rustty-bench",         # 28
    "crates/rustty-synthetic",     # 29

    # ----- additive infra glue (R1): Zig stdlib equivalents -----
    # NOT in the 3234-test contract (no ghostty src/ file) and NOT in the
    # test-contract crate_map. A leaf over rustty-util; backing = std::alloc.
    "crates/rustty-zigstd",

    # ----- build-time help_strings extraction (R1 port of src/helpgen.zig) -----
    # The shared LEAF used as a [build-dependencies] by the three crates that own
    # a `help_strings` table (config/input/cli). std-only, no rustty dep, so the
    # build-dep edges stay acyclic (G7 includes [build-dependencies]). NOT in the
    # 3234-test contract (its parity contract is the scoped-G3b over helpgen.zig).
    "crates/rustty-helpgen",

    # ----- libxev event-loop crate (D6): placeholder types now, port later -----
    # libxev is a Zig-source dependency package (not ghostty src/, not a C lib);
    # the D6 decision ports it faithfully into THIS crate when a live event-loop
    # milestone forces it (Zig-source precedent: rustty-z2d). Until then it hosts
    # the SHARED xev handle placeholder types (`Async`/`Loop`/`Completion`/...)
    # that termio, the renderer thread seam, and core all name (CORE_BLUEPRINT §5
    # "xev handle unification"). A leaf over rustty-global (the `global.zig`
    # `pub const xev` seam anchor). NOT in the 3234-test contract.
    "crates/rustty-xev",

    # ----- pkg/wuffs safe-wrapper parity crate: PNG/JPEG image decode -----
    # Faithful mirror of ghostty's `pkg/wuffs` package boundary (main/error/png/
    # jpeg/swizzle.zig) — the safe `decode` wrappers over the `wuffs-sys` FFI leaf.
    # A leaf-ish crate (deps: wuffs-sys + allocator-api2); the renderer's
    # background-image `prepBackgroundImage` decode path consumes it. NOT in the
    # 3234-test contract's src/ map (its base is pkg/wuffs); scoped-mapped in
    # check_test_counts.py.
    "crates/rustty-wuffs",

    # ----- vendored pure-Rust dependency port (R3): z2d 2D vector graphics -----
    # Port of the `vancluever/z2d` 0.10.0 subset ghostty uses in its sprite/glyf
    # font rasterizers (Context/Path/StaticPath/Surface/Transformation/painter +
    # the path flattener + polygon rasterizer). z2d is a DEP not ghostty code, so
    # its own tests are not the parity contract; its rasterization must be
    # pixel-exact so the ghostty sprite/glyf PNG known-answer tests pass. Pure
    # Rust, no deps. A leaf (depends on nothing in the workspace).
    "crates/rustty-z2d",

    # ----- vendored pure-Rust dependency port (R3): zf 0.10.3 fuzzy finder -----
    # Port of the `natecraddock/zf` 0.10.3 fuzzy-match ranker ghostty's
    # `cli/list_themes.zig` sorts the theme picker with (`zf.rank(name, tokens,
    # .{})` -> `?f64`). zf is a DEP not ghostty code, so its own tests are not the
    # parity contract, but the RANK algorithm must be bit-faithful (list_themes
    # sorts on the exact `f64` + the match/no-match decision). Pure Rust, no deps.
    # A leaf. GH base = the zig-cache dep dir; scoped-mapped in check_test_counts.py.
    "crates/rustty-zf",

    # ----- vendored pure-Rust dependency port (R3): libvaxis 0.5.1 TUI lib -----
    # Port of the `rockorager/libvaxis` 0.5.1 subset the interactive CLI's TUI uses.
    # libvaxis is a DEP not ghostty code, so its own tests are not the src/ parity
    # contract; scoped-mapped in check_test_counts.py. CHUNK 1a is the core VALUE
    # TYPES only (Cell/Key/Mouse/GraphemeCache/Winsize + the Image struct-shape);
    # gwidth/unicode + rendering/tty/loop are later chunks. Pure Rust, no deps. A leaf.
    "crates/rustty-vaxis",

    # ----- supporting -sys crates (R3: vendored C, cc + bindgen) -----
    "crates-sys/freetype-sys",
    "crates-sys/harfbuzz-sys",
    "crates-sys/fontconfig-sys",
    "crates-sys/oniguruma-sys",
    "crates-sys/simdutf-sys",
    "crates-sys/highway-sys",
    "crates-sys/glslang-sys",
    "crates-sys/spirv-cross-sys",
    "crates-sys/wuffs-sys",
    "crates-sys/zlib-sys",
    "crates-sys/gettext-sys",
    "crates-sys/libpng-sys",
    "crates-sys/sentry-sys",
    "crates-sys/dcimgui-sys",

    # ----- build orchestration (replaces src/build/) -----
    "xtask",
]

# Shared package metadata inherited by every member via `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/AirelyDev/rustty"
authors = ["rustty contributors"]

[workspace.dependencies]
# Internal crates are referenced by path so members can declare each other as
# `dep.workspace = true` once real wiring lands. Versions track the workspace.
rustty-util = { path = "crates/rustty-util" }
rustty-build-config = { path = "crates/rustty-build-config" }
rustty-identity = { path = "crates/rustty-identity" }
rustty-datastruct = { path = "crates/rustty-datastruct" }
rustty-unicode = { path = "crates/rustty-unicode" }
rustty-simd = { path = "crates/rustty-simd" }
rustty-lib = { path = "crates/rustty-lib" }
rustty-global = { path = "crates/rustty-global" }
rustty-render-types = { path = "crates/rustty-render-types" }
rustty-os = { path = "crates/rustty-os" }
rustty-vt = { path = "crates/rustty-vt" }
rustty-vt-c = { path = "crates/rustty-vt-c" }
rustty-crash = { path = "crates/rustty-crash" }
rustty-cfg-fmt = { path = "crates/rustty-cfg-fmt" }
rustty-args = { path = "crates/rustty-args" }
rustty-apprt-api = { path = "crates/rustty-apprt-api" }
rustty-font = { path = "crates/rustty-font" }
rustty-font-shaper = { path = "crates/rustty-font-shaper" }
# R1 safe wrapper (`oni::*`) over the vendored Oniguruma regex engine.
rustty-oniguruma = { path = "crates/rustty-oniguruma" }
rustty-input = { path = "crates/rustty-input" }
rustty-inspector = { path = "crates/rustty-inspector" }
rustty-renderer = { path = "crates/rustty-renderer" }
rustty-config = { path = "crates/rustty-config" }
rustty-terminfo = { path = "crates/rustty-terminfo" }
rustty-termio = { path = "crates/rustty-termio" }
rustty-core = { path = "crates/rustty-core" }
rustty-apprt = { path = "crates/rustty-apprt" }
# The libghostty embedding C ABI top-sink (cbindgen -> include/rustty-apprt.h).
rustty-apprt-c = { path = "crates/rustty-apprt-c" }
rustty-cli = { path = "crates/rustty-cli" }
# Shell-completion + editor-syntax generators (port of src/extra/). Above config+cli.
rustty-extra = { path = "crates/rustty-extra" }
# The benchmark suite + its `rustty_benchmark_cli` C-ABI export (port of src/benchmark/).
# apprt-c force-links it (the `_ = benchmark.CApi` analog) so `ghostty_benchmark_cli` lands
# in the app C-ABI staticlib under `identity-oracle`.
rustty-bench = { path = "crates/rustty-bench" }
# Additive infra glue (R1): Zig stdlib equivalents; not in the parity contract.
rustty-zigstd = { path = "crates/rustty-zigstd" }
# Build-time help_strings doc-table extraction (R1 port of src/helpgen.zig). A
# std-only leaf, used only as a [build-dependencies] by config/input/cli.
rustty-helpgen = { path = "crates/rustty-helpgen" }
# D6: the libxev event-loop crate — shared xev handle placeholder types today,
# the faithful libxev port (in place) later. A leaf over rustty-global.
rustty-xev = { path = "crates/rustty-xev" }
# Vendored pure-Rust port of the z2d 2D vector graphics subset (R3). A leaf.
rustty-z2d = { path = "crates/rustty-z2d" }
# Vendored pure-Rust port of the zf 0.10.3 fuzzy finder (R3) — the theme-picker
# rank/highlight algorithm (`cli/list_themes.zig`). A leaf.
rustty-zf = { path = "crates/rustty-zf" }
# Vendored pure-Rust port of the libvaxis 0.5.1 TUI subset (R3) — the interactive
# CLI's terminal-UI dependency. Chunk 1a = core value types. A leaf.
rustty-vaxis = { path = "crates/rustty-vaxis" }
# R3: vendored zlib 1.3.1 (the SAME C library the reference links). Provides the
# inflate (DEFLATE decompression) surface the Kitty graphics image port needs.
zlib-sys = { path = "crates-sys/zlib-sys" }
# R3: vendored Oniguruma 6.9.9 (the SAME C the reference links). The FFI leaf the
# `rustty-oniguruma` safe wrapper builds the `oni::*` API on top of.
oniguruma-sys = { path = "crates-sys/oniguruma-sys" }
# R3: vendored Wuffs 0.4.0-alpha.9 (the SAME single-file C image-codec library
# the reference links). The FFI leaf the PNG/JPEG image decode + pixel-swizzle
# port builds on (ghostty's ADLER32/CRC32/DEFLATE/JPEG/PNG/ZLIB module subset).
wuffs-sys = { path = "crates-sys/wuffs-sys" }
# pkg/wuffs safe-wrapper parity crate (main/error/png/jpeg/swizzle.zig): the safe
# `decode` API over the `wuffs-sys` FFI leaf. Consumed by the renderer's
# background-image decode path.
rustty-wuffs = { path = "crates/rustty-wuffs" }
# Pure-Rust PNG encoder/decoder — dev-only test-fixture helper (the SAME 0.18
# stand-in rustty-font uses). rustty-wuffs uses it to GENERATE the 1×1 solid PNG
# fixtures at test time (the reference `1x1#*.png` @embedFiles are absent from the
# checkout) and to cross-decode-check, NOT on any runtime path.
png = "0.18"
# R3: vendored libpng 1.6.43 (the SAME `glennrp/libpng` release the reference
# links via pkg/libpng). The FFI leaf backing dcimgui-sys; zlib is provided by
# `zlib-sys` and the ghostty-provided `pnglibconf.h` is vendored in-tree.
libpng-sys = { path = "crates-sys/libpng-sys" }
# R3: vendored glslang 14.2.0 (the SAME KhronosGroup C++ compiler the reference
# links). The FFI leaf the renderer's GLSL->SPIR-V shader-compilation path
# builds on (glslang C interface + resource_limits_c).
glslang-sys = { path = "crates-sys/glslang-sys" }
# R3: vendored KhronosGroup SPIRV-Cross (the SAME C++ cross-compiler the
# reference links; C API 0.59). The FFI leaf the renderer's Metal path builds on
# to cross-compile SPIR-V into MSL/GLSL (spirv_cross_c C interface).
spirv-cross-sys = { path = "crates-sys/spirv-cross-sys" }
# R3: vendored sentry-native 0.7.8 (the SAME `getsentry/sentry-native` release
# the reference links via pkg/sentry). The FFI leaf backing the crash-reporting
# path, built with ghostty's fixed `backend = .inproc` / `transport = .none`
# options. KAT-only today (no consumer yet).
sentry-sys = { path = "crates-sys/sentry-sys" }
# R3: vendored Dear ImGui 1.92.5 (docking) + Dear Bindings 0.17 C API (the SAME
# `ocornut/imgui` release + `dearimgui/dear_bindings` generator the reference
# links via pkg/dcimgui). The FFI leaf backing the inspector UI; FreeType (with
# its bundled libpng) is provided by `freetype-sys`. KAT-only today (no consumer
# yet — the inspector tier is not yet ported).
dcimgui-sys = { path = "crates-sys/dcimgui-sys" }
# Stable polyfill of the unstable `core::alloc::Allocator` trait. This is the
# faithful Rust map of Zig's `std.mem.Allocator`: `Allocator::allocate(Layout)`
# / `deallocate` map to Zig `rawAlloc`/`rawFree`. `Global` == the current
# `std::alloc` path, so threading it as the child allocator is behavior-preserving.
allocator-api2 = "0.2"
# Zig `std.json` equivalent for the crash-envelope port (rustty-crash): the
# reference's `std.json.ObjectMap` is a `StringArrayHashMap(Value)` — an
# INSERTION-ORDER-preserving string map — so `serde_json` is pinned with the
# `preserve_order` feature (IndexMap-backed `Map`) to reproduce that ordering;
# envelope header serialization must round-trip byte-for-byte (R1). Like the
# std-lib shims in rustty-zigstd, this maps a Zig *stdlib* facility, not
# ghostty code (R3 concerns C libraries; pure-Rust bindings to stdlib-level
# functionality are fine).
serde_json = { version = "1", features = ["preserve_order"] }

# Workspace-wide lints. Kept conservative for the scaffold phase; tightened as
# real ported code lands. R1/R5: never weaken to pass — lint exceptions must be
# justified per-occurrence, not blanket-allowed here.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# DG2: ghostty dev builds are ReleaseSafe (overflow/bounds TRAP); its tagged
# artifacts are ReleaseFast (overflow UB). rustty release keeps trap-parity
# with ReleaseSafe — strictly safer than the mirrored artifact (PORT_RULES §DG2).
[profile.release]
overflow-checks = true

# Parity/bench profile mirroring the tagged ReleaseFast artifact (Goal-2 only).
[profile.release-fast]
inherits = "release"
overflow-checks = false

# DG4: differential harness + CI test lane run the oracle's ReleaseSafe
# assert semantics (std.debug.assert active) against ported debug_assert!.
[profile.release-safe]
inherits = "release"
debug-assertions = true

# Shipped macOS .xcframework staticlib profile (PREPORT_SWIFT_APP §4). panic = "abort"
# so assert-class panics (assert!/unreachable!/debug_assert!/overflow-check) ABORT
# exactly like Zig's ReleaseSafe trap — and an unwind can never cross the extern "C"
# boundary into Swift. A DEDICATED profile (not [profile.release]) so the workspace
# test build keeps panic = "unwind" (catch_unwind harnesses / #[should_panic]).
[profile.xcframework]
inherits = "release"
panic = "abort"
