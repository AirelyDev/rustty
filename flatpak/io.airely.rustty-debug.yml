# PORTS: ghostty flatpak/com.mitchellh.ghostty-debug.yml — the debug twin of
# io.airely.rustty.yml (separate app id so both can be installed at once).
#
# =============================== VERIFIED ===================================
# Built offline from the `xtask dist` tarball, installed and run on
# aarch64-linux (Fedora 44), parity tail P-1, 2026-09-27:
#
#     cp "$(cargo run -q -p xtask -- dist | sed -n 's/^wrote //p')" dist/rustty-source.tar.gz
#     flatpak run org.flatpak.Builder --force-clean --user \
#       --repo=flatpak/repo flatpak/builddir-debug flatpak/io.airely.rustty-debug.yml
#     flatpak remote-add --user --no-gpg-verify rustty-local flatpak/repo
#     flatpak install --user rustty-local io.airely.rustty-debug
#     flatpak run io.airely.rustty-debug +version   # -> "Rustty 0.1.0-dev+0000000"
#
# The install carries the `-debug` desktop/metainfo/D-Bus names and the
# terminfo source + termcap (a Debug resource install); desktop-file-validate
# and `appstreamcli validate` pass on it. (Before P-1 this header repeated the
# release manifest's commands: the debug manifest itself had not been built.)
#
# flatpak-builder itself is available WITHOUT root as the org.flatpak.Builder
# flatpak, which is how this was built; the Fedora `flathub` remote is filtered,
# so the full one has to be added at user level first:
#     flatpak remote-add --user --if-not-exists flathub \
#       https://dl.flathub.org/repo/flathub.flatpakrepo
# ============================================================================
#
# THE ONE STRUCTURAL DIFFERENCE FROM THE REFERENCE, and it is a simplification.
#
# ghostty ships `zig-packages.json`, a generated manifest of every Zig
# dependency, because flatpak-builder builds with NO network and `zig build`
# would otherwise want to fetch. The Rust analog would be a generated
# `cargo-sources.json` (flatpak-cargo-generator.py over Cargo.lock) — another
# generated file to keep in sync with every dependency bump, which is exactly
# the drift-prone machinery crane let us delete from the Nix side.
#
# rustty does not need it. `cargo run -p xtask -- dist` already produces a
# source tarball that contains `vendor/` plus a `.cargo/config.toml`
# redirecting crates.io to it (the PACKAGING.md "Source Tarballs" contract),
# and every C/C++ dependency is already vendored under crates-sys/*/vendor. So
# the tarball builds completely offline as-is, and it is the source here.
app-id: io.airely.rustty-debug
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  # The Rust toolchain is not in the GNOME SDK. rust-toolchain.toml pins
  # 1.93.1; this extension tracks stable, so a pin newer than the extension's
  # stable would need `rustup` in a build step instead.
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen (crates-sys/libxml2-sys and friends) dlopens libclang at BUILD
  # time, and the GNOME SDK ships none — `find / -name 'libclang*.so*'` inside
  # org.gnome.Sdk//50 returns nothing, so the build failed with
  #   Unable to find libclang ... set the LIBCLANG_PATH environment variable
  # This extension provides it; LIBCLANG_PATH is set in build-options below.
  - org.freedesktop.Sdk.Extension.llvm21
default-branch: tip
rename-icon: io.airely.rustty
command: rustty
finish-args:
  # 3D rendering
  - --device=dri
  # use host PTS namespace
  - --device=all
  # Windowing
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Allow user to specify additional config files in home by default
  - --filesystem=home:ro
  # So we can escape the sandbox
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/pkgconfig
  - /share/vala
  - "*.la"
  - "*.a"
  - "*.so"

modules:
  - dependencies.yml

  - name: rustty
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
      env:
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
        # The tarball ships .cargo/config.toml pointing at its own vendor/ dir,
        # so nothing should reach the network. Make an attempt an error rather
        # than a confusing hang.
        CARGO_NET_OFFLINE: "true"
        CARGO_HOME: /run/build/rustty/cargo-home
        # The reference builds with `--system $PWD/vendor/p`, and `-Dpie`
        # defaults to true for a system package (`Config.zig:408-412`, N422).
        RUSTTY_PIE: "true"
    build-commands:
      # `flatpak` = the reference's `-Dflatpak=true`; see the release manifest
      # (io.airely.rustty.yml) for what is inert without it.
      - cargo build --offline --locked
        -p rustty --no-default-features --features "gtk wayland x11 simd flatpak"
      # Stage terminfo / shell-integration / themes / man / completions /
      # locale / the desktop-app files. --flatpak swaps in the flatpak D-Bus
      # service and caps the icon at 512, matching the reference's
      # `-Dflatpak=true`. `--optimize Debug` is the resource half of the
      # reference's `-Doptimize=Debug`: it installs the terminfo source and
      # termcap, and names the desktop files with the `-debug` app id.
      - cargo run --offline --locked -p xtask -- resources
        --target-os linux --prefix /app --flatpak --optimize Debug
      - install -Dm755 target/debug/rustty /app/bin/rustty
      - cp -r zig-out/share/. /app/share/
    sources:
      # The PRE-VENDORED source tarball, not a `type: dir` of the worktree:
      # that is what makes the offline build work without a generated
      # cargo-sources.json. Regenerate with the `xtask dist` + `cp` at the top:
      # the tarball is named after the full version (`rustty-X.Y.Z-<branch>+
      # <hash>.tar.gz` off a tag, N424), so it is copied to a fixed name.
      - type: archive
        path: ../dist/rustty-source.tar.gz
        strip-components: 1
