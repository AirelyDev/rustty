# xtask — build orchestration (replaces ghostty src/build/)
#
# Independent of the parity port order (R4). Owns cbindgen header emission,
# terminfo compilation, shell-integration/theme bundling, man pages, i18n,
# dist tarball, and the macOS xcframework/.app. NO ghostty Cargo dep (R3).
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
# Parity-harness identity profile (R2/Task 14) for the resource-tree OUTPUT
# names (`share/rustty/…` -> `share/ghostty/…`, `rustty.1` -> `ghostty.1`,
# `_rustty` -> `_ghostty`, etc — see `main.rs`'s `APP` const), AND (Task 18)
# forwarded to `rustty-terminfo/identity-oracle` so the generated terminfo
# content flips to the reference `xterm-ghostty|ghostty|Ghostty` spelling for
# oracle byte-for-byte parity checks.
#
# Task 18: this crate used to unconditionally force
# `rustty-terminfo/identity-oracle` on below regardless of this feature, on
# the rationale that the reused macOS Swift app hard-coded
# `TERM=xterm-ghostty`. That app no longer hardcodes ghostty post-rebrand —
# `TERM=xterm-rustty` must resolve — so the force was a real bug (shipped
# `zig-out/share/terminfo` had ghostty content even in the default profile).
# The forward below keeps `main.rs`'s local `cfg`-gated `APP` const mirror
# (rather than a direct `rustty_identity::APP_NAME` call) only because it
# is harmless and touches many `res_*` modules; it is no longer required to
# dodge feature-unification poisoning, since `rustty-terminfo` no longer
# forces `identity-oracle` on unconditionally.
identity-oracle = ["rustty-terminfo/identity-oracle"]

[dependencies]
rustty-extra = { workspace = true }
# `install-lib`'s `.pc` `Version:` is the app version composed from the checkout
# (`deps.config.version`).
rustty-version = { workspace = true }
# Default profile: rustty terminfo (`xterm-rustty|rustty|Rustty`). Oracle
# parity (`xterm-ghostty|ghostty|Ghostty`) is opt-in via this crate's own
# `identity-oracle` feature (forwarded above), not forced unconditionally —
# see the `[features]` doc comment for why the previous unconditional force
# was a bug (Task 18).
rustty-terminfo = { workspace = true }
# WS9: parse `cargo build --message-format=json` so the xcframework combine step
# folds an EXPLICIT, cargo-declared archive set (the port of GhosttyLib.zig's
# enumerated `deps.add(lib)` list) instead of globbing the target dir.
serde_json = { workspace = true }
