# xtask — build orchestration (replaces ghostty src/build/)
#
# Independent of the parity port order (R4). Owns cbindgen header emission,
# terminfo compilation, shell-integration/theme bundling, man pages, i18n,
# dist tarball, and the macOS xcframework/.app. NO ghostty Cargo dep (R3).
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
rustty-extra = { workspace = true }
# identity-ghostty: emit the `xterm-ghostty` terminfo spelling so the reused
# macOS Swift app's hard-coded `TERM=xterm-ghostty` resolves at runtime (R2;
# `xterm-rustty` is the canonical name — see xtask/src/res_terminfo.rs).
rustty-terminfo = { workspace = true, features = ["identity-ghostty"] }
