[files]
extend-exclude = [
  # Build
  "Cargo.lock",
  # Build artifacts
  "macos/build/*",
  "target/*",
  # vendored code
  "vendor/*",
  "crates-sys/*/vendor/*",
  # "grey" color names are valid
  "crates/rustty-vt/src/res/rgb.txt",
  # Do not self-check
  "typos.toml",
  # Fonts
  "*.ttf",
  "*.otf",
  "*.bdf",
  # Images
  "*.png",
  "*.ico",
  "*.icns",
  # Valgrind nonsense
  "valgrind.supp",
  # Port scaffolding & phase-0 goldens (binary/generated test inputs)
  ".port/phase-0/**",
  # Ports of ghostty's third-party *dependencies*, not of ghostty's own source.
  # In the reference these are packages fetched by build.zig.zon and never part
  # of its source tree, so its typos lane never saw them either. R1 ports their
  # comments verbatim — upstream's own misspellings included — so spell-checking
  # them would force a choice between a green lane and comment fidelity.
  "crates/rustty-xev/**",     # libxev
  "crates/rustty-z2d/**",     # vancluever/z2d
  "crates/rustty-zigimg/**",  # zigimg
  "crates/rustty-vaxis/**",   # libvaxis + the uucode UCD tables
  "crates/rustty-zf/**",      # natecraddock/zf
  "crates/rustty-zigstd/**",  # Zig stdlib equivalents
  # Theme names are third-party data (Grey Green, Havn Daggry, JetBrains
  # Darcula, …), not prose.
  "crates/rustty-extra/themes.manifest",
  "crates/rustty-extra/themes/**",
  # Snapshot wire-format goldens are hex, not text.
  "crates/rustty-vt/src/snapshot/testdata/**",
  # Other
  "*.pdf",
  "*.data",
  "*.xib",
  "crates/rustty-cli/src/lorem_ipsum.txt",
]

[default]
extend-ignore-re = [
  # Ignore typos in test expectations
  "assert[_a-z]*!\\([^;]*",
  "kHOM\\d*",
  # Ignore "typos" in sprite font draw fn names
  "draw[0-9A-F]+(_[0-9A-F]+)?\\(",
  # Ignore test data in the paste input module. Two spellings: the Rust
  # literal (`"hel\x…`) and the ported Zig expectation quoted in a comment
  # (`\x1b[200~hel lo world`), which R1 keeps verbatim.
  "\"hel\\\\x",
  "200~hel",
  # Ignore long hex-like IDs such as 815E26BA2EF1E00F005C67B1
  "[0-9A-F]{12,}",
  # Ignore base64-encoded strings
  "[A-Za-z0-9+/]{8,}={0,2}",
  # Ignore Apple four char codes
  'code="[A-Za-z]{4,8}"',
  '"[A-Za-z]{4}"\.fourCharCode',
  # Ignore the Intel CPUID vendor string split into its ebx/edx/ecx words
  # (highway-sys x86 detection test)
  '"Genu" "ineI" "ntel"',
  # Ignore rc.exe's `/fo <file>` output flag (the Windows resource build)
  '\.arg\("/fo"\)',
  # Ignore the "Earl Grey" theme name cited in prose (theme names are
  # third-party data, as the themes/ exclude above says)
  'Earl Grey',
]

[default.extend-words]
Pn = "Pn"
thr = "thr"
# Swift oddities
Datas = "Datas"
Requestor = "Requestor"
iterm = "iterm"
ACCES = "ACCES"
wdth = "wdth"
Strat = "Strat"
grey = "gray"
greyscale = "grayscale"
DECID = "DECID"
flate = "flate"
typ = "typ"
kend = "kend"
# Tai Tham is a script/writing system
Tham = "Tham"
# GTK
GIR = "GIR"
# terminfo
rin = "rin"
# sprites
ower = "ower"
# OpenType table names
loca = "loca"
# TinyIo
tio = "tio"
WRONLY = "WRONLY"
# `mis-` is a live English prefix and the docs use it constantly
# (mis-attribution, mis-cited, mis-paired, mis-specification, …).
mis = "mis"
# Vai is a script/writing system (HB_SCRIPT_VAI).
Vai = "Vai"
VAI = "VAI"
# OpenGL level-of-detail (GL_TEXTURE_LOD_BIAS, MinLod, MaxLod).
Lod = "Lod"
LOD = "LOD"
# `nto` is a real Rust target OS (QNX Neutrino).
nto = "nto"
# `pre-empted` is a word.
empted = "empted"
# Local identifiers: `propt` = PrintOptions helper (rustty-cli list_themes),
# `clen` = codepoint length, `ba` = the blue/alpha pixel component, `caf` =
# the ASCII head of an escaped "café" test string.
propt = "propt"
clen = "clen"
ba = "ba"
caf = "caf"
# From `TAG-ASSERTs` in the renderer's tag-assertion comments.
ASSER = "ASSER"

[type.po]
extend-glob = ["*.po"]
check-file = false

[type.swift.extend-words]
inout = "inout"
