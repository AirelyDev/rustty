# rustty tagged-release pipeline.
#
# PORTS: ghostty `.github/workflows/release-tag.yml` @6ad1fe7d — the `setup` ->
# `source-tarball` / `build-macos` -> `appcast` -> `upload` job graph, adapted
# from Zig+Nix to Cargo+xtask. Every step that has a rustty analogue drives the
# ALREADY-PORTED tooling instead of re-implementing it:
#
#   zig build distcheck            -> cargo run -p xtask -- distcheck
#   inline xcodebuild + codesign   -> macos/build-rustty.sh + build-rustty-signed.sh
#   dist/macos/update_appcast_tag.py -> same script (already ported, RUSTTY_* env)
#   -Dversion-string=<tag>         -> Cargo.toml [workspace.package] version,
#                                     which `xtask release-info` REQUIRES the tag
#                                     to match before anything is built.
#
# ============================ INERT BY DEFAULT ============================
# Nothing here runs, and nothing is published, until a maintainer sets the
# repository variable `RUSTTY_RELEASE_ENABLED` to `true` (Settings -> Secrets
# and variables -> Actions -> Variables). Every job is gated on it, so on a
# fork — or on this repo as shipped — a `v*` tag push is a no-op. The final
# `upload` job carries two further guards: the repository must be the canonical
# one, and a manual dispatch must explicitly ask for `upload: true`.
#
# Maintainer-provided secrets (all optional; a missing secret DEGRADES the run
# with a `::warning::` instead of failing, except in `upload`, which refuses to
# publish unsigned or unnotarized artifacts):
#   MINISIGN_KEY / MINISIGN_PASSWORD         source-tarball signatures
#   PROD_MACOS_CERTIFICATE{,_PWD,_NAME}      Developer ID codesigning
#   PROD_MACOS_CI_KEYCHAIN_PWD               CI keychain password
#   APPLE_NOTARIZATION_{ISSUER,KEY_ID,KEY}   notarization
#   PROD_MACOS_SPARKLE_KEY{,_PUB}            Sparkle appcast signing
#   CF_R2_RELEASE_{ACCOUNT_ID,AWS_KEY,SECRET_KEY}   release-artifact host
#
# DELIBERATE OMISSIONS vs the oracle (recorded, not forgotten):
#   * the `sentry-dsym` job — rustty has no Sentry project to upload to.
#   * Nix/cachix setup and the namespace.so runner pool — rustty has no flake
#     (`.port/phase-3/NON_PORTS.md` §G13) and uses GitHub-hosted runners.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (format: vX.Y.Z)"
        required: true
      upload:
        description: "Upload final artifacts to the release host"
        type: boolean
        default: false

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

name: Release Tag

# We must only run one release workflow at a time to prevent corrupting
# our release artifacts.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    if: vars.RUSTTY_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_info.outputs.version }}
      build: ${{ steps.release_info.outputs.build }}
      commit: ${{ steps.release_info.outputs.commit }}
      commit_long: ${{ steps.release_info.outputs.commit_long }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Important so that build number generation works
          fetch-depth: 0

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      # Ports the oracle's three inline bash steps — "Validate Version Input",
      # "Extract the Version" and "Extract build info" — which live in
      # xtask/src/release.rs so they are unit-tested on every CI run instead of
      # only when a tag is pushed. It appends the same four `key=value` outputs
      # to $GITHUB_OUTPUT and echoes them (the oracle's `cat $GITHUB_OUTPUT`).
      #
      # The dispatch input is passed through the environment, never
      # interpolated into the script body.
      - name: Extract the version and build info
        id: release_info
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            cargo run -q -p xtask -- release-info --ref "$GITHUB_REF"
          else
            cargo run -q -p xtask -- release-info --version "$INPUT_VERSION"
          fi

  source-tarball:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      RUSTTY_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # `xtask distcheck` == `zig build distcheck`: build the tarball, extract
      # it, assert the promised dist-only inputs are present, and build it
      # `--offline --locked` under a fresh CARGO_HOME to prove the tarball is
      # self-contained. It is the tarball producer AND the gate in one command.
      - name: Create Tarball
        run: |
          rm -rf dist/*.tar.gz
          cargo run -q -p xtask -- distcheck
          cp "dist/rustty-${RUSTTY_VERSION}.tar.gz" .
          cp "dist/rustty-${RUSTTY_VERSION}.tar.gz" rustty-source.tar.gz

      - name: Sign Tarball
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::warning title=Unsigned tarball::MINISIGN_KEY is not configured; skipping signatures. The upload job refuses to publish unsigned artifacts."
            exit 0
          fi
          printf '%s' "$MINISIGN_KEY" > minisign.key
          printf '%s' "$MINISIGN_PASSWORD" > minisign.password
          minisign -S -m "rustty-${RUSTTY_VERSION}.tar.gz" -s minisign.key < minisign.password
          minisign -S -m rustty-source.tar.gz -s minisign.key < minisign.password
          rm -f minisign.key minisign.password

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-tarball
          path: |-
            rustty-${{ env.RUSTTY_VERSION }}.tar.gz
            rustty-${{ env.RUSTTY_VERSION }}.tar.gz.minisig
            rustty-source.tar.gz
            rustty-source.tar.gz.minisig

  build-macos:
    needs: [setup]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RUSTTY_VERSION: ${{ needs.setup.outputs.version }}
      RUSTTY_BUILD: ${{ needs.setup.outputs.build }}
      RUSTTY_COMMIT: ${{ needs.setup.outputs.commit }}
      # `Release`, not the scripts' local-dev `Debug` default.
      CONFIGURATION: Release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      # The oracle pins an exact Xcode (`xcode-select -s /Applications/Xcode_26.6.app`).
      # rustty pins its Rust toolchain in rust-toolchain.toml and takes the
      # runner's default Xcode (NON_PORTS §G13: "rustty pins its toolchain in
      # rust-toolchain.toml, not an Xcode matrix"), so we only record it.
      - name: Xcode Version
        run: xcodebuild -version

      # Build UNSIGNED first: Info.plist is patched below and codesigning seals
      # it, so signing has to come after. build-rustty.sh runs `xtask
      # xcframework` + `xtask resources` and then xcodebuild.
      - name: Build Rustty.app
        run: ./macos/build-rustty.sh

      - name: Locate app bundle
        run: |
          APP="$(cd macos && xcodebuild -project Rustty.xcodeproj -scheme Rustty \
            -configuration "$CONFIGURATION" -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/ BUILT_PRODUCTS_DIR = /{d=$2} / FULL_PRODUCT_NAME = /{p=$2} END{print d"/"p}')"
          if [ ! -d "$APP" ]; then
            echo "built app not found at: $APP" >&2
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Add all our metadata to Info.plist so we can reference it later.
      - name: Update Info.plist
        env:
          SPARKLE_KEY_PUB: ${{ secrets.PROD_MACOS_SPARKLE_KEY_PUB }}
        run: |
          # Version Info
          /usr/libexec/PlistBuddy -c "Set :RusttyCommit $RUSTTY_COMMIT" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RUSTTY_BUILD" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RUSTTY_VERSION" "$APP/Contents/Info.plist"

          # Updater. The public key is baked into the checked-in Info.plist; a
          # maintainer-provided secret overrides it for a real release keypair.
          if [ -n "$SPARKLE_KEY_PUB" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_KEY_PUB" "$APP/Contents/Info.plist"
          fi
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$APP/Contents/Info.plist" || true

      # Import the Developer ID cert into a fresh CI keychain (the oracle's
      # "Codesign app bundle" preamble). Without the secret the next step signs
      # ad-hoc, which still applies the hardened runtime but is NOT notarizable.
      - name: Import codesigning certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning title=Ad-hoc signing::PROD_MACOS_CERTIFICATE is not configured; the app will be signed ad-hoc and cannot be notarized."
            exit 0
          fi
          # Turn our base64-encoded certificate back to a regular .p12 file
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12

          # We need to create a new keychain, otherwise using the certificate will prompt
          # with a UI dialog asking for the certificate password, which we can't
          # use in a headless CI environment
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          rm -f certificate.p12

      # build-rustty-signed.sh is the ported analogue of the oracle's inline
      # codesign block: inside-out signing of the Sparkle XPC services,
      # Autoupdate, Updater.app, the framework, the Dock-tile plugin and the
      # bundled dylibs, then the app bundle with macos/Rustty.entitlements and
      # the hardened runtime. An empty DEVELOPER_ID falls back to ad-hoc "-".
      - name: Codesign app bundle
        env:
          DEVELOPER_ID: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          SKIP_BUILD: "1"
        run: ./macos/build-rustty-signed.sh

      - name: Create DMG
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          npm install --global create-dmg
          if [ -n "$MACOS_CERTIFICATE_NAME" ]; then
            create-dmg --identity="$MACOS_CERTIFICATE_NAME" "$APP" ./
          else
            create-dmg "$APP" ./ || true
          fi
          mv ./Rustty*.dmg ./Rustty.dmg

      - name: Notarize DMG
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        run: |
          if [ -z "$APPLE_NOTARIZATION_KEY" ]; then
            echo "::warning title=Not notarized::APPLE_NOTARIZATION_KEY is not configured; skipping notarization. The upload job refuses to publish an unstapled DMG."
            exit 0
          fi

          # Store the notarization credentials so that we can prevent a UI password dialog
          # from blocking the CI
          echo "Create keychain profile"
          echo "$APPLE_NOTARIZATION_KEY" > notarization_key.p8
          xcrun notarytool store-credentials "notarytool-profile" --key notarization_key.p8 --key-id "$APPLE_NOTARIZATION_KEY_ID" --issuer "$APPLE_NOTARIZATION_ISSUER"
          rm notarization_key.p8

          # Here we send the notarization request to Apple's Notarization service, waiting
          # for the result. This typically takes a few seconds inside a CI environment, but
          # it might take more depending on the App characteristics.
          echo "Notarize dmg"
          xcrun notarytool submit "Rustty.dmg" --keychain-profile "notarytool-profile" --wait

          # Finally, we need to "attach the staple" to our executable, which will allow our
          # app to be validated by macOS even when an internet connection is not available.
          # We do this to both the app and the dmg
          echo "Attach staple"
          xcrun stapler staple "Rustty.dmg"
          xcrun stapler staple "$APP"

      # Zip up the app and symbols. `-universal`, as the reference names it:
      # build-rustty.sh builds the universal (aarch64 + x86_64) library and app.
      - name: Zip App
        run: |
          ( cd "$(dirname "$APP")" && zip -9 -r --symlinks "$GITHUB_WORKSPACE/rustty-macos-universal.zip" "$(basename "$APP")" )
          DSYM="$APP.dSYM"
          if [ -d "$DSYM" ]; then
            ( cd "$(dirname "$DSYM")" && zip -9 -r --symlinks "$GITHUB_WORKSPACE/rustty-macos-universal-dsym.zip" "$(basename "$DSYM")" )
          else
            echo "::warning title=No dSYM::$DSYM does not exist; publishing without debug symbols."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: |-
            Rustty.dmg
            rustty-macos-universal.zip
            rustty-macos-universal-dsym.zip

  # PORTS: ghostty release-tag.yml `sentry-dsym`. Uploads the macOS debug
  # symbols so Sentry can symbolicate crash reports from a shipped build.
  #
  # NO SECRET IS FABRICATED. The job is gated on SENTRY_AUTH_TOKEN actually
  # being configured and skips with a warning otherwise — the same shape the
  # MINISIGN_KEY steps in this file already use. Configure the repository
  # secrets SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT to turn it on;
  # rustty-crash + crates-sys/sentry-sys are already ported, so this is the
  # only missing piece of the crash-reporting pipeline.
  sentry-dsym:
    needs: [setup, build-macos]
    if: needs.setup.outputs.should_skip != 'true'
    runs-on: macos-latest
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos

      - name: Upload dSYM to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning title=Sentry upload skipped::SENTRY_AUTH_TOKEN is not configured; debug symbols were not uploaded."
            exit 0
          fi
          if [ ! -f rustty-macos-universal-dsym.zip ]; then
            echo "::warning title=No dSYM::build-macos produced no dsym zip; nothing to upload."
            exit 0
          fi
          brew install getsentry/tools/sentry-cli
          unzip -q rustty-macos-universal-dsym.zip -d dsym
          sentry-cli debug-files upload --include-sources dsym

  appcast:
    needs: [setup, build-macos]
    runs-on: macos-latest
    outputs:
      generated: ${{ steps.appcast.outputs.generated }}
    env:
      RUSTTY_VERSION: ${{ needs.setup.outputs.version }}
      RUSTTY_BUILD: ${{ needs.setup.outputs.build }}
      RUSTTY_COMMIT: ${{ needs.setup.outputs.commit }}
      RUSTTY_COMMIT_LONG: ${{ needs.setup.outputs.commit_long }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos

      # `sign_update` ships in the Sparkle release zip; the app itself resolves
      # Sparkle through SwiftPM, so this is only for the signing tool.
      - name: Setup Sparkle
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" > sparkle.zip
          unzip sparkle.zip
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Generate Appcast
        id: appcast
        env:
          SPARKLE_KEY: ${{ secrets.PROD_MACOS_SPARKLE_KEY }}
        run: |
          if [ -z "$SPARKLE_KEY" ]; then
            echo "::warning title=No appcast::PROD_MACOS_SPARKLE_KEY is not configured; skipping appcast generation. Auto-update clients will not see this release."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "RUSTTY_VERSION=$RUSTTY_VERSION RUSTTY_BUILD=$RUSTTY_BUILD RUSTTY_COMMIT=$RUSTTY_COMMIT"

          echo "$SPARKLE_KEY" > signing.key
          sign_update -f signing.key Rustty.dmg > sign_update.txt

          # Fetch the live appcast to append to. The very first release has
          # none, so seed an empty channel rather than failing (the oracle can
          # assume its appcast has existed for years).
          if ! curl -fsSL https://rustty.sh/appcast.xml > appcast.xml; then
            echo "::notice title=Seeding appcast::https://rustty.sh/appcast.xml did not resolve; starting a new appcast."
            cat > appcast.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Rustty</title>
            </channel>
          </rss>
          EOF
          fi

          python3 ./dist/macos/update_appcast_tag.py
          test -f appcast_new.xml

          # ElementTree only re-emits the `xmlns:sparkle` declaration when the
          # tree it PARSED already used that namespace (the script builds its
          # new elements from literal `sparkle:*` tag strings). Appending to a
          # seeded, item-less appcast therefore yields `<rss version="2.0">`
          # with undeclared `sparkle:` elements, which Sparkle rejects. Restore
          # it; from the second release on, the existing items carry it.
          if ! grep -q 'xmlns:sparkle' appcast_new.xml; then
            sed -i.bak 's|<rss version="2.0">|<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">|' appcast_new.xml
            rm -f appcast_new.xml.bak
            grep -q 'xmlns:sparkle' appcast_new.xml
          fi

          mv appcast_new.xml appcast.xml
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.appcast.outputs.generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkle
          path: |-
            appcast.xml

  upload:
    # Publishing guard, three locks: the pipeline must be armed for this repo,
    # the repository must be the canonical one (never a fork), and a manual run
    # must explicitly ask to upload. A `v*` tag push on the armed canonical repo
    # is the intended release trigger.
    if: |-
      vars.RUSTTY_RELEASE_ENABLED == 'true' &&
      github.repository == 'AirelyDev/rustty' &&
      (
        (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.upload == 'true') ||
        github.event_name == 'push'
      )
    needs: [setup, source-tarball, build-macos, appcast]
    runs-on: ubuntu-latest
    env:
      RUSTTY_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos

      # Only exists when the appcast job had a Sparkle key to sign with; the
      # `Prep Files` step below stages it only if it is here.
      - name: Download Sparkle Artifacts
        if: needs.appcast.outputs.generated == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkle

      - name: Download Source Tarball Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball

      # PACKAGING.md publishes a minisign public key and tells packagers to
      # verify against it, so an unsigned upload would silently break that
      # contract. Fail closed instead of publishing what the docs promise is
      # signed.
      - name: Require signatures
        run: |
          for f in "rustty-${RUSTTY_VERSION}.tar.gz" rustty-source.tar.gz; do
            if [ ! -f "$f" ]; then
              echo "missing artifact: $f" >&2
              exit 1
            fi
            if [ ! -f "$f.minisig" ]; then
              echo "refusing to publish unsigned artifact: $f (configure MINISIGN_KEY)" >&2
              exit 1
            fi
          done
          if [ ! -f Rustty.dmg ]; then
            echo "missing artifact: Rustty.dmg" >&2
            exit 1
          fi
          if ! xcrun stapler validate Rustty.dmg 2>/dev/null; then
            echo "::warning title=Unstapled DMG::Rustty.dmg has no notarization ticket (stapler validate is macOS-only, so this is advisory on this runner)."
          fi

      # Upload all of our files EXCEPT the appcast. The appcast triggers
      # updates in clients and we don't want to do that until we're
      # sure these are uploaded.
      - name: Prep Files
        run: |
          mkdir blob
          mkdir -p "blob/${RUSTTY_VERSION}"
          mv "rustty-${RUSTTY_VERSION}.tar.gz" "blob/${RUSTTY_VERSION}/rustty-${RUSTTY_VERSION}.tar.gz"
          mv "rustty-${RUSTTY_VERSION}.tar.gz.minisig" "blob/${RUSTTY_VERSION}/rustty-${RUSTTY_VERSION}.tar.gz.minisig"
          mv rustty-source.tar.gz "blob/${RUSTTY_VERSION}/rustty-source.tar.gz"
          mv rustty-source.tar.gz.minisig "blob/${RUSTTY_VERSION}/rustty-source.tar.gz.minisig"
          mv rustty-macos-universal.zip "blob/${RUSTTY_VERSION}/rustty-macos-universal.zip"
          if [ -f rustty-macos-universal-dsym.zip ]; then
            mv rustty-macos-universal-dsym.zip "blob/${RUSTTY_VERSION}/rustty-macos-universal-dsym.zip"
          fi
          mv Rustty.dmg "blob/${RUSTTY_VERSION}/Rustty.dmg"
          # Staged, not live: publish-tag.yml promotes it to /appcast.xml once
          # the artifacts above are verified to be fetchable. Absent when no
          # Sparkle key was configured (warned about in the appcast job).
          if [ -f appcast.xml ]; then
            mv appcast.xml "blob/${RUSTTY_VERSION}/appcast-staged.xml"
          fi

      - name: Upload to R2
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.CF_R2_RELEASE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CF_R2_RELEASE_AWS_KEY }}
          r2-secret-access-key: ${{ secrets.CF_R2_RELEASE_SECRET_KEY }}
          r2-bucket: rustty-release
          source-dir: blob
          destination-dir: ./
