# PORTS: ghostty .github/workflows/flatpak.yml (the publish pipeline) and
# test.yml's `build-flatpak` job (the per-push smoke build), merged into one
# workflow with two triggers.
#
# TWO DIFFERENCES FROM THE REFERENCE, both because rustty's source story is
# different:
#
# 1. NO ARTIFACT PLUMBING. The reference's flatpak.yml is workflow_dispatch-only
#    and takes a `source-run-id` / `source-artifact-id` pair, because its
#    manifest consumes a tarball produced by a separate `build-dist` job. The
#    rustty manifest consumes the tarball `xtask dist` writes, so this workflow
#    just builds it — one step, no cross-workflow artifact handoff.
#
# 2. NO GENERATED DEPENDENCY MANIFEST. See flatpak/io.airely.rustty.yml: the
#    tarball already ships `vendor/` plus a `.cargo/config.toml` redirecting
#    crates.io to it, so the build is offline by construction and there is no
#    `cargo-sources.json` to regenerate or keep in sync.
#
# 3. NO REPOSITORY GUARD. The reference's `if: github.repository == ...` sits on
#    its dispatch-only PUBLISH workflow; its per-push `build-flatpak` job (the
#    half merged in here) runs on forks too, so this merged job does as well.
#    Nothing here publishes (no release upload; the repo is a 7-day artifact).
#
# 4. THE flatpak-builder CLI, NOT THE flatpak-github-actions ACTION. The
#    reference's action (bundle/cache-key/arch) only builds and uploads a
#    bundle; this workflow additionally installs and RUNS the result and checks
#    the build option reached the binary (steps below), which needs the repo
#    that the CLI's --repo writes. Same container image family as the
#    reference (flathub-infra flatpak-github-actions:gnome-47), same arch
#    matrix (x86_64 + aarch64).
#
# VERIFIED LOCALLY before this workflow existed: built, installed and run on
# aarch64-linux with the same commands (see the manifest's header). This makes
# it keep happening.
name: Flatpak

on:
  push:
    branches: [main]
    paths:
      - "flatpak/**"
      - "dist/linux/**"
      - "crates/**"
      - "crates-sys/**"
      - "xtask/**"
      - "Cargo.lock"
      - ".github/workflows/flatpak.yml"
  pull_request:
    paths:
      - "flatpak/**"
      - "dist/linux/**"
      - "crates/**"
      - "crates-sys/**"
      - "xtask/**"
      - "Cargo.lock"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Flatpak (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      # The flathub-infra image ships flatpak-builder. The reference's tag; the
      # GNOME 50 runtime the manifest pins is installed from flathub by
      # --install-deps-from below either way.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      # The manifest's source. This is also what makes the flatpak build
      # offline: the tarball carries vendor/ + .cargo/config.toml.
      - name: Build the vendored source tarball
        run: cargo run -q -p xtask -- dist

      - name: Build the Flatpak
        run: |
          flatpak-builder --force-clean --user --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=flatpak/repo flatpak/builddir \
            flatpak/io.airely.rustty.yml

      # Building is not the same as producing something that runs. Install from
      # the local repo and execute it — the same check performed by hand when
      # the manifest was first verified.
      - name: Install and run it
        run: |
          set -euo pipefail
          flatpak remote-add --user --no-gpg-verify rustty-local flatpak/repo
          flatpak install --user -y rustty-local io.airely.rustty
          flatpak run io.airely.rustty +version | tee /tmp/version.txt
          grep -q "Rustty" /tmp/version.txt

      # `+version` is NOT enough, and that is not a hypothetical.
      #
      # The manifest used to build without the `flatpak` feature, so
      # `build_config.flatpak` was false and the binary was a Flatpak in
      # packaging only: no portal/DBus integration, no `flatpak-spawn --host`,
      # no host passwd lookup. It built, installed, ran, and printed its
      # version perfectly — every one of those checks passed on a binary with
      # its Flatpak integration switched off.
      #
      # So assert against the shipped BINARY.
      #
      # `+version` cannot carry this: the reference's own `cli/version.zig`
      # prints app-runtime/font-engine/renderer/libxev and NOT the flatpak
      # flag, and adding a field rustty's oracle does not print would be a
      # fidelity divergence (R1) to serve a test.
      #
      # `/org/freedesktop/Flatpak/Development` is the D-Bus object path in
      # `os/flatpak.rs`'s host-command call. It is compiled in ONLY when the
      # feature is on, so its presence in the binary is a direct, artifact-level
      # consequence of the build option — unlike `libgio-2.0`, which the GTK
      # stack would pull in either way and which therefore proves nothing.
      - name: Assert the flatpak build option reached the binary
        run: |
          set -euo pipefail
          bin="$(flatpak info --show-location io.airely.rustty)/files/bin/rustty"
          if ! grep -aq '/org/freedesktop/Flatpak/Development' "$bin"; then
            echo "::error::the shipped binary has no Flatpak host-command path —"
            echo "::error::it was built without the \`flatpak\` cargo feature."
            echo "::error::See flatpak/io.airely.rustty.yml for what that silently disables."
            exit 1
          fi
          echo "flatpak host-command path is present in the shipped binary"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-${{ matrix.arch }}
          path: flatpak/repo
          retention-days: 7
