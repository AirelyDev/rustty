# PORTS: ghostty .github/workflows/nix.yml.
#
# ============================== UNVERIFIED ==================================
# Never run. Nix verification is deferred by the user (no Nix install on the
# porting hosts); see .port/phase-2/VERIFICATION_DEBT.md V24. The job is INERT
# until a maintainer sets the RUSTTY_NIX_ENABLED repository variable to `true`
# (xtask/tests/release_workflows.rs asserts every job is behind that gate), so a
# push or PR on this repository, or on any fork, produces no red from it.
# ============================================================================
#
# The reference's only real job, `check-zig-cache-hash`, runs
# `nix develop -c ./nix/build-support/check-zig-cache.sh`: it regenerates the
# Zig dependency renderings (build.zig.zon.{nix,txt,json},
# flatpak/zig-packages.json) from build.zig.zon and fails if any committed copy
# is stale. rustty has none of those files: crane vendors straight from
# Cargo.lock, and the flatpak/snap builds use the vendored `xtask dist`
# tarball. The one dependency rendering rustty commits is Cargo.lock itself, so
# the Cargo shape of the same check is "Cargo.lock is in sync with the
# manifests", inside the same dev shell: `cargo metadata --locked` fails when
# the lock would have to change.
#
# Differences from the reference, all infrastructure:
#   * `ubuntu-latest` for the Namespace runner profile, and no nscloud-cache
#     step (a Namespace-only action).
#   * no cachix step: rustty has no binary cache (flake.nix records why its
#     nixConfig is absent), so there is no CACHIX_AUTH_TOKEN to push with.
#   * the canonical-repository guard names this repository.
on: [push, pull_request]
name: Nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  required:
    name: "Required Checks: Nix"
    runs-on: ubuntu-latest
    needs: [check-cargo-lock]
    steps:
      - id: status
        name: Determine status
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            result="failed"
          else
            result="success"
          fi
          {
            echo "result=${result}"
            echo "results=${results}"
          } | tee -a "$GITHUB_OUTPUT"
      - if: always() && steps.status.outputs.result != 'success'
        name: Check for failed status
        run: |
          echo "One or more required build workflows failed: ${{ steps.status.outputs.results }}"
          exit 1

  check-cargo-lock:
    if: vars.RUSTTY_NIX_ENABLED == 'true' && github.repository == 'AirelyDev/rustty'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check Cargo.lock
        run: nix develop -c cargo metadata --locked --format-version 1 > /dev/null
