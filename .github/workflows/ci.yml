# rustty CI — mirrors .port/tools/ci.sh so CI is REAL, not a paper gate.
#
# Governed by .port/PORT_RULES.md (R1-R5) and
# .port/phase-0/plan/DEFINITION_OF_PARITY.md. The single source of truth for the
# check sequence is .port/tools/ci.sh; the `ci` job only sets up the toolchain
# and invokes it. Do NOT add checks to the `ci` job that are not in ci.sh (and
# vice-versa): keeping them in lockstep is what makes "CI is real".
#
# The other jobs port reference `test.yml` jobs that need a runner, a build
# configuration or a toolchain of their own (a feature set, an NDK, an arm64
# host, an Xcode, a container), so they cannot be a gate inside ci.sh's single
# process: `valgrind`, `windows`, `windows-examples-cmake`, `macos-app`, and the
# jobs under "The remaining test.yml jobs" below (parity tail CI-1,
# NEW-FINDINGS N376). Each names the reference job it ports.
#
# Not ported: the reference's `skip` job (NON_PORTS G13 §6). Its only
# whole-run output is "every changed file is `.github/VOUCHED.td`", a governance
# file this port does not carry (user ruling), and its path filters only gate
# linter jobs that run here unconditionally inside ci.sh's G-LINT.
#
# R3: NO dependency on the ghostty tree. The reference oracle (the differential
# harness's vt_driver_ref, which links libghostty-vt.a) is used ONLY by the G4
# gate and is a locally built, gitignored binary (.port/phase-0/harness/bin/ is
# in .gitignore) — so G4 is LOCAL-ONLY: on CI run_differential.sh reports
# BLOCKED (exit 3) and ci.sh surfaces it as a WARNING, never a fabricated
# green and never a fake HARD claim. The binding byte-exact differential runs
# locally, where build_ref_driver.sh / build_port_driver.sh produce both
# drivers. The rustty crates themselves never link the reference.

name: ci

# The reference's triggers (`test.yml`): every push to every branch, every
# pull request, and manual dispatch (N376 gap 20).
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

# "We only want the latest commit to test for any non-main ref." The
# reference's group: a non-main ref shares one group per ref and cancels its
# superseded run; `main` gets a group per run, so a `main` run is never
# cancelled (N376 gap 20).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The single job branch protection points at.
  #
  # PORTS the reference `test.yml`'s `required` job. Its value is that the set
  # of jobs can change — as it does in this very commit, which adds the Windows
  # and macOS-app legs — without anyone editing branch-protection settings, and
  # a job that is SKIPPED or CANCELLED cannot be mistaken for a pass. The
  # earlier audit recommended adopting this "before the matrix grows"; it is
  # growing here.
  #
  # `needs` must list every job below except the report-only `test-esctest`,
  # which the reference also leaves out. `always()` is required or this job
  # would itself be skipped when a dependency fails.
  required:
    name: "Required Checks: rustty"
    runs-on: ubuntu-latest
    needs:
      - ci
      - valgrind
      - sanitizers
      - windows
      - windows-examples-cmake
      - macos-app
      - build-examples-cmake-cross
      - build-snap
      - build-libghostty-vt
      - build-libghostty-vt-wasm
      - build-libghostty-vt-features
      - build-libghostty-vt-android
      - build-linux
      - build-nix
      - build-macos-xcode-27
      - test-gtk
      - test-simd
      - test-sentry-linux
      - test-i18n
      - test-fuzz-libghostty
      - test-pkg-linux
      - test-debian-13
    if: always()
    steps:
      - name: Determine status
        shell: bash
        env:
          # Passed through the environment rather than interpolated into the
          # script body, so the JSON cannot terminate a shell string.
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -uo pipefail
          # RESULTS is a JSON array, e.g. ["success","success","skipped"].
          mapfile -t states < <(printf '%s' "$RESULTS" | tr -d '[]" ' | tr ',' '\n' | grep -v '^$')
          if [ "${#states[@]}" -eq 0 ]; then
            echo "::error::no dependency results — the needs list is empty or malformed"
            exit 1
          fi
          bad=0
          for s in "${states[@]}"; do
            # Anything that is not `success` — failure, cancelled, OR skipped —
            # fails. Counting `skipped` as a pass is exactly how a required
            # check silently stops checking.
            if [ "$s" != "success" ]; then
              echo "::error::a required job resolved to '$s'"
              bad=1
            fi
          done
          echo "${#states[@]} required job(s): ${states[*]}"
          exit "$bad"

  ci:
    name: rustty-ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary dev/parity target (CoreText/Metal); Linux is the
        # GTK/OpenGL target. Both run the identical ci.sh.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout (rustty only — ghostty is NOT a dependency, R3)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the channel + rustfmt/clippy components;
          # this action respects it. Components listed for belt-and-suspenders.
          components: rustfmt, clippy

      # G6 (check_leaks.sh) runs `cargo +nightly miri test` for pure-Rust
      # claimed-done crates and `-Zsanitizer=address` (nightly) for FFI crates.
      # Without nightly+miri the gate exits 3 BLOCKED (warning); installing
      # them here is what makes G6 actually RUN on CI (H7 fix).
      - name: Install nightly + miri (G6 Miri/ASan lanes)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add miri rust-src --toolchain nightly
          cargo +nightly miri setup

      # G6/G6c/G6t run Miri through `cargo miri nextest` (P7-W15); without
      # cargo-nextest they exit 3 BLOCKED. The prebuilt binary from nexte.st.
      - name: Install cargo-nextest (G6/G6c/G6t Miri runner)
        run: |
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=mac ;; esac
          curl -LsSf "https://get.nexte.st/latest/$os" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      # G4-uni (run_unicode_diff.sh) builds the uucode oracle with zig; the
      # version is pinned to match the harness requirement (0.16.0 — the
      # harness build.zig.zon's minimum_zig_version, the reference's own
      # minimum at pin 20abdb50a, and the pin the script's BLOCKED message
      # names). The oracle's uucode is the reference's revision 9d55524
      # (bumped from 2826a37a in lockstep with ghostty `12542b392` "deps:
      # Update uucode for Unicode 18", P7-W10 T2; UCD 17.0.0 -> 18.0.0), which
      # does not build under 0.15.x (and the pre-bump revision does not build
      # under 0.16), so the zig pin and the uucode revision move together
      # (.port/phase-3/NON_PORTS.md §G1). Harness tooling only, R3: no rustty
      # crate depends on zig or uucode.
      - name: Install zig 0.16.0 (pinned — G4-uni uucode oracle)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # W8-03: the live-GL renderer tests clean-skip when no GL 4.3-core
      # context exists, and this leg previously shipped NO GL stack — so a
      # green Ubuntu run proved nothing about live-GL execution (11 tests
      # reported "ok" with zero live-GL assertions run). Mesa's llvmpipe gives
      # a software GL 4.5-core context over surfaceless EGL;
      # LIBGL_ALWAYS_SOFTWARE=1 forces it, and RUSTTY_REQUIRE_GL=1 flips every
      # clean-skip arm into a hard failure (opengl::gl::test_support docs), so
      # those tests are EXECUTED evidence here, not silent skips. Env setup,
      # not a check — the check sequence stays solely in ci.sh.
      - name: Install Mesa llvmpipe + require live GL (Ubuntu only, W8-03)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
          echo "RUSTTY_REQUIRE_GL=1" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      # GPU_RD_BLUEPRINT risk F5, implemented by task-14c-1: the Metal-backed
      # renderer tests (goldens, resource leaves, draw plumbing, the windowed
      # lifecycle KAT, the restored-diagnostics tests) clean-skip when
      # `MTLCreateSystemDefaultDevice()` returns nil, so a green macOS run proved
      # nothing about live-Metal execution. The blueprint's mitigation is "pin a
      # known-Metal runner AND make the job fail-if-skipped"; its :392-395 claimed
      # that was "guarded in ci.sh", but `grep -in metal .port/tools/ci.sh`
      # returned nothing — it had never been implemented. RUSTTY_REQUIRE_METAL=1
      # flips every clean-skip arm into a hard failure (`metal::test_support`
      # docs, the RUSTTY_REQUIRE_GL sibling above), so those tests are EXECUTED
      # evidence on this leg, and a runner image that silently loses its Metal
      # device turns the job RED instead of green. Env setup, not a check — the
      # check sequence stays solely in ci.sh.
      - name: Require live Metal (macOS only, GPU_RD_BLUEPRINT F5)
        if: runner.os == 'macOS'
        run: echo "RUSTTY_REQUIRE_METAL=1" >> "$GITHUB_ENV"

      # PORT_RULES R14: the CoreText shaping tests skip when the system font
      # they ask for is not installed (the reference's SkipZigTest). Every font
      # they name — Arial Unicode MS, Noto Sans Tai Tham / Javanese / Chakma —
      # ships in a stock macOS install (/System/Library/Fonts/Supplemental), so on
      # this leg a skip means the image changed, and RUSTTY_REQUIRE_SYSTEM_FONTS=1
      # makes it a failure. NOT set on Ubuntu: a stock runner has none of these
      # fonts, and the HarfBuzz twins skip there by design. The one non-stock
      # font, Noto Serif Tibetan, is asked for only by the HarfBuzz test
      # `shape_tibetan_characters`, which is not compiled on macOS (CoreText is
      # the shaper there) and is an #[ignore]d test on the other legs.
      # Env setup, not a check — the check sequence stays solely in ci.sh.
      - name: Require the stock macOS shaping fonts (macOS only, R14)
        if: runner.os == 'macOS'
        run: echo "RUSTTY_REQUIRE_SYSTEM_FONTS=1" >> "$GITHUB_ENV"

      # PORT_RULES R14 (task S-15, the S-3 review's display follow-up): the
      # renderer's CoreVideo display-link test
      # (`sync_parks_the_link_while_idle_and_runs_it_while_dirty`) creates a
      # real `CVDisplayLink` and skips when `createWithActiveCGDisplays` fails
      # (no active display). GitHub's hosted macOS runners run a logged-in GUI
      # session, so the link should exist; RUSTTY_REQUIRE_DISPLAY=1 makes the
      # skip a failure, so `cargo test --workspace` in ci.sh runs that test as
      # enforced evidence on this leg. UNVERIFIED on the hosted image when this
      # step was added: if the leg fails with "active display required but
      # unavailable (RUSTTY_REQUIRE_DISPLAY=1)", the runner has no display and
      # that is the finding to record, not a reason to drop the variable.
      # Env setup, not a check — the check sequence stays solely in ci.sh.
      - name: Require an active display (macOS only, R14)
        if: runner.os == 'macOS'
        run: echo "RUSTTY_REQUIRE_DISPLAY=1" >> "$GITHUB_ENV"

      # parity S63-F8: the mirrored fuzz corpus lives under `.port/`, which is
      # deliberately absent from the SOURCE TARBALL — so the five corpus-replay
      # tests clean-skip when it is not there, which is right for a tarball and
      # wrong for a repo checkout, where a vanished corpus would quietly retire
      # 4,001 replays. RUSTTY_REQUIRE_FUZZ_CORPUS=1 flips that skip into a hard
      # failure on every leg that HAS the repo (the same device as the two
      # variables above). This step covers the `test` matrix job (Ubuntu +
      # macOS); the `windows` job below arms it separately because it is a
      # different job with its own env and its own shell. Env setup, not a
      # check — the check sequence stays solely in ci.sh.
      - name: Require the mirrored fuzz corpus (repo checkouts, parity S63-F8)
        run: echo "RUSTTY_REQUIRE_FUZZ_CORPUS=1" >> "$GITHUB_ENV"

      # PORT_RULES R14: xtask's CMake install/pkg-config tests and its real
      # `xgettext` run skip when the tool is missing. Both legs have them:
      # cmake ships on GitHub's Ubuntu and macOS images (G-CCONSUMER drives it),
      # and the gate-tooling step below installs gettext on both (G-I18N). So
      # here a skip means the environment lost a tool, and these variables make
      # it a failure. Env setup, not a check.
      - name: Require cmake and xgettext (xtask tests, R14)
        run: |
          echo "RUSTTY_REQUIRE_CMAKE=1" >> "$GITHUB_ENV"
          echo "RUSTTY_REQUIRE_XGETTEXT=1" >> "$GITHUB_ENV"

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # G-XTARGET builds rustty-vt-c for non-host targets. The rustup stds have
      # to be present or the gate skips them by name.
      - name: Install cross targets (G-XTARGET lane)
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustup target add x86_64-pc-windows-msvc || true
          rustup target add x86_64-unknown-freebsd || true

      # G-XCF and G-EXAMPLES (swift-vt-xcframework) run `xtask xcframework-vt`,
      # which builds the reference's Apple universal bundle: a lipo'd
      # aarch64 + x86_64 macOS slice, plus iOS device and simulator slices
      # because this runner has the iOS SDK (GhosttyLibVt.zig:146-215). Every
      # one of those standard libraries has to be installed, as in the
      # `macos-app` job below and release-tip.yml's VT job.
      - name: Install the Apple universal targets (G-XCF / G-EXAMPLES, macOS only)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim

      # G-BLUEPRINT is a Linux-only lane: blueprint-compiler is a GTK tool
      # with no macOS package, so the gate reports BLOCKED (never green) on
      # macOS. G-I18N needs the gettext tools on both legs. No valgrind here:
      # this job's G-VALGRIND is BLOCKED by RUSTTY_VALGRIND_OWN_JOB (the
      # `valgrind` job below installs it and runs the gate), and
      # G-VALGRIND-SELF runs against a fake valgrind (review L-6 F8).
      #
      # The GTK dev packages are what make G-GTKFEAT actually RUN. That gate
      # exists to lint the ~30k lines under `crates/rustty-apprt/src/gtk/**`
      # that no other lane compiles — and until this line it was BLOCKED on
      # BOTH legs (macOS has no GTK; this leg installed no GTK headers), so the
      # gate guarding the largest unlinted subsystem in the tree was running
      # nowhere. That is the same shape as the first audit's G-LINT finding:
      # configs checked in, nothing executing them. Verified by what it caught
      # the first time it ran on a machine with GTK — a dropped twin attribute
      # in the renderer that had made the lane RED (see the preceding commit).
      - name: Install gate tooling (G-BLUEPRINT / G-I18N / G-KAITAI)
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            # doxygen: G-DOXYGEN. graphviz: the Doxyfile's diagram support.
            # libglib2.0-dev: G-FEATMATRIX's `flatpak` arm links gio-2.0,
            # exactly as SharedDeps.zig:683 does.
            sudo apt-get install -y blueprint-compiler gettext \
              doxygen graphviz libglib2.0-dev \
              libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev
          else
            # kaitai-struct-compiler: G-KAITAI (the reference's `test-kaitai`
            # job). Without it the gate is BLOCKED on both legs (N402).
            brew install gettext doxygen kaitai-struct-compiler
          fi

      - name: Set up Python 3 (gate scripts + harness)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # G-ORACLE-SH-SELF (HARD, `_oracle_root.sh --self-test`) runs A5's Node
      # checker (`check-vt-struct-layouts.mjs --self-test-oracle`); without
      # `node` that arm cannot check and the gate reports BLOCKED (exit 3),
      # which ci.sh shows only as a WARNING. Pin Node here instead of relying
      # on the runner image. G-LINT's `npx prettier` uses the same Node.
      - name: Set up Node (G-ORACLE-SH-SELF's A5 arm, G-LINT's prettier)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # G-CCONSUMER (check_c_consumer.sh) drives cmake + pkg-config + cc. All
      # three are present on GitHub's runners except pkg-config on macOS, which
      # ships no pkgconf by default; without it the gate reports BLOCKED.
      - name: Install pkgconf (G-CCONSUMER lane, macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf

      # G-NIX (check_nix.sh) runs `nix flake check` — librustty-vt built in a
      # hermetic sandbox plus its five passthru tests — and `alejandra --check`.
      # Linux only: the flake's Darwin outputs evaluate, but paying for a second
      # full sandboxed build on the macOS leg buys little, and the gate reports
      # BLOCKED (never green) there instead.
      - name: Install Nix (G-NIX lane, Linux only)
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # G-LINT (check_lints.sh) is the non-Rust linter lane. Each tool it
      # cannot find reports `skipped` BY NAME instead of silently passing, so
      # without these installs the lane would be honest but nearly empty.
      # Installed here rather than in ci.sh for the same reason the Rust
      # toolchain is: this workflow sets up the environment, ci.sh owns the
      # check sequence.
      #
      # prettier comes from npx (pinned inside the gate), so only Node is
      # needed. alejandra comes from the Nix step above on Linux; on macOS the
      # gate reports it skipped by name.
      - name: Install linters (G-LINT lane)
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install typos-cli pinact shellcheck swiftlint actionlint
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
            # typos + pinact ship prebuilt binaries; the apt archives do not
            # carry either. Install from the release tarballs.
            curl -fsSL https://github.com/crate-ci/typos/releases/download/v1.49.0/typos-v1.49.0-x86_64-unknown-linux-musl.tar.gz \
              | sudo tar -xz -C /usr/local/bin ./typos
            curl -fsSL https://github.com/suzuki-shunsuke/pinact/releases/download/v4.1.1/pinact_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin pinact
            curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin actionlint
          fi

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          python3 --version

      # G4 (run_differential.sh) needs .port/phase-0/harness/bin/vt_driver_ref —
      # a locally built arm64 binary linked against libghostty-vt.a (the
      # external oracle, R3 — never a Cargo dep, never shipped to CI: the whole
      # harness/bin/ dir is gitignored). So G4 is LOCAL-ONLY on every leg:
      # run_differential.sh exits 3 BLOCKED here and ci.sh surfaces that as a
      # WARNING — an honest "did not run", never a fake green and never a fake
      # HARD claim. Same for G1b (check_test_counts.py): the ghostty oracle
      # checkout is absent on CI, so ci.sh's probe reports BLOCKED (exit 3).
      # G-EOL (its arm 3 compares the fuzz corpus against the oracle at
      # `.port/tools/gates/ORACLE_PIN`), D10 (reads the oracle's src/stb at that
      # pin), G-LOGFILE and G-REFGEOM (both need the oracle at that pin;
      # G-REFGEOM also needs Zig) are BLOCKED here for the same reason.
      # G-VTFEAT reads the oracle's lib_vt.zig/build_options.zig at the pin and
      # is BLOCKED here too (parity tail P-1b; before that it crashed with exit
      # 1). G-ESCTEST runs the reference's own esctest runner from the oracle
      # at the pin and is BLOCKED here too (the report-only `test-esctest` job
      # below runs the port's side). G-REFGEOM-SELF, G-VTFEAT-SELF and
      # G-ESCTEST-SELF need neither and run. G-EOL's
      # arms 1-2 still run, and
      # a RED in them is exit 1.
      # All of these bind locally, where the oracle exists at the pin. ci.sh
      # prints each BLOCKED gate's reason line in the WARNINGS summary, so a new
      # reason is visible even when the gate id is an expected warning.
      - name: "G4 policy note (local-only, R3)"
        run: |
          echo "G4: local-only (R3 — oracle not on CI); expect 'G4 BLOCKED (exit 3)' as a WARNING in the ci.sh summary below."
          echo "G1b: local-only for the same reason (ghostty oracle checkout absent on CI)."
          echo "G-EOL, D10, G-LOGFILE, G-REFGEOM, G-VTFEAT, G-ESCTEST: expect BLOCKED (exit 3) WARNINGs too (no oracle at ORACLE_PIN on CI); check each one's reason line."
          echo "G-ORACLE-SH-SELF needs node (set up above); a BLOCKED there means node is missing."

      # The single entry. ci.sh runs (collecting all failures):
      #   cargo fmt --check  -> clippy -D warnings -> build --workspace ->
      #   test --workspace   -> every gate in .port/tools/gates/.
      # It exits non-zero iff a HARD-FAIL check is red. Progress gates
      # (G1 check_tests_ported, G2 check_assertions, G3/G3b comments, G8
      # check_baseline_regression, G9 check_parity_surface, G5 fuzz smoke,
      # G6 check_leaks) print progress and never fail CI while crates are
      # unported (they self-flip to RED only when a *claimed-done* crate
      # regresses). G7 (check_acyclic) and G4-uni (run_unicode_diff — live
      # uucode oracle, zig-built above) are hard-fail on CI; G4
      # (run_differential) is hard-fail LOCALLY and BLOCKED->WARNING here (see
      # the policy note step above). Gate exit contract: 0 = pass, 3 = BLOCKED
      # (warning), any other non-zero = red. See .port/tools/CI.md.
      - name: Run rustty CI (.port/tools/ci.sh)
        # GITHUB_TOKEN is for G-LINT's pinact lane only: pinact resolves action
        # refs against the GitHub API and rate-limits into a false red without
        # one, so check_lints.sh skips that lane when the variable is unset.
        # Passed via `env:` rather than written into $GITHUB_ENV so the secret
        # never appears in an interpolated shell command.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # G-DIST's distcheck arm extracts the source tarball and builds it
          # cold. Worth having, not worth paying for twice — the Ubuntu leg
          # runs it, macOS gets the shape checks only and says so by name.
          RUSTTY_DISTCHECK: ${{ runner.os == 'Linux' && '1' || '0' }}
          # G-DIST's other opt-in arm: build the lib-vt tarball inside a
          # Debian 13 container, proving it does not depend on the runner's
          # own glibc/toolchain. Linux leg only — it needs a container runtime.
          RUSTTY_DISTCHECK_DEBIAN: ${{ runner.os == 'Linux' && '1' || '0' }}
          # G-NIX's VM-test arm. Left OFF: GitHub's standard runners expose no
          # /dev/kvm, so the NixOS guests would fall back to full emulation and
          # time out. The gate reports them skipped by name.
          RUSTTY_NIX_VM_TESTS: "0"
          # G-VALGRIND runs in the `valgrind` job below (the whole workspace
          # under memcheck is hours of CPU, so it is sharded there, as the
          # reference runs valgrind in a job of its own). Here the gate reports
          # BLOCKED, naming that job (NEW-FINDINGS N413).
          RUSTTY_VALGRIND_OWN_JOB: "ci.yml's valgrind job"
          # G-ASAN, G-LSAN, G-MSAN and G-TSAN run in the `sanitizers` job below, one
          # job per sanitizer (each is hours: every crate is rebuilt
          # instrumented). Here they report BLOCKED, naming that job.
          RUSTTY_SANITIZERS_OWN_JOB: "ci.yml's sanitizers job"
        run: bash .port/tools/ci.sh

  # ── Valgrind ───────────────────────────────────────────────────────────────
  # PORTS the reference's `valgrind` job (`.github/workflows/test.yml` at the
  # pin: `zig build test-valgrind`, its whole test executable under memcheck
  # with valgrind.supp, in a job of its own). G-VALGRIND's default scope is the
  # whole workspace (NEW-FINDINGS N413): measured on the Fedora aarch64 VM it
  # is hours of memcheck on one core, most of it rustty-vt's lib tests, so it
  # runs as 4 shards of 4 memcheck processes each. The shards partition every
  # test binary's test list (see the gate's header), so the four jobs together
  # run every test. Runtime on GitHub's runners: UNVERIFIED when this job was
  # added (L-6); the VM measurements are in N413.
  valgrind:
    name: rustty-valgrind (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout (rustty only — ghostty is NOT a dependency, R3)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: valgrind-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: valgrind-cargo-

      # valgrind + libc6-dbg as the reference's job installs them; Mesa's
      # llvmpipe for the renderer's live-GL tests (W8-03); and what the GTK
      # apprt lane (`rustty-apprt:gtk,wayland,x11`, in scope because GTK is
      # the reference's Linux runtime) and rustty-os's flatpak lane need to
      # build: the GTK/libadwaita/layer-shell and GLib dev packages,
      # blueprint-compiler, and gettext's msgfmt.
      - name: Install valgrind, Mesa llvmpipe and the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind libc6-dbg \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      # The same strict-mode pivots as the `ci` job (PORT_RULES R14): the GL
      # tests and the corpus replays run here as executed evidence, never as
      # silent skips. Env setup, not a check.
      - name: Require live GL and the mirrored fuzz corpus (R14)
        run: |
          {
            echo "RUSTTY_REQUIRE_GL=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "RUSTTY_REQUIRE_FUZZ_CORPUS=1"
          } >> "$GITHUB_ENV"

      - name: G-VALGRIND (shard ${{ matrix.shard }} of 4, 4 memcheck processes)
        env:
          SHARD: ${{ matrix.shard }}
        run: bash .port/tools/gates/check_valgrind.sh --shard "$SHARD/4" --jobs 4

  # ── Sanitizers ─────────────────────────────────────────────────────────────
  # G-ASAN, G-LSAN and G-MSAN (P7-W14; docs/superpowers/specs/2026-10-01-
  # memory-safety-lanes-design.md §B), one job per sanitizer on x86_64 Linux.
  # The reference has no sanitizer job (Zig's runtime safety and its leak-
  # checking test allocator play that role, plus the valgrind job); these are
  # the port's own memory-safety lanes. G-TSAN (P7-W17) joined the matrix: the
  # threaded crates only, so it is the shortest leg; it ran GREEN on rvm
  # (P7-W24, V32), and this x86_64 leg is UNVERIFIED until the next push. All of them also run on the aarch64
  # Fedora VM (rvm), including G-MSAN; this job is their x86_64 copy. Runtime
  # on GitHub's runners: UNVERIFIED until the next push (V30).
  sanitizers:
    name: rustty-sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, lsan, msan, tsan]
    steps:
      - name: Checkout (rustty only — ghostty is NOT a dependency, R3)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      # -Zsanitizer is nightly-only; MSan also needs -Zbuild-std (rust-src).
      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly

      # The same build dependencies as the valgrind job (the GTK apprt and
      # flatpak feature lanes), Mesa llvmpipe for the live-GL tests, and
      # clang for G-MSAN's instrumented C.
      - name: Install clang, Mesa llvmpipe and the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Require live GL and the mirrored fuzz corpus (R14)
        run: |
          {
            echo "RUSTTY_REQUIRE_GL=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "RUSTTY_REQUIRE_FUZZ_CORPUS=1"
          } >> "$GITHUB_ENV"

      - name: G-SAN-SELF (the sanitizers are RED on synthetic defects)
        run: bash .port/tools/gates/sanitizers.sh --self-test

      # --per-crate-target: a whole pass in one target dir is 15-20 GB
      # (measured on the aarch64 VM), more than a hosted runner reliably has
      # free; per-crate dirs are slower but hold one crate's build at a time.
      - name: G-${{ matrix.sanitizer }} over the workspace
        env:
          SAN: ${{ matrix.sanitizer }}
        run: bash .port/tools/gates/sanitizers.sh --per-crate-target --gate "$SAN"

  # ── Windows ────────────────────────────────────────────────────────────────
  # PORTS the reference's Windows jobs (`.github/workflows/test.yml` at the pin):
  #
  #   build-libghostty-vt-windows       `test-lib-vt`, `-Demit-lib-vt`, and the
  #     (:938-957)                      c-vt-static link -> the vt test, release
  #                                     library and (static link) the
  #                                     `windows-examples-cmake` job below;
  #   build-examples-cmake-windows      every CMake example except the cross one
  #     (:315-341)                      -> `windows-examples-cmake` below.
  #
  # `test-windows` (`zig build -Dapp-runtime=none test`, the full app-tier test
  # binary: renderer, termio, apprt, Command, pty, font, cli, ...) and
  # `build-libghostty-windows-gnu` (`-Dtarget=native-native-gnu
  # -Dapp-runtime=none`, the internal App+Surface+OpenGL-renderer library for
  # the GNU ABI) are REMOVED here, for parity: upstream `380778e3c` ("ci: drop
  # libghostty-internal builds on Windows" — "libghostty-internal isn't really
  # supposed to be used in Windows anyway, so why bother testing it?") dropped
  # both from `test.yml` and from `required`, 20abdb50a..12752b2ac (DECISIONS
  # R6). Rustty had ported both, as the "Build/Test the workspace" steps and
  # the "Build the apprt-c library for the GNU ABI" step, once task W-2 made
  # the application tier (rustty-core and up) compile for Windows; that work
  # is retained (the app tier still builds and clippy-checks on this job, via
  # the individual `rustty`/`rustty-apprt-c` release builds below and the
  # workspace clippy step), only the app-tier BUILD-AND-RUN-ITS-TESTS step and
  # the GNU-ABI app-library build are gone, matching upstream exactly.
  # `build-libghostty-vt-windows` is UNCHANGED upstream and stays fully
  # covered: "Test libghostty-vt" (`zig build test-lib-vt`) -> the
  # "Test librustty-vt" step below, "Build libghostty-vt" (`-Demit-lib-vt`) ->
  # "Build librustty-vt (release)".
  #
  # Task W-2 (NEW-FINDINGS N342) made rustty-core and everything above it
  # compile, link and test on Windows (the OpenGL renderer arm with the
  # reference's embedded no-op arms), so this leg now runs the whole workspace.
  # CORRECTION (task W-2): the scope note here read "Scope today is the portable
  # core: rustty-vt and its C API, plus the apprt-c DLL smoke below. This is
  # NARROWER than the reference, and the gap is a port defect (NEW-FINDINGS N342,
  # batch W-2)". Before that (task W-1b) it claimed the narrow scope matched the
  # reference, which was wrong at the pin.
  #
  # EXCLUDED, explicitly (NEW-FINDINGS N350; the `--exclude`s on the build,
  # clippy and test steps): three workspace members the
  # reference never builds for Windows, and which do not build there as
  # standalone members: `libxml2-sys` and `fontconfig-sys` (the reference's
  # Windows font backend is `freetype_windows`, `font/backend.zig:49-55`; nothing
  # in the Windows graph depends on them) and `sentry-sys` (the reference builds
  # sentry for Darwin only, `build/Config.zig:224-236`).
  windows:
    name: rustty-windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      # parity S63-F8, fix round 1: this leg runs rustty-vt's tests, which
      # include the five corpus replays, and it is a repo checkout like every
      # other leg — so it must arm the same guard. It was the one job that did
      # not, which is harmless only for as long as the corpus happens to be
      # present, and a guard whose entire purpose is to not depend on that is
      # the wrong place to be unarmed. Env setup, not a check — the check
      # sequence stays solely in ci.sh.
      #
      # PORT_RULES R14 (task W-2): xtask's tests now run here too, and cmake
      # ships on the Windows image, so its CMake install/pkg-config tests must
      # not skip either. `xgettext` is not on the image, so
      # RUSTTY_REQUIRE_XGETTEXT stays unset on this leg (the resource is absent).
      # RUSTTY_REQUIRE_UNC_SHARE stays unset too (P7-W12 T0): the kitty UNC
      # test needs the loopback administrative share (server service plus an
      # administrative token), which the runner account is not guaranteed.
      - name: Require the mirrored fuzz corpus and cmake (repo checkout, R14)
        # Explicit, like the `test_dll_init` step below: this job's other steps
        # are bare `cargo` invocations that do not care which shell runs them.
        shell: pwsh
        run: |
          echo "RUSTTY_REQUIRE_FUZZ_CORPUS=1" >> $env:GITHUB_ENV
          echo "RUSTTY_REQUIRE_CMAKE=1" >> $env:GITHUB_ENV

      # The `rustty` executable's build script compiles `dist/windows/rustty.rc`
      # with the Windows SDK's `rc.exe` (parity S63-F5; the reference's Zig has
      # its own resource compiler). rc.exe is on PATH only inside a developer
      # shell, and sourcing vcvarsall would point the build scripts' own
      # compiles at one architecture, so only the SDK's x64 bin dir is added.
      - name: Put the Windows SDK resource compiler on PATH (S63-F5)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw "rc.exe not found under the Windows 10/11 SDK" }
          echo $rc.DirectoryName >> $env:GITHUB_PATH

      # Compile verification for the application tier (rustty-core and up),
      # which task W-2 made build on Windows. `test-windows`'s TEST half
      # (`zig build -Dapp-runtime=none test` actually running the app-tier
      # test binary) is REMOVED here, for parity with upstream `380778e3c`
      # (DECISIONS R6, see the job header); the build+lint half is kept, since
      # nothing upstream asks Rustty to stop compiling here.
      #
      # The three `--exclude`s are N350's (see the job header), written inline in
      # a native shell: task W-2 measured these commands from `cmd`, and Git
      # Bash's MSYS layer rewrites PATH/HOME/TMP for native children.
      # CORRECTION (task W-2b, review W-2 F8): these steps ran under
      # `shell: bash` with the flags in a `WINDOWS_EXCLUDE` variable.
      - name: Build the workspace
        shell: pwsh
        run: cargo build --workspace --exclude libxml2-sys --exclude fontconfig-sys --exclude sentry-sys --locked

      - name: Clippy the workspace (Windows arms)
        shell: pwsh
        run: cargo clippy --workspace --exclude libxml2-sys --exclude fontconfig-sys --exclude sentry-sys --all-targets --locked -- -D warnings

      # build-libghostty-vt-windows (UNCHANGED upstream): `zig build
      # test-lib-vt`, then `-Demit-lib-vt`. Previously the `test-lib-vt` half
      # was covered incidentally by the now-removed "Test the workspace" step
      # (a `cargo test --workspace` also runs rustty-vt-c's own tests); with
      # that step gone, it needs its own, scoped step so vt-lib Windows test
      # coverage does not silently disappear along with the app-tier test run.
      - name: Test librustty-vt
        shell: pwsh
        run: cargo test -p rustty-vt-c --locked

      - name: Build librustty-vt (release)
        run: cargo build -p rustty-vt-c --release --locked

      # The Windows exe against the reference's (task W-4). At the pin both are
      # the helper CLI, a GUI-subsystem program with no window (app runtime
      # `.none`). The script runs rustty.exe over the CLI matrix and the "opened"
      # starts, and compares with the output Ghostty's own exe gave at the pin
      # (`.port/tools/windows/golden/`, captured on Windows 11; the script's
      # header has the regeneration recipe, which needs a Zig build of the
      # reference and so does not run here). The reference's CI has no such
      # step: it never builds its exe for Windows.
      - name: Build the rustty exe (release)
        run: cargo build -p rustty --release --locked

      - name: Differential of rustty.exe against the reference exe's goldens
        shell: pwsh
        run: ./.port/tools/windows/exe-differential.ps1 -Mode check -Exe target/release/rustty.exe -Golden .port/tools/windows/golden

      # `test/windows/test_dll_init.c` — the DLL-init smoke its README
      # describes. It loads the apprt-c DLL and calls `rustty_info` to prove a
      # by-value struct return survives the Windows C ABI.
      - name: Build the apprt-c DLL
        run: cargo build -p rustty-apprt-c --release --locked --no-default-features

      - name: Build and run test_dll_init
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item target\release\rustty_apprt_c.dll test\windows\ -Force
          Push-Location test\windows
          # `clang`, not `cl`: cl.exe is only on PATH inside a VS developer
          # shell, and this is exactly the command test/windows/README.md
          # documents — so CI runs what the README tells a human to run.
          # The test loads the DLL with LoadLibrary at runtime, so no import
          # library is needed at link time.
          clang test_dll_init.c -o test_dll_init.exe
          # `2>&1`: the program writes its result to STDERR (see the fprintf in
          # test_dll_init.c), so capturing stdout alone would yield an empty
          # string and the assertion below would fail on a perfectly good run.
          $out = & .\test_dll_init.exe 2>&1 | Out-String
          Write-Host $out
          # Assert, do not merely run: a DLL that loads and prints nothing
          # would otherwise pass.
          if ($out -notmatch "rustty_info:") { throw "unexpected output: $out" }
          Pop-Location

  # build-libghostty-windows-gnu (the internal App+Surface+OpenGL-renderer
  # library for the GNU ABI) is REMOVED here, for parity with upstream
  # `380778e3c` (DECISIONS R6; see the job header). It was UNVERIFIED (review
  # W-2 F8: MinGW-w64 availability on `windows-latest` was never checked, and
  # the step never ran), so nothing regresses that ever ran green.

  # build-examples-cmake-windows: each CMake example built against this
  # checkout, excluding `c-vt-cmake-cross` as the reference does ("Cross-
  # compilation with zig cc requires a single-config generator ... The Windows CI
  # uses Visual Studio"). `c-vt-cmake-static` is also the Windows static-link
  # check (`build-libghostty-vt-windows`'s c-vt-static step: that example's
  # `build.sh` is a POSIX shell script).
  windows-examples-cmake:
    name: Example ${{ matrix.dir }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dir: [c-vt-cmake, c-vt-cmake-static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Build Example
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd example/${{ matrix.dir }}
          cmake -B build -DFETCHCONTENT_SOURCE_DIR_RUSTTY=${{ github.workspace }}
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

  # ── macOS app bundle ───────────────────────────────────────────────────────
  # PORTS the reference's `build-macos` and `test-macos` jobs.
  #
  # `xcodebuild` appeared ONLY in release-tip.yml and release-tag.yml, so the
  # Xcode project, `Rustty.xctestplan` and `RusttyUITests/` were first exercised
  # at release time — the same "worst time to find out" that `G-DIST` was
  # created to eliminate for the source tarball, still open for the app.
  macos-app:
    name: rustty-macos-app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-app-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-app-cargo-

      - name: Show Xcode version
        run: xcodebuild -version

      # The XCFramework the Xcode project links against. This also covers
      # `xtask xcframework`, which G-XTASK otherwise runs only under an opt-in
      # env var because of its cost.
      # `xtask xcframework` builds the universal library by default (the
      # reference's `-Dxcframework-target` default), which needs the x86_64
      # standard library.
      - name: Install the macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build RusttyKit.xcframework
        run: cargo run --release -p xtask -- xcframework

      # Resources the Copy-Resources build phase consumes.
      - name: Stage share/ resources
        run: cargo run --release -p xtask -- resources

      - name: Build the app
        run: |
          set -euo pipefail
          cd macos
          xcodebuild -project Rustty.xcodeproj -scheme Rustty \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -40

      # `Rustty.xctestplan` + `RusttyUITests/` have never been executed by
      # anything. Unit tests only: the UI tests need a booted GUI session that
      # a headless runner does not provide, and pretending otherwise would put
      # a permanently-red or permanently-skipped job in the required set.
      - name: Run the Xcode unit tests
        run: |
          set -euo pipefail
          cd macos
          xcodebuild test -project Rustty.xcodeproj -scheme Rustty \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:RusttyTests \
            CODE_SIGNING_ALLOWED=NO | tail -60

  # ── The remaining test.yml jobs (parity tail CI-1, NEW-FINDINGS N376) ───────
  # Each job below ports the reference job it is named after
  # (`.github/workflows/test.yml` at the pin). Common differences, all
  # infrastructure: GitHub-hosted runners for the Namespace profiles
  # (`namespace-profile-ghostty-{xsm,sm,md}` -> `ubuntu-latest`,
  # `-md-arm64` -> `ubuntu-24.04-arm`, `-macos-tahoe` -> `macos-latest`); no
  # nscloud-cache or cachix step (Namespace-only, and this port has no binary
  # cache); the toolchain comes from rust-toolchain.toml instead of the Nix dev
  # shell, and the system packages the dev shell would provide are installed
  # with apt. `needs: ci` is the reference's `needs: test`. Every job is in
  # `required.needs`, as in the reference. None of them has run on GitHub's
  # runners yet: VERIFICATION_DEBT V25.

  # build-examples-cmake, the `c-vt-cmake-cross` row (N376 gap 3). The other two
  # CMake examples are built by ci.sh's G-EXAMPLES. The reference runs the
  # example inside its Nix dev shell, which has zig; the example's
  # RusttyCrossCompiler.cmake uses `zig cc` to cross-compile for Windows (MinGW)
  # from Linux, and hands it to cargo's cc-rs builds as CC_/CXX_/AR_<target>.
  build-examples-cmake-cross:
    name: Example c-vt-cmake-cross
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The target the example derives on a Linux host (its CMakeLists.txt).
      - name: Install the cross target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build Example
        run: |
          cd example/c-vt-cmake-cross
          cmake -B build -DFETCHCONTENT_SOURCE_DIR_RUSTTY=${{ github.workspace }}
          cmake --build build

  # build-snap: `zig build -Dsnap`, the app built with the Snap option
  # (N376 gap 11). Packaging it with snapcraft is snap.yml's job.
  build-snap:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Build with Snap
        run: cargo build -p rustty --features snap --locked

  # build-libghostty-vt: `zig build -Demit-lib-vt -Dtarget=<t>` over the
  # reference's six targets (N376 gap 4 named aarch64-linux and
  # x86_64-linux-musl; the other four are here too so the matrix is the
  # reference's). Zig cross-compiles every target from one Linux host; with
  # Cargo each target needs a C/C++ toolchain for the -sys crates, so each row
  # runs where one exists: the macOS rows on a macOS runner (Apple clang
  # targets both architectures), aarch64-linux on an arm64 runner (native),
  # windows-gnu with MinGW-w64, and musl with `zig cc` (Zig ships musl and a
  # C++ standard library for it, as it does for the reference).
  build-libghostty-vt:
    name: build-libghostty-vt (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Setup Zig (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Point cc-rs at zig cc (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          {
            echo "CC_x86_64_unknown_linux_musl=zig cc -target x86_64-linux-musl"
            echo "CXX_x86_64_unknown_linux_musl=zig c++ -target x86_64-linux-musl"
          } >> "$GITHUB_ENV"

      - name: Install MinGW-w64 (windows-gnu)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build -p rustty-vt-c --release --locked --target "$TARGET"

  # build-libghostty-vt-wasm (N376 gap 6): the ReleaseFast and ReleaseSmall
  # wasm modules, each optimized with wasm-opt, required to need simd128
  # (N422), and smoke-tested with test/wasm-alloc.mjs. ReleaseFast is the
  # `release` profile (build-vt-wasm.sh, as release-tip.yml); ReleaseSmall is
  # the same build at `opt-level = "z"`, the size-optimizing level Zig's
  # ReleaseSmall uses. Not ported: the "Validate WASM ABI manifest" step
  # (`test-lib-vt-schema -Dtarget=wasm32-freestanding`); G-ABISCHEMA validates
  # the native library's manifest only (N376 gap 6, still open).
  build-libghostty-vt-wasm:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node (test/wasm-alloc.mjs)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install binaryen (wasm-opt) and wasm-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          cargo install --locked wasm-tools@1.219.1

      - name: Build ReleaseFast WASM
        run: bash .port/tools/build-vt-wasm.sh

      - name: Optimize ReleaseFast WASM
        run: |
          wasm-opt -O3 --strip-dwarf \
            --enable-simd \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-nontrapping-float-to-int \
            --enable-multivalue \
            --enable-reference-types \
            zig-out/bin/rustty-vt.wasm \
            -o rustty-vt.wasm

      - name: Build ReleaseSmall WASM
        run: bash .port/tools/build-vt-wasm.sh --config 'profile.release.opt-level="z"'

      - name: Optimize ReleaseSmall WASM
        run: |
          wasm-opt -O3 \
            --enable-simd \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-nontrapping-float-to-int \
            --enable-multivalue \
            --enable-reference-types \
            zig-out/bin/rustty-vt.wasm \
            -o rustty-vt-small.wasm

      - name: Verify WASM simd128
        run: |
          # wasm-tools names the simd128 proposal "simd". The artifact must
          # fail validation when that feature is disabled.
          for artifact in rustty-vt.wasm rustty-vt-small.wasm; do
            wasm-tools validate "${artifact}"
            if wasm-tools validate \
              --features=-simd "${artifact}"; then
              echo "${artifact} unexpectedly validates with simd128 disabled" >&2
              exit 1
            fi
            echo "Verified ${artifact} requires simd128"
          done

      - name: Test WASM allocator
        run: |
          node test/wasm-alloc.mjs rustty-vt.wasm
          node test/wasm-alloc.mjs rustty-vt-small.wasm

  # build-libghostty-vt-features: "Compile-only checks for the -Dvt-features
  # flags so that future changes don't regress any feature combination."
  # (N376 gap 7). `-Dvt-features=-all` is `--no-default-features`, and
  # `-all,+<f>` adds the one feature; `simd` is a separate option
  # (`-Dsimd`, default on), so it is kept. The reference's nine tokens, in its
  # order (it does not list `search`). The wasm build compiles the C API
  # export block; `test --no-run` compiles every test without running one.
  # G-VTFEAT's export-set comparison against the oracle stays a local gate.
  build-libghostty-vt-features:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile feature flag matrix
        run: |
          features="snapshot formatter selection render-state input-encode color grid-introspection glyph-protocol kitty-graphics"
          configs="simd"
          for f in $features; do configs="$configs simd,$f"; done

          for cfg in $configs; do
            echo "::group::--no-default-features --features $cfg"
            cargo build -p rustty-vt-c --locked --no-default-features \
              --features "$cfg" \
              --target wasm32-unknown-unknown
            cargo test -p rustty-vt-c --locked --no-default-features \
              --features "$cfg" --no-run
            echo "::endgroup::"
          done

  # build-libghostty-vt-android: "lib-vt requires the Android NDK for Android
  # builds" (N376 gap 5, the recipe is NEW-FINDINGS N429). The same setup-ndk
  # action, pin and NDK as the reference. Zig's `arm-linux-androideabi`
  # (baseline v7a) is Rust's `armv7-linux-androideabi`; its NDK clang triple is
  # `armv7a-linux-androideabi`. API 29 is Zig 0.16's Android default. G-XTARGET
  # builds the named target and fails on a PT_LOAD below 16 KiB. A named
  # target that is skipped (no CXX_<t>, or a toolchain-matched link error)
  # makes it exit 3 BLOCKED, which fails this step like any other non-zero
  # exit: here BLOCKED is a failure, not a warning (N429).
  build-libghostty-vt-android:
    name: build-libghostty-vt-android (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android
          - target: x86_64-linux-android
            clang: x86_64-linux-android
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi
    runs-on: ubuntu-latest
    needs: ci
    env:
      ANDROID_NDK_VERSION: r29
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false
          link-to-sdk: false
          local-cache: true

      - name: Install the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET: ${{ matrix.target }}
          CLANG: ${{ matrix.clang }}
        run: |
          set -uo pipefail
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          tv="${TARGET//-/_}"
          tu="$(printf '%s' "$tv" | tr '[:lower:]' '[:upper:]')"
          export "CC_${tv}=$bin/${CLANG}29-clang"
          export "CXX_${tv}=$bin/${CLANG}29-clang++"
          export "AR_${tv}=$bin/llvm-ar"
          export "CARGO_TARGET_${tu}_LINKER=$bin/${CLANG}29-clang"
          rc=0
          bash .port/tools/gates/check_cross_targets.sh "$TARGET" || rc=$?
          case "$rc" in
            0) ;;
            3) echo "::error::G-XTARGET BLOCKED (exit 3): $TARGET was named but not built; this job treats BLOCKED as a failure (N429)" ;;
            *) echo "::error::G-XTARGET RED (exit $rc) for $TARGET" ;;
          esac
          exit "$rc"

  # build-linux: `zig build`, the default GTK app, on an x86_64 and an arm64
  # host (N376 gap 9).
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Test Build
        run: cargo build -p rustty --locked

  # build-nix: the Nix packages on an x86_64 and an arm64 host (N376 gap 9):
  # the release package's `+version` mode and that it is stripped, the debug
  # package's mode and that it is not (the `-Dstrip` defaults, N422), and the
  # four librustty-vt variants with their passthru tests. The installed
  # binary is `.rustty-wrapped` (wrapGAppsHook4), as the reference's is
  # `.ghostty-wrapped`; `main_rustty` is the entry module the reference's
  # `main_ghostty.main` symbol names. Not ported: the reference's
  # `build-example-c-vt-build-info` passthru test, which nix/librustty-vt.nix
  # does not have (N376 gap 9, still open).
  build-nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test release NixOS package build
        run: nix build .#rustty-releasefast

      - name: Check version
        run: result/bin/rustty +version | grep -q '.ReleaseFast'

      - name: Check to see if the binary has been stripped
        run: nm result/bin/.rustty-wrapped 2>&1 | grep -q 'no symbols'

      - name: Test debug NixOS package build
        run: nix build .#rustty-debug

      - name: Check version
        run: result/bin/rustty +version | grep -q '.Debug'

      - name: Check to see if the binary has not been stripped
        run: nm result/bin/.rustty-wrapped 2>&1 | grep -q 'main_rustty'

      - name: Test ReleaseFast build of librustty-vt
        run: |
          nix build .#librustty-vt-releasefast
          nix build .#librustty-vt-releasefast.tests.sanity-check
          nix build .#librustty-vt-releasefast.tests.pkg-config
          nix build .#librustty-vt-releasefast.tests.build-with-shared
          nix build .#librustty-vt-releasefast.tests.build-with-static

      - name: Test ReleaseFast (no SIMD) build of librustty-vt
        run: |
          nix build .#librustty-vt-releasefast-no-simd
          nix build .#librustty-vt-releasefast-no-simd.tests.sanity-check
          nix build .#librustty-vt-releasefast-no-simd.tests.pkg-config
          nix build .#librustty-vt-releasefast-no-simd.tests.build-with-shared
          nix build .#librustty-vt-releasefast-no-simd.tests.build-with-static

      - name: Test Debug build of librustty-vt
        run: |
          nix build .#librustty-vt-debug
          nix build .#librustty-vt-debug.tests.sanity-check
          nix build .#librustty-vt-debug.tests.pkg-config
          nix build .#librustty-vt-debug.tests.build-with-shared
          nix build .#librustty-vt-debug.tests.build-with-static

      - name: Test Debug (no SIMD) build of librustty-vt
        run: |
          nix build .#librustty-vt-debug-no-simd
          nix build .#librustty-vt-debug-no-simd.tests.sanity-check
          nix build .#librustty-vt-debug-no-simd.tests.pkg-config
          nix build .#librustty-vt-debug-no-simd.tests.build-with-shared
          nix build .#librustty-vt-debug-no-simd.tests.build-with-static

  # build-macos-xcode-27: the embedding framework built with a second Xcode
  # (N376 gap 21), `zig build -Demit-macos-app=false` -> `xtask xcframework`.
  # The Xcode path is the reference's; whether GitHub's macOS image carries
  # it is part of VERIFICATION_DEBT V25.
  build-macos-xcode-27:
    runs-on: macos-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Xcode Select
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Xcode Version
        run: xcodebuild -version

      - name: Install the macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build with Xcode 27
        run: cargo run --release -p xtask -- xcframework

  # test-gtk: every combination of the X11 and Wayland arms (N376 gap 13).
  # `-Dgtk-x11=<b>` / `-Dgtk-wayland=<b>` are the `x11` / `wayland` features
  # (each allows its arm) plus RUSTTY_GTK_X11 / RUSTTY_GTK_WAYLAND (which
  # force it on or off, S65-F6). `--no-default-features` drops `simd`, a
  # separate option, so it is named again.
  test-gtk:
    strategy:
      fail-fast: false
      matrix:
        x11: ["true", "false"]
        wayland: ["true", "false"]
    name: GTK x11=${{ matrix.x11 }} wayland=${{ matrix.wayland }}
    runs-on: ubuntu-latest
    needs: ci
    env:
      RUSTTY_GTK_X11: ${{ matrix.x11 }}
      RUSTTY_GTK_WAYLAND: ${{ matrix.wayland }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Select the features
        run: |
          feats=simd,gtk
          if [ "$RUSTTY_GTK_X11" = "true" ]; then feats="$feats,x11"; fi
          if [ "$RUSTTY_GTK_WAYLAND" = "true" ]; then feats="$feats,wayland"; fi
          echo "RUSTTY_GTK_FEATURES=$feats" >> "$GITHUB_ENV"

      - name: Test
        run: |
          cargo test -p rustty-apprt -p rustty --locked \
            --no-default-features --features "$RUSTTY_GTK_FEATURES"

      - name: Build
        run: |
          cargo build -p rustty --locked \
            --no-default-features --features "$RUSTTY_GTK_FEATURES"

  # test-simd: `zig build test -Dsimd={true,false}` (NEW-FINDINGS N420). The
  # app tier's crates that carry the `simd` feature, plus rustty-simd itself;
  # `-Dsimd=false` is `--no-default-features`, with the GTK app's default
  # features named again for `rustty` (a Linux build of it without `gtk` is
  # refused). rustty-apprt-c's C-ABI smoke test loads the cdylib, so it is
  # built first with the same features.
  test-simd:
    strategy:
      fail-fast: false
      matrix:
        simd: ["true", "false"]
    name: Build -Dsimd=${{ matrix.simd }}
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Mesa llvmpipe and the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Test
        env:
          SIMD: ${{ matrix.simd }}
        run: |
          set -euo pipefail
          if [ "$SIMD" = "true" ]; then
            flags=()
          else
            flags=(--no-default-features)
          fi
          cargo build -p rustty-apprt-c --locked "${flags[@]}"
          if [ "$SIMD" != "true" ]; then
            flags+=(--features "rustty/gtk,rustty/wayland,rustty/x11")
          fi
          cargo test --no-fail-fast --locked -p rustty-simd -p rustty-core \
            -p rustty-apprt -p rustty-cli -p rustty-bench -p rustty-apprt-c \
            -p rustty "${flags[@]}"

  # test-sentry-linux: `zig build -Dsentry={true,false}` on Linux (N376 gap 15).
  test-sentry-linux:
    strategy:
      fail-fast: false
      matrix:
        sentry: ["true", "false"]
    name: Build -Dsentry=${{ matrix.sentry }}
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Test Sentry Build
        env:
          SENTRY: ${{ matrix.sentry }}
        run: |
          if [ "$SENTRY" = "true" ]; then
            cargo build -p rustty --locked --features sentry
          else
            cargo build -p rustty --locked
          fi

  # test-i18n: `zig build -Di18n={true,false}` (NEW-FINDINGS N421): the
  # option is the build-time variable RUSTTY_I18N. rustty-build-config's tests
  # check that the build resolves it.
  test-i18n:
    strategy:
      fail-fast: false
      matrix:
        i18n: ["true", "false"]
    name: Build -Di18n=${{ matrix.i18n }}
    runs-on: ubuntu-latest
    needs: ci
    env:
      RUSTTY_I18N: ${{ matrix.i18n }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blueprint-compiler gettext libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Test
        run: |
          cargo build -p rustty --locked
          cargo test -p rustty-build-config --locked

  # test-fuzz-libghostty: builds the fuzz harness package (N376 gap 16).
  # The reference's is AFL++ (`test/fuzz-libghostty`); this port's is
  # cargo-fuzz (`crates/rustty-vt/fuzz`), which needs nightly for the
  # sanitizer flags, so AFL++ and LLVM are replaced by nightly + cargo-fuzz.
  test-fuzz-libghostty:
    name: Build crates/rustty-vt/fuzz
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz@0.13.2

      - name: Verify nightly and cargo-fuzz are available
        run: |
          cargo +nightly --version
          cargo fuzz --version

      - name: Build fuzzer harness
        run: |
          cd crates/rustty-vt
          cargo +nightly fuzz build

  # test-pkg-linux: each vendored package's own tests (N376 gap 18).
  # `pkg/wuffs` is the rustty-wuffs crate.
  test-pkg-linux:
    strategy:
      fail-fast: false
      matrix:
        pkg: ["wuffs"]
    name: Test pkg/${{ matrix.pkg }}
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Test ${{ matrix.pkg }} Build
        env:
          PKG: ${{ matrix.pkg }}
        run: cargo test -p "rustty-$PKG" --locked

  # test-debian-13: the full app built in a clean Debian 13 image
  # (N376 gap 19). The reference builds its Dockerfile from the source tarball
  # of `build-dist`; this port's Dockerfile builds from a checkout (its
  # header), and the tarball's offline build in Debian 13 is G-DIST's debian
  # arm in the `ci` job. The reference's 10-minute timeout fits a cached Zig
  # build; a cold Cargo build of the app does not, so the limit is larger.
  test-debian-13:
    name: Test build on Debian 13
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          docker build \
            --build-arg DISTRO_VERSION=13 \
            -f xtask/docker/debian/Dockerfile \
            .

  # test-esctest: runs esctest against librustty-vt (438d584f0, edcaf6670).
  # Report-only, as the reference's: many tests fail today, so this never
  # fails and isn't in the required checks (the `required` job's `needs`
  # leaves it out, as the reference's does). See test/esctest/README.md. The
  # reference's `zig build run` fetches esctest itself; Cargo has no fetch
  # step, so test/esctest/fetch.sh fetches it first (the same commit,
  # SHA-256 checked). Parity is checked locally: G-ESCTEST compares this run
  # test by test with the reference's own runner at the pin. V25 until this
  # job has run on GitHub.
  test-esctest:
    name: Run esctest against librustty-vt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Run esctest
        working-directory: test/esctest
        run: (./fetch.sh >&2 && cargo run --locked) > esctest.log || true

      - name: Summarize
        if: always()
        working-directory: test/esctest
        run: |
          {
            echo '## esctest'
            echo
            grep 'tests passed' esctest.log || echo 'esctest wrote no summary.'
            echo
            echo '<details><summary>Failing tests</summary>'
            echo
            echo '```'
            sed -n '/^Failing tests:$/,$p' esctest.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esctest-log
          path: test/esctest/esctest.log
          if-no-files-found: ignore
