# rustty CI — mirrors .port/tools/ci.sh so CI is REAL, not a paper gate.
#
# Governed by .port/PORT_RULES.md (R1-R5) and
# .port/phase-0/plan/DEFINITION_OF_PARITY.md. The single source of truth for the
# check sequence is .port/tools/ci.sh; this workflow only sets up the toolchain
# and invokes it. Do NOT add checks here that are not in ci.sh (and vice-versa):
# keeping them in lockstep is what makes "CI is real".
#
# R3: NO dependency on the ghostty tree. The reference oracle (the differential
# harness's vt_driver_ref, which links libghostty-vt.a) is used ONLY by the G4
# gate and is a locally built, gitignored binary (.port/phase-0/harness/bin/ is
# in .gitignore) — so G4 is LOCAL-ONLY: on CI run_differential.sh reports
# BLOCKED (exit 3) and ci.sh surfaces it as a WARNING, never a fabricated
# green and never a fake HARD claim. The binding byte-exact differential runs
# locally, where build_ref_driver.sh / build_port_driver.sh produce both
# drivers. The rustty crates themselves never link the reference.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The single job branch protection points at.
  #
  # PORTS the reference `test.yml`'s `required` job. Its value is that the set
  # of jobs can change — as it does in this very commit, which adds the Windows
  # and macOS-app legs — without anyone editing branch-protection settings, and
  # a job that is SKIPPED or CANCELLED cannot be mistaken for a pass. The
  # earlier audit recommended adopting this "before the matrix grows"; it is
  # growing here.
  #
  # `needs` must list every job below. `always()` is required or this job would
  # itself be skipped when a dependency fails.
  required:
    name: "Required Checks: rustty"
    runs-on: ubuntu-latest
    needs:
      - ci
      - windows
      - windows-examples-cmake
      - macos-app
    if: always()
    steps:
      - name: Determine status
        shell: bash
        env:
          # Passed through the environment rather than interpolated into the
          # script body, so the JSON cannot terminate a shell string.
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -uo pipefail
          # RESULTS is a JSON array, e.g. ["success","success","skipped"].
          mapfile -t states < <(printf '%s' "$RESULTS" | tr -d '[]" ' | tr ',' '\n' | grep -v '^$')
          if [ "${#states[@]}" -eq 0 ]; then
            echo "::error::no dependency results — the needs list is empty or malformed"
            exit 1
          fi
          bad=0
          for s in "${states[@]}"; do
            # Anything that is not `success` — failure, cancelled, OR skipped —
            # fails. Counting `skipped` as a pass is exactly how a required
            # check silently stops checking.
            if [ "$s" != "success" ]; then
              echo "::error::a required job resolved to '$s'"
              bad=1
            fi
          done
          echo "${#states[@]} required job(s): ${states[*]}"
          exit "$bad"

  ci:
    name: rustty-ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary dev/parity target (CoreText/Metal); Linux is the
        # GTK/OpenGL target. Both run the identical ci.sh.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout (rustty only — ghostty is NOT a dependency, R3)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the channel + rustfmt/clippy components;
          # this action respects it. Components listed for belt-and-suspenders.
          components: rustfmt, clippy

      # G6 (check_leaks.sh) runs `cargo +nightly miri test` for pure-Rust
      # claimed-done crates and `-Zsanitizer=address` (nightly) for FFI crates.
      # Without nightly+miri the gate exits 3 BLOCKED (warning); installing
      # them here is what makes G6 actually RUN on CI (H7 fix).
      - name: Install nightly + miri (G6 Miri/ASan lanes)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add miri rust-src --toolchain nightly
          cargo +nightly miri setup

      # G4-uni (run_unicode_diff.sh) builds the uucode oracle with zig; the
      # version is pinned to match the harness requirement (0.16.0 — the
      # harness build.zig.zon's minimum_zig_version, the reference's own
      # minimum at pin 20abdb50a, and the pin the script's BLOCKED message
      # names). The oracle's uucode is the reference's revision 2826a37a,
      # which does not build under 0.15.x (and the pre-bump revision does not
      # build under 0.16), so the zig pin and the uucode revision move
      # together (.port/phase-3/NON_PORTS.md §G1). Harness tooling only, R3:
      # no rustty crate depends on zig or uucode.
      - name: Install zig 0.16.0 (pinned — G4-uni uucode oracle)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # W8-03: the live-GL renderer tests clean-skip when no GL 4.3-core
      # context exists, and this leg previously shipped NO GL stack — so a
      # green Ubuntu run proved nothing about live-GL execution (11 tests
      # reported "ok" with zero live-GL assertions run). Mesa's llvmpipe gives
      # a software GL 4.5-core context over surfaceless EGL;
      # LIBGL_ALWAYS_SOFTWARE=1 forces it, and RUSTTY_REQUIRE_GL=1 flips every
      # clean-skip arm into a hard failure (opengl::gl::test_support docs), so
      # those tests are EXECUTED evidence here, not silent skips. Env setup,
      # not a check — the check sequence stays solely in ci.sh.
      - name: Install Mesa llvmpipe + require live GL (Ubuntu only, W8-03)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
          echo "RUSTTY_REQUIRE_GL=1" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      # GPU_RD_BLUEPRINT risk F5, implemented by task-14c-1: the Metal-backed
      # renderer tests (goldens, resource leaves, draw plumbing, the windowed
      # lifecycle KAT, the restored-diagnostics tests) clean-skip when
      # `MTLCreateSystemDefaultDevice()` returns nil, so a green macOS run proved
      # nothing about live-Metal execution. The blueprint's mitigation is "pin a
      # known-Metal runner AND make the job fail-if-skipped"; its :392-395 claimed
      # that was "guarded in ci.sh", but `grep -in metal .port/tools/ci.sh`
      # returned nothing — it had never been implemented. RUSTTY_REQUIRE_METAL=1
      # flips every clean-skip arm into a hard failure (`metal::test_support`
      # docs, the RUSTTY_REQUIRE_GL sibling above), so those tests are EXECUTED
      # evidence on this leg, and a runner image that silently loses its Metal
      # device turns the job RED instead of green. Env setup, not a check — the
      # check sequence stays solely in ci.sh.
      - name: Require live Metal (macOS only, GPU_RD_BLUEPRINT F5)
        if: runner.os == 'macOS'
        run: echo "RUSTTY_REQUIRE_METAL=1" >> "$GITHUB_ENV"

      # PORT_RULES R14: the CoreText shaping tests skip when the system font
      # they ask for is not installed (the reference's SkipZigTest). Every font
      # they name — Arial Unicode MS, Noto Sans Tai Tham / Javanese / Chakma —
      # ships in a stock macOS install (/System/Library/Fonts/Supplemental), so on
      # this leg a skip means the image changed, and RUSTTY_REQUIRE_SYSTEM_FONTS=1
      # makes it a failure. NOT set on Ubuntu: a stock runner has none of these
      # fonts, and the HarfBuzz twins skip there by design. The one non-stock
      # font, Noto Serif Tibetan, is asked for only by the HarfBuzz test
      # `shape_tibetan_characters`, which is not compiled on macOS (CoreText is
      # the shaper there) and is an #[ignore]d test on the other legs.
      # Env setup, not a check — the check sequence stays solely in ci.sh.
      - name: Require the stock macOS shaping fonts (macOS only, R14)
        if: runner.os == 'macOS'
        run: echo "RUSTTY_REQUIRE_SYSTEM_FONTS=1" >> "$GITHUB_ENV"

      # PORT_RULES R14 (task S-15, the S-3 review's display follow-up): the
      # renderer's CoreVideo display-link test
      # (`sync_parks_the_link_while_idle_and_runs_it_while_dirty`) creates a
      # real `CVDisplayLink` and skips when `createWithActiveCGDisplays` fails
      # (no active display). GitHub's hosted macOS runners run a logged-in GUI
      # session, so the link should exist; RUSTTY_REQUIRE_DISPLAY=1 makes the
      # skip a failure, so `cargo test --workspace` in ci.sh runs that test as
      # enforced evidence on this leg. UNVERIFIED on the hosted image when this
      # step was added: if the leg fails with "active display required but
      # unavailable (RUSTTY_REQUIRE_DISPLAY=1)", the runner has no display and
      # that is the finding to record, not a reason to drop the variable.
      # Env setup, not a check — the check sequence stays solely in ci.sh.
      - name: Require an active display (macOS only, R14)
        if: runner.os == 'macOS'
        run: echo "RUSTTY_REQUIRE_DISPLAY=1" >> "$GITHUB_ENV"

      # parity S63-F8: the mirrored fuzz corpus lives under `.port/`, which is
      # deliberately absent from the SOURCE TARBALL — so the five corpus-replay
      # tests clean-skip when it is not there, which is right for a tarball and
      # wrong for a repo checkout, where a vanished corpus would quietly retire
      # 4,001 replays. RUSTTY_REQUIRE_FUZZ_CORPUS=1 flips that skip into a hard
      # failure on every leg that HAS the repo (the same device as the two
      # variables above). This step covers the `test` matrix job (Ubuntu +
      # macOS); the `windows` job below arms it separately because it is a
      # different job with its own env and its own shell. Env setup, not a
      # check — the check sequence stays solely in ci.sh.
      - name: Require the mirrored fuzz corpus (repo checkouts, parity S63-F8)
        run: echo "RUSTTY_REQUIRE_FUZZ_CORPUS=1" >> "$GITHUB_ENV"

      # PORT_RULES R14: xtask's CMake install/pkg-config tests and its real
      # `xgettext` run skip when the tool is missing. Both legs have them:
      # cmake ships on GitHub's Ubuntu and macOS images (G-CCONSUMER drives it),
      # and the gate-tooling step below installs gettext on both (G-I18N). So
      # here a skip means the environment lost a tool, and these variables make
      # it a failure. Env setup, not a check.
      - name: Require cmake and xgettext (xtask tests, R14)
        run: |
          echo "RUSTTY_REQUIRE_CMAKE=1" >> "$GITHUB_ENV"
          echo "RUSTTY_REQUIRE_XGETTEXT=1" >> "$GITHUB_ENV"

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # G-XTARGET builds rustty-vt-c for non-host targets. The rustup stds have
      # to be present or the gate skips them by name.
      - name: Install cross targets (G-XTARGET lane)
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustup target add x86_64-pc-windows-msvc || true
          rustup target add x86_64-unknown-freebsd || true

      # G-XCF and G-EXAMPLES (swift-vt-xcframework) run `xtask xcframework-vt`,
      # which builds the reference's Apple universal bundle: a lipo'd
      # aarch64 + x86_64 macOS slice, plus iOS device and simulator slices
      # because this runner has the iOS SDK (GhosttyLibVt.zig:146-215). Every
      # one of those standard libraries has to be installed, as in the
      # `macos-app` job below and release-tip.yml's VT job.
      - name: Install the Apple universal targets (G-XCF / G-EXAMPLES, macOS only)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim

      # G-BLUEPRINT and G-VALGRIND are Linux-only lanes: blueprint-compiler is
      # a GTK tool with no macOS package, and valgrind has no working
      # arm64-Darwin port. Both gates report BLOCKED (never green) on macOS.
      # G-I18N needs the gettext tools on both legs.
      #
      # The GTK dev packages are what make G-GTKFEAT actually RUN. That gate
      # exists to lint the ~30k lines under `crates/rustty-apprt/src/gtk/**`
      # that no other lane compiles — and until this line it was BLOCKED on
      # BOTH legs (macOS has no GTK; this leg installed no GTK headers), so the
      # gate guarding the largest unlinted subsystem in the tree was running
      # nowhere. That is the same shape as the first audit's G-LINT finding:
      # configs checked in, nothing executing them. Verified by what it caught
      # the first time it ran on a machine with GTK — a dropped twin attribute
      # in the renderer that had made the lane RED (see the preceding commit).
      - name: Install gate tooling (G-BLUEPRINT / G-VALGRIND / G-I18N / G-KAITAI)
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            # doxygen: G-DOXYGEN. graphviz: the Doxyfile's diagram support.
            # libglib2.0-dev: G-FEATMATRIX's `flatpak` arm links gio-2.0,
            # exactly as SharedDeps.zig:683 does.
            sudo apt-get install -y blueprint-compiler valgrind libc6-dbg gettext \
              doxygen graphviz libglib2.0-dev \
              libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev
          else
            # kaitai-struct-compiler: G-KAITAI (the reference's `test-kaitai`
            # job). Without it the gate is BLOCKED on both legs (N402).
            brew install gettext doxygen kaitai-struct-compiler
          fi

      - name: Set up Python 3 (gate scripts + harness)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # G-ORACLE-SH-SELF (HARD, `_oracle_root.sh --self-test`) runs A5's Node
      # checker (`check-vt-struct-layouts.mjs --self-test-oracle`); without
      # `node` that arm cannot check and the gate reports BLOCKED (exit 3),
      # which ci.sh shows only as a WARNING. Pin Node here instead of relying
      # on the runner image. G-LINT's `npx prettier` uses the same Node.
      - name: Set up Node (G-ORACLE-SH-SELF's A5 arm, G-LINT's prettier)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # G-CCONSUMER (check_c_consumer.sh) drives cmake + pkg-config + cc. All
      # three are present on GitHub's runners except pkg-config on macOS, which
      # ships no pkgconf by default; without it the gate reports BLOCKED.
      - name: Install pkgconf (G-CCONSUMER lane, macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf

      # G-NIX (check_nix.sh) runs `nix flake check` — librustty-vt built in a
      # hermetic sandbox plus its five passthru tests — and `alejandra --check`.
      # Linux only: the flake's Darwin outputs evaluate, but paying for a second
      # full sandboxed build on the macOS leg buys little, and the gate reports
      # BLOCKED (never green) there instead.
      - name: Install Nix (G-NIX lane, Linux only)
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # G-LINT (check_lints.sh) is the non-Rust linter lane. Each tool it
      # cannot find reports `skipped` BY NAME instead of silently passing, so
      # without these installs the lane would be honest but nearly empty.
      # Installed here rather than in ci.sh for the same reason the Rust
      # toolchain is: this workflow sets up the environment, ci.sh owns the
      # check sequence.
      #
      # prettier comes from npx (pinned inside the gate), so only Node is
      # needed. alejandra comes from the Nix step above on Linux; on macOS the
      # gate reports it skipped by name.
      - name: Install linters (G-LINT lane)
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install typos-cli pinact shellcheck swiftlint actionlint
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
            # typos + pinact ship prebuilt binaries; the apt archives do not
            # carry either. Install from the release tarballs.
            curl -fsSL https://github.com/crate-ci/typos/releases/download/v1.49.0/typos-v1.49.0-x86_64-unknown-linux-musl.tar.gz \
              | sudo tar -xz -C /usr/local/bin ./typos
            curl -fsSL https://github.com/suzuki-shunsuke/pinact/releases/download/v4.1.1/pinact_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin pinact
            curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin actionlint
          fi

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          python3 --version

      # G4 (run_differential.sh) needs .port/phase-0/harness/bin/vt_driver_ref —
      # a locally built arm64 binary linked against libghostty-vt.a (the
      # external oracle, R3 — never a Cargo dep, never shipped to CI: the whole
      # harness/bin/ dir is gitignored). So G4 is LOCAL-ONLY on every leg:
      # run_differential.sh exits 3 BLOCKED here and ci.sh surfaces that as a
      # WARNING — an honest "did not run", never a fake green and never a fake
      # HARD claim. Same for G1b (check_test_counts.py): the ghostty oracle
      # checkout is absent on CI, so ci.sh's probe reports BLOCKED (exit 3).
      # G-EOL (its arm 3 compares the fuzz corpus against the oracle at
      # `.port/tools/gates/ORACLE_PIN`), D10 (reads the oracle's src/stb at that
      # pin), G-LOGFILE and G-REFGEOM (both need the oracle at that pin;
      # G-REFGEOM also needs Zig) are BLOCKED here for the same reason.
      # G-VTFEAT reads the oracle's lib_vt.zig/build_options.zig at the pin and
      # is BLOCKED here too (parity tail P-1b; before that it crashed with exit
      # 1). G-REFGEOM-SELF and G-VTFEAT-SELF need neither and run. G-EOL's
      # arms 1-2 still run, and
      # a RED in them is exit 1.
      # All of these bind locally, where the oracle exists at the pin. ci.sh
      # prints each BLOCKED gate's reason line in the WARNINGS summary, so a new
      # reason is visible even when the gate id is an expected warning.
      - name: "G4 policy note (local-only, R3)"
        run: |
          echo "G4: local-only (R3 — oracle not on CI); expect 'G4 BLOCKED (exit 3)' as a WARNING in the ci.sh summary below."
          echo "G1b: local-only for the same reason (ghostty oracle checkout absent on CI)."
          echo "G-EOL, D10, G-LOGFILE, G-REFGEOM, G-VTFEAT: expect BLOCKED (exit 3) WARNINGs too (no oracle at ORACLE_PIN on CI); check each one's reason line."
          echo "G-ORACLE-SH-SELF needs node (set up above); a BLOCKED there means node is missing."

      # The single entry. ci.sh runs (collecting all failures):
      #   cargo fmt --check  -> clippy -D warnings -> build --workspace ->
      #   test --workspace   -> every gate in .port/tools/gates/.
      # It exits non-zero iff a HARD-FAIL check is red. Progress gates
      # (G1 check_tests_ported, G2 check_assertions, G3/G3b comments, G8
      # check_baseline_regression, G9 check_parity_surface, G5 fuzz smoke,
      # G6 check_leaks) print progress and never fail CI while crates are
      # unported (they self-flip to RED only when a *claimed-done* crate
      # regresses). G7 (check_acyclic) and G4-uni (run_unicode_diff — live
      # uucode oracle, zig-built above) are hard-fail on CI; G4
      # (run_differential) is hard-fail LOCALLY and BLOCKED->WARNING here (see
      # the policy note step above). Gate exit contract: 0 = pass, 3 = BLOCKED
      # (warning), any other non-zero = red. See .port/tools/CI.md.
      - name: Run rustty CI (.port/tools/ci.sh)
        # GITHUB_TOKEN is for G-LINT's pinact lane only: pinact resolves action
        # refs against the GitHub API and rate-limits into a false red without
        # one, so check_lints.sh skips that lane when the variable is unset.
        # Passed via `env:` rather than written into $GITHUB_ENV so the secret
        # never appears in an interpolated shell command.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # G-DIST's distcheck arm extracts the source tarball and builds it
          # cold. Worth having, not worth paying for twice — the Ubuntu leg
          # runs it, macOS gets the shape checks only and says so by name.
          RUSTTY_DISTCHECK: ${{ runner.os == 'Linux' && '1' || '0' }}
          # G-DIST's other opt-in arm: build the lib-vt tarball inside a
          # Debian 13 container, proving it does not depend on the runner's
          # own glibc/toolchain. Linux leg only — it needs a container runtime.
          RUSTTY_DISTCHECK_DEBIAN: ${{ runner.os == 'Linux' && '1' || '0' }}
          # G-NIX's VM-test arm. Left OFF: GitHub's standard runners expose no
          # /dev/kvm, so the NixOS guests would fall back to full emulation and
          # time out. The gate reports them skipped by name.
          RUSTTY_NIX_VM_TESTS: "0"
        run: bash .port/tools/ci.sh

  # ── Windows ────────────────────────────────────────────────────────────────
  # PORTS the reference's Windows jobs (`.github/workflows/test.yml` at the pin):
  #
  #   test-windows (:1711-1724)         `zig build -Dapp-runtime=none test`, the
  #                                     full test binary (renderer, termio,
  #                                     apprt, Command, pty, font, cli, ...)
  #                                     -> the workspace build + test steps;
  #   build-libghostty-vt-windows       `test-lib-vt`, `-Demit-lib-vt`, and the
  #     (:938-957)                      c-vt-static link -> the vt test, release
  #                                     library and (static link) the
  #                                     `windows-examples-cmake` job below;
  #   build-libghostty-windows-gnu      `-Dtarget=native-native-gnu
  #     (:959-971)                      -Dapp-runtime=none`, the internal
  #                                     library (App + Surface + the OpenGL
  #                                     renderer) for the GNU ABI -> the
  #                                     apprt-c GNU build;
  #   build-examples-cmake-windows      every CMake example except the cross one
  #     (:315-341)                      -> `windows-examples-cmake` below.
  #
  # Task W-2 (NEW-FINDINGS N342) made rustty-core and everything above it
  # compile, link and test on Windows (the OpenGL renderer arm with the
  # reference's embedded no-op arms), so this leg now runs the whole workspace.
  # CORRECTION (task W-2): the scope note here read "Scope today is the portable
  # core: rustty-vt and its C API, plus the apprt-c DLL smoke below. This is
  # NARROWER than the reference, and the gap is a port defect (NEW-FINDINGS N342,
  # batch W-2)". Before that (task W-1b) it claimed the narrow scope matched the
  # reference, which was wrong at the pin.
  #
  # EXCLUDED, explicitly (NEW-FINDINGS N350; the `--exclude`s on the build,
  # clippy and test steps): three workspace members the
  # reference never builds for Windows, and which do not build there as
  # standalone members: `libxml2-sys` and `fontconfig-sys` (the reference's
  # Windows font backend is `freetype_windows`, `font/backend.zig:49-55`; nothing
  # in the Windows graph depends on them) and `sentry-sys` (the reference builds
  # sentry for Darwin only, `build/Config.zig:224-236`).
  windows:
    name: rustty-windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      # parity S63-F8, fix round 1: this leg runs rustty-vt's tests, which
      # include the five corpus replays, and it is a repo checkout like every
      # other leg — so it must arm the same guard. It was the one job that did
      # not, which is harmless only for as long as the corpus happens to be
      # present, and a guard whose entire purpose is to not depend on that is
      # the wrong place to be unarmed. Env setup, not a check — the check
      # sequence stays solely in ci.sh.
      #
      # PORT_RULES R14 (task W-2): xtask's tests now run here too, and cmake
      # ships on the Windows image, so its CMake install/pkg-config tests must
      # not skip either. `xgettext` is not on the image, so
      # RUSTTY_REQUIRE_XGETTEXT stays unset on this leg (the resource is absent).
      - name: Require the mirrored fuzz corpus and cmake (repo checkout, R14)
        # Explicit, like the `test_dll_init` step below: this job's other steps
        # are bare `cargo` invocations that do not care which shell runs them.
        shell: pwsh
        run: |
          echo "RUSTTY_REQUIRE_FUZZ_CORPUS=1" >> $env:GITHUB_ENV
          echo "RUSTTY_REQUIRE_CMAKE=1" >> $env:GITHUB_ENV

      # The `rustty` executable's build script compiles `dist/windows/rustty.rc`
      # with the Windows SDK's `rc.exe` (parity S63-F5; the reference's Zig has
      # its own resource compiler). rc.exe is on PATH only inside a developer
      # shell, and sourcing vcvarsall would point the build scripts' own
      # compiles at one architecture, so only the SDK's x64 bin dir is added.
      - name: Put the Windows SDK resource compiler on PATH (S63-F5)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw "rc.exe not found under the Windows 10/11 SDK" }
          echo $rc.DirectoryName >> $env:GITHUB_PATH

      # test-windows: `zig build -Dapp-runtime=none test`.
      #
      # The three `--exclude`s are N350's (see the job header), written inline in
      # a native shell: task W-2 measured these commands from `cmd`, and Git
      # Bash's MSYS layer rewrites PATH/HOME/TMP for native children.
      # CORRECTION (task W-2b, review W-2 F8): these steps ran under
      # `shell: bash` with the flags in a `WINDOWS_EXCLUDE` variable.
      - name: Build the workspace
        shell: pwsh
        run: cargo build --workspace --exclude libxml2-sys --exclude fontconfig-sys --exclude sentry-sys --locked

      - name: Clippy the workspace (Windows arms)
        shell: pwsh
        run: cargo clippy --workspace --exclude libxml2-sys --exclude fontconfig-sys --exclude sentry-sys --all-targets --locked -- -D warnings

      - name: Test the workspace
        shell: pwsh
        run: cargo test --workspace --exclude libxml2-sys --exclude fontconfig-sys --exclude sentry-sys --locked

      # build-libghostty-vt-windows: `zig build -Demit-lib-vt`. (Its
      # `test-lib-vt` step is covered by the workspace test above.)
      - name: Build librustty-vt (release)
        run: cargo build -p rustty-vt-c --release --locked

      # The Windows exe against the reference's (task W-4). At the pin both are
      # the helper CLI, a GUI-subsystem program with no window (app runtime
      # `.none`). The script runs rustty.exe over the CLI matrix and the "opened"
      # starts, and compares with the output Ghostty's own exe gave at the pin
      # (`.port/tools/windows/golden/`, captured on Windows 11; the script's
      # header has the regeneration recipe, which needs a Zig build of the
      # reference and so does not run here). The reference's CI has no such
      # step: it never builds its exe for Windows.
      - name: Build the rustty exe (release)
        run: cargo build -p rustty --release --locked

      - name: Differential of rustty.exe against the reference exe's goldens
        shell: pwsh
        run: ./.port/tools/windows/exe-differential.ps1 -Mode check -Exe target/release/rustty.exe -Golden .port/tools/windows/golden

      # `test/windows/test_dll_init.c` — the DLL-init smoke its README
      # describes. It loads the apprt-c DLL and calls `rustty_info` to prove a
      # by-value struct return survives the Windows C ABI.
      - name: Build the apprt-c DLL
        run: cargo build -p rustty-apprt-c --release --locked --no-default-features

      - name: Build and run test_dll_init
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item target\release\rustty_apprt_c.dll test\windows\ -Force
          Push-Location test\windows
          # `clang`, not `cl`: cl.exe is only on PATH inside a VS developer
          # shell, and this is exactly the command test/windows/README.md
          # documents — so CI runs what the README tells a human to run.
          # The test loads the DLL with LoadLibrary at runtime, so no import
          # library is needed at link time.
          clang test_dll_init.c -o test_dll_init.exe
          # `2>&1`: the program writes its result to STDERR (see the fprintf in
          # test_dll_init.c), so capturing stdout alone would yield an empty
          # string and the assertion below would fail on a perfectly good run.
          $out = & .\test_dll_init.exe 2>&1 | Out-String
          Write-Host $out
          # Assert, do not merely run: a DLL that loads and prints nothing
          # would otherwise pass.
          if ($out -notmatch "rustty_info:") { throw "unexpected output: $out" }
          Pop-Location

      # build-libghostty-windows-gnu: the internal library (App + Surface + the
      # OpenGL renderer) for the GNU ABI — a different C ABI and linker, which
      # catches things MSVC does not.
      # CORRECTION (task W-2): this step built `rustty-vt-c` under the name of a
      # `build-ghostty-windows-gnu` job; the reference's job builds the app
      # library, which rustty-apprt-c ports.
      # UNVERIFIED (review W-2 F8): the vendored C/C++ needs a MinGW-w64
      # `gcc`/`g++` on PATH for this target; whether windows-latest provides it
      # has not been checked, and this step has never run.
      - name: Build the apprt-c library for the GNU ABI
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build -p rustty-apprt-c --target x86_64-pc-windows-gnu --locked

  # build-examples-cmake-windows: each CMake example built against this
  # checkout, excluding `c-vt-cmake-cross` as the reference does ("Cross-
  # compilation with zig cc requires a single-config generator ... The Windows CI
  # uses Visual Studio"). `c-vt-cmake-static` is also the Windows static-link
  # check (`build-libghostty-vt-windows`'s c-vt-static step: that example's
  # `build.sh` is a POSIX shell script).
  windows-examples-cmake:
    name: Example ${{ matrix.dir }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dir: [c-vt-cmake, c-vt-cmake-static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Build Example
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd example/${{ matrix.dir }}
          cmake -B build -DFETCHCONTENT_SOURCE_DIR_RUSTTY=${{ github.workspace }}
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

  # ── macOS app bundle ───────────────────────────────────────────────────────
  # PORTS the reference's `build-macos` and `test-macos` jobs.
  #
  # `xcodebuild` appeared ONLY in release-tip.yml and release-tag.yml, so the
  # Xcode project, `Rustty.xctestplan` and `RusttyUITests/` were first exercised
  # at release time — the same "worst time to find out" that `G-DIST` was
  # created to eliminate for the source tarball, still open for the app.
  macos-app:
    name: rustty-macos-app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-app-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-app-cargo-

      - name: Show Xcode version
        run: xcodebuild -version

      # The XCFramework the Xcode project links against. This also covers
      # `xtask xcframework`, which G-XTASK otherwise runs only under an opt-in
      # env var because of its cost.
      # `xtask xcframework` builds the universal library by default (the
      # reference's `-Dxcframework-target` default), which needs the x86_64
      # standard library.
      - name: Install the macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build RusttyKit.xcframework
        run: cargo run --release -p xtask -- xcframework

      # Resources the Copy-Resources build phase consumes.
      - name: Stage share/ resources
        run: cargo run --release -p xtask -- resources

      - name: Build the app
        run: |
          set -euo pipefail
          cd macos
          xcodebuild -project Rustty.xcodeproj -scheme Rustty \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -40

      # `Rustty.xctestplan` + `RusttyUITests/` have never been executed by
      # anything. Unit tests only: the UI tests need a booted GUI session that
      # a headless runner does not provide, and pretending otherwise would put
      # a permanently-red or permanently-skipped job in the required set.
      - name: Run the Xcode unit tests
        run: |
          set -euo pipefail
          cd macos
          xcodebuild test -project Rustty.xcodeproj -scheme Rustty \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:RusttyTests \
            CODE_SIGNING_ALLOWED=NO | tail -60
