# rustty-datastruct — port crate (parity port order)
#
# Crate IDENTITY is `rustty-datastruct` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-datastruct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-util.workspace = true
# `SegmentedList` (segmented_list.rs) is generic over an allocator_api2
# allocator so the OSC color list can grow through libghostty-vt's caller
# allocator handle (parity tail S7-7).
allocator-api2 = { workspace = true }
