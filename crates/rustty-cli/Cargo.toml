# rustty-cli — port crate (parity port order)
#
# Crate IDENTITY is `rustty-cli` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The `pub fn run` `///` doc comments ported from ghostty `src/cli/*.zig` (R1)
# contain indented shell-invocation examples (`rustty +ssh user@example.com`,
# `rustty +ssh-cache --clear`, re-indented to code blocks by upstream 88dc6f972
# for its help-book rendering) which rustdoc would misinterpret as runnable Rust
# doc examples. These are shell syntax, never Rust; this crate defines no
# intended doc examples (all tests live in `#[test]` blocks), so doctests are
# disabled rather than altering the faithful comment text (the same rationale as
# rustty-config / rustty-font / rustty-font-shaper).
[lib]
doctest = false

[features]
# Route the IPC actions (+new-window / +toggle-quick-terminal) through the GTK
# apprt's perform_ipc instead of the none backend when built for Linux/GTK.
gtk = ["rustty-apprt/gtk"]

# The reference's `build_options.x11` / `build_options.wayland`, which `+version`
# reads to print the `libX11` / `libwayland` enabled|disabled lines
# (`cli/version.zig:62-74`). They must exist HERE, not only on `rustty-apprt`,
# because `cfg!(feature = ...)` in `version.rs` is evaluated in THIS crate: a
# `rustty-apprt/x11` turned on elsewhere in the graph is invisible to it. Both
# imply `gtk`, exactly as `crates/rustty/Cargo.toml` has it, and `crates/rustty`
# forwards its own `x11`/`wayland` here so the shipped binary agrees with the
# apprt it links. Added by task-18 with the GTK `+version` block (S70-F1).
# CORRECTION (S65-F6, 2026-09-23): `version.rs` now prints
# `rustty_apprt::GTK_X11` / `GTK_WAYLAND`, the arms the apprt actually built,
# so these features only forward the request to rustty-apprt.
wayland = ["gtk", "rustty-apprt/wayland"]
x11 = ["gtk", "rustty-apprt/x11"]

[dependencies]
# The `LOG`-class facade (DECISION-logging.md §6r4, call shape 2 — §6r
# IMPORTANT 5's "rustty-cli calls logging::log directly" prescription was
# superseded; no crate ever adopted it). `cli/list_fonts.zig`'s two `log.err`
# sites and `cli/ghostty.zig`'s two unscoped `std.log.warn` sites emit through
# it. Plain and unconditional (§8r).
log = { workspace = true }
rustty-config = { workspace = true }
rustty-vt = { workspace = true }
rustty-font = { workspace = true }
# list_fonts / show_face (cli/list_fonts.zig + cli/show_face.zig) drive the font
# discovery + SharedGridSet pipeline, which is fully ported in rustty-font-shaper
# (the D1 shaper tier: discovery.rs CoreText + collection/codepoint_resolver/
# shared_grid_set). cli is the top app crate and font-shaper is BELOW it (above
# vt+font, below apprt/core), so cli->font-shaper is a downward edge — acyclic
# (G7; cli already reaches it transitively via rustty-core/rustty-apprt).
# The three vendored-C font backends are default-on for this crate, exactly as
# before they became features: the workspace dependency sets
# `default-features = false` (see the root manifest) purely so
# `rustty-renderer` can expose the opt-out an embedder needs, so every other
# consumer names them here and builds byte-identically (R5).
rustty-font-shaper = { workspace = true, features = ["freetype", "harfbuzz", "fontconfig"] }
rustty-input = { workspace = true }
rustty-os = { workspace = true }
# P3-W7 T2: the byte-typed environment accessors (`global.environ()`), which is
# where `internal_os.getenv`'s replacement lives upstream. rustty-global is the
# LEAF state-holder (break #1), so this is a downward edge.
rustty-global = { workspace = true }
rustty-terminfo = { workspace = true }
rustty-args = { workspace = true }
# `std.fmt.parseInt` / `parseUnsigned`: the one port (NEW-FINDINGS N120/N150).
rustty-zigstd = { workspace = true }
rustty-apprt = { workspace = true }
rustty-core = { workspace = true }
rustty-crash = { workspace = true }
# C1 (CLI_BLUEPRINT.md ADV-FIX 4): version.zig reads the build-config version /
# release-channel / app-runtime / font-backend, and version/help emit the rustty
# product name via rustty-identity (R2). Both are strictly-earlier members (2, 3)
# so the crate graph stays acyclic (G7).
# `+version` build/version constants + the product name via rustty-identity
# (R2). The renderer line derives from build_config::renderer() (no
# rustty-renderer edge needed — the renderer.zig selection switch is data);
# the libxev line reads rustty-xev's `backend()` (the reference `xev.backend`).
rustty-build-config = { workspace = true }
# `build_config.version_string` / `release_channel`: the version derived from
# the checkout, in its own leaf crate so a commit rebuilds only its readers.
rustty-version = { workspace = true }
rustty-identity = { workspace = true }
rustty-xev = { workspace = true }
# C2 (CLI_BLUEPRINT.md §7): show_config streams `config.FileFormatter` output and
# list_actions streams `input.helpgen_actions.generate` output; both are generic
# over the `rustty_cfg_fmt::Writer` trait (the ported `std.Io.Writer` surface), so
# the cli names it to adapt the Pager / stdout sinks. rustty-cfg-fmt is member 14
# (strictly-earlier), so the crate graph stays acyclic (G7).
rustty-cfg-fmt = { workspace = true }
# C3 (CLI_BLUEPRINT.md §4): the ssh-cache DiskCache reproduces the reference's
# `file.tryLock(.exclusive)`/`unlock` over `flock(2)`. R3: `libc` binds the SAME
# system call the reference's Zig std uses (no reimplementation).
libc = "0.2"
# C4 (CLI_BLUEPRINT.md §2 / ADV-FIX 6): new_window / toggle_quick_terminal build
# `apprt.performIpc` args from the ipc value types (`ipc::{Target, Action,
# NewWindow}`); rustty-apprt does NOT re-export apprt-api, so name it directly.
# apprt-api is member 16 (strictly-earlier) — the crate graph stays acyclic (G7),
# and there is NO apprt->cli back-edge (detection lives in the bin, ADV-FIX 2).
rustty-apprt-api = { workspace = true }
# C4: `none::App::perform_ipc` takes a passed-in `std.mem.Allocator`, modeled by
# the workspace-standard allocator-api2 `Allocator` trait; the headless CLI passes
# `Global` (none ignores it, returning Ok(false)).
allocator-api2 = { workspace = true }
# C5 (WIRE1): the interactive `list_colors`/`list_keybinds` `prettyPrint` render
# paths drive the vaxis TUI core (Tty/Vaxis/Window/ctlseqs/Style/Color/pretty_print).
# rustty-vaxis is a low/mid vendored crate with NO edge back to cli/config/apprt,
# so `cli -> vaxis` is a downward edge — acyclic (G7/R4).
rustty-vaxis = { workspace = true }
# WIRE2 (cli C5 finale): the interactive `list_themes` fuzzy-finder preview picker
# ranks theme names via `zf::rank`. rustty-zf is a low pure-leaf vendored-dep-port
# crate with NO edge back to cli/config/apprt, so `cli -> zf` is a downward edge —
# acyclic (G7/R4).
rustty-zf = { workspace = true }
# C5 (boo, DEFERRALS cli C5 finale): the `+boo` animation decompresses the
# `framedata` asset at runtime with RAW DEFLATE (`inflate_raw`, windowBits=-15) —
# the exact counterpart of the reference's `std.compress.flate .raw` decompress.
# zlib-sys wraps the SAME vendored zlib 1.3.1 the reference uses (R3); a low
# vendored-C -sys crate with no edge back to cli — acyclic (G7/R4).
zlib-sys = { workspace = true }

# Build-time codegen. Two generators:
#  * `help_strings.Action` (R1 port of helpgen.genActions): scans each cli action
#    module's `pub fn run` doc.  (std-only leaf, acyclic build-dep edge, G7.)
#  * `framedata.compressed` (R1 port of GhosttyFrameData.zig + framegen/main.c):
#    reads `assets/framegen/frames/*.txt`, sorts, joins with `\x01`, and raw-DEFLATE
#    compresses via `zlib-sys::deflate_raw` (the same zlib 1.3.1 + params as the
#    reference framegen). `boo` `include_bytes!`s the result from `$OUT_DIR`.
[build-dependencies]
rustty-helpgen = { workspace = true }
zlib-sys = { workspace = true }
