# rustty-font — port crate (parity port order)
#
# Crate IDENTITY is `rustty-font` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# PORT NOTE: doc comments in this crate are verbatim ports of the reference Zig
# doc comments (R1), including indented spec prose and ASCII tables (e.g. the
# `glyf` `SimpleFlags` flag-relationship table, the `head` flag bit list). rustdoc
# would misinterpret those indented blocks as runnable code examples. This crate
# defines no intended doc examples — all tests live in `#[test]` blocks — so
# doctests are disabled rather than altering the faithful comment text.
[lib]
doctest = false

[features]
# The wasm C-ABI/JS-canvas surface — `Atlas.zig`'s `Wasm` struct, ported LIVE in
# `atlas.rs` as `atlas::wasm_exports` (WS14 T4). OFF by default so the desktop font
# cluster never compiles it and every native artifact stays byte-identical (R5); it
# is turned on by `rustty-wasm` (the `main_wasm.zig` artifact) and by the browser
# harness. It enables `rustty-os/wasm-host-owned` — the `toHostOwned`/`isHostOwned`/
# `toModuleOwned` tracker `Atlas.Wasm` calls, which upstream deleted in `9dc2e5978`
# and rustty resurrected (WS14 T3). No new crate edge: `rustty-os` is already a
# dependency, and the Canvas `env` imports of `atlas_debug_canvas` are declared
# LOCALLY (rustty-font must never gain a shaper/vt edge — R4).
wasm = ["rustty-os/wasm-host-owned"]

[dependencies]
rustty-os = { workspace = true }
# Atlas.zig's scoped `log` (task S-1d): `Unsupported format for dump` and the
# wasm `atlas_debug_canvas` warning go through the facade, not direct prints.
log = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-util = { workspace = true }
rustty-render-types = { workspace = true }
# Zig's `std.fmt.parseInt`/`parseFloat` grammar for `Metrics.Modifier.parse`
# (S85-F1). A leaf over rustty-util, so no new layering edge.
rustty-zigstd = { workspace = true }
# Pure-Rust port of the z2d 0.10.0 subset (2D vector graphics) used by the glyf
# rasterizer to turn a decoded outline into an alpha8 bitmap (R3 vendored dep).
rustty-z2d = { workspace = true }
# Stable polyfill of `core::alloc::Allocator` — the faithful Rust map of Zig's
# `std.mem.Allocator` threaded through Atlas/CodepointMap (`Global` == `std.alloc`).
allocator-api2 = { workspace = true }
# nerd_font_attributes.zig's 3-level constraint table reads through
# `unicode/lut.zig`'s `Tables` (a3f3331d4), i.e. `rustty_unicode::lut::TablesRef`.
# rustty-unicode is a dependency-free leaf, so the edge adds no cycle and
# rustty-font stays pure and below vt (D1).
rustty-unicode = { workspace = true }

[dev-dependencies]
# TEST-ONLY (parity S85-F4): the reference's two `formatConfig` tests run the
# modifier through `configpkg.entryFormatter("a", ..)` and assert the WHOLE
# formatted entry line (`"a = 24%\n"`). `rustty-cfg-fmt` is the port of that
# formatter and is a dependency-free leaf crate, so the tests can assert the
# reference's string without rustty-font gaining a config edge.
rustty-cfg-fmt = { workspace = true }
# TEST-ONLY (parity S83-F3 / S86-F4): enable rustty-util's `tripwire-test`
# feature so this crate's fail-point tests trip in the RELEASE test lane too.
# Zig's `builtin.is_test` is true for the whole compilation unit at ANY optimize
# mode, so the reference's allocation-failure tests run under
# `zig build test -Doptimize=Release*`. `Module::enabled()` is
# `cfg!(any(test, debug_assertions, feature = "tripwire-test"))`, and `cfg(test)`
# there is evaluated in rustty-util's OWN compilation unit — which is not a test
# — so without this feature the fail points silently no-op in release and the
# tests had to be `#[ignore]`d. A dev-dependency activates the feature ONLY for
# test/bench/example builds, so `cargo build --release` still compiles
# `tripwire::check` away.
rustty-util = { workspace = true, features = ["tripwire-test"] }
# Pure-Rust PNG codec, used ONLY by the sprite face and glyf_rasterize PNG
# known-answer tests: it decodes the checked-in reference images AND re-encodes
# the rendered atlases so the encoded bytes are compared against the references
# first (the binary-smuggling integrity gate). This replaces ghostty's
# `z2d.png_exporter` + runtime `wuffs.png.decode` pair (wuffs-sys is ghostty's
# separate emoji-decode path and is NOT pulled in here). The encoder output is
# coupled to the checked-in reference bytes: treat upgrades that change encoder
# output as reference-regeneration events (RUSTTY_REGEN_FONT_KAT_PNGS).
png = "0.18"
