# rustty-terminfo — port crate (parity port order)
#
# Crate IDENTITY is `rustty-terminfo` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-terminfo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Parity-harness identity profile (R2). Flips the terminfo names to the
# reference ghostty values by forwarding to `rustty-identity`'s feature of the
# same name, so differential output matches the oracle byte-for-byte.
identity-oracle = ["rustty-identity/identity-oracle"]

[dependencies]
rustty-identity = { workspace = true }
