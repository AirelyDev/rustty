# rustty — the binary crate (parity port order, member 27)
#
# Produces the `rustty` binary (R2). Crate IDENTITY `rustty` IS the published
# product name here. NO dependency on the ghostty tree (R3).
[package]
name = "rustty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "rustty"
path = "src/main.rs"

[features]
# The NATIVE GTK4/libadwaita apprt backend leaf (L5.1 T12): turns
# `main_rustty`'s GUI launch path (`App::create` + `gtk::App::init/run`) on for
# the `Runtime::Gtk` build. DEFAULT-ON so a plain `cargo build -p rustty` on
# Linux or FreeBSD — where `Runtime::Gtk` is the build-config default
# (`rustty-build-config/src/apprt.rs:26-36`, the port of `apprt/runtime.zig:14-24`
# `.linux, .freebsd => .gtk`) — enters the GTK app instead of the deferred
# placeholder leaf.
#
# R5: a NO-OP off those two targets. `rustty-apprt/gtk` only pulls the gtk4-rs
# stack behind its own `cfg(any(target_os = "linux", target_os = "freebsd"))`
# table, and the GTK arm in `main_rustty.rs` is
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "gtk"))]`-gated
# — so on macOS the default `gtk` feature compiles no gtk4-rs and changes no
# behavior (the None runtime takes the usage-banner path).
# `--no-default-features` yields the headless / deferred-leaf build.
default = ["gtk", "wayland", "x11"]
gtk = ["rustty-apprt/gtk", "rustty-cli/gtk", "dep:allocator-api2"]
# Windowing-protocol arms of the GTK apprt's `winproto` union, passed through to
# rustty-apprt. Both imply `gtk` and are DEFAULT-ON (F-007): ghostty derives its
# gtk-wayland/gtk-x11 build defaults from `pkg-config --variable=targets gtk4`
# (src/build/gtk.zig probing the distro GTK), which on a normal distro GTK
# enables BOTH arms. Cargo has no declarative pkg-config autodetection, so
# default-on is the closest analogue — a default Linux/FreeBSD build gets the same
# winproto arms ghostty's default build gets. Still a NO-OP off those targets
# (R5): every protocol dep lives in rustty-apprt's
# `[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]`
# table and all winproto code is
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = ...))]`-gated,
# so macOS/embedded builds compile zero protocol crates and are byte-identical
# (same mechanism as the default-on `gtk` feature). Distros packaging a
# single-target GTK (Wayland-only or X11-only — the case ghostty's pkg-config
# probe detects) opt out with `--no-default-features --features gtk,wayland`
# (or `gtk,x11`); a
# plain `--no-default-features --features gtk` build stays noop-only. `x11`
# additionally makes `GDK_BACKEND=x11` runs land on the real X11 arm rather
# than falling through to noop.
# task-18 (S70-F1): also forwarded to rustty-cli, whose `+version` GTK block
# reads `cfg!(feature = "x11")`/`cfg!(feature = "wayland")` in ITS own crate.
wayland = ["gtk", "rustty-apprt/wayland", "rustty-cli/wayland"]
x11 = ["gtk", "rustty-apprt/x11", "rustty-cli/x11"]

# PACKAGING options — the ports of the reference's `-Dflatpak=true` and
# `-Dsnap`, which its own `flatpak/com.mitchellh.ghostty.yml` and
# `snap/snapcraft.yaml` pass. These are the features `flatpak/io.airely.rustty.yml`
# and `snap/snapcraft.yaml` pass here.
#
# OFF by default, matching the reference's option defaults: a normal
# `cargo build -p rustty` is neither a Flatpak nor a Snap build, and turning
# either on unconditionally would make an ordinary binary route its child
# processes through `flatpak-spawn --host`.
#
# `flatpak` goes through `rustty-apprt/flatpak` -> `rustty-termio/flatpak` so
# the host-command type and `build_config.flatpak` move together; `snap` reaches
# `rustty-build-config` directly because it swaps no types.
#
# `flatpak` implies `gtk` because the reference does exactly that:
# `SharedDeps.zig:663` — "When we're targeting flatpak we ALWAYS link GTK so we
# [can translate the gio headers]" — followed by
# `linkSystemLibrary("gio-2.0")`. `os/flatpak.zig`'s host-command path is built
# on GIO/GLib, so a flatpak build without the GTK stack has nothing to resolve
# those symbols against.
#
# That also makes `flatpak` a LINUX/FREEBSD-ONLY option, in rustty exactly as in
# the reference: `-Dflatpak=true` on macOS would likewise try to link gio-2.0
# and fail. Unlike `gtk` — which is a deliberate no-op off those targets — this
# one is not silently portable, so `G-FEATMATRIX` exercises it on Linux only.
flatpak = ["gtk", "rustty-apprt/flatpak"]
snap = ["rustty-build-config/snap"]

[dependencies]
# Entry points fan out only: cli, apprt, core.
rustty-cli = { workspace = true }
rustty-apprt = { workspace = true }
rustty-core = { workspace = true }
# C6 GUI leaf (L5.1 T12): `rustty_core::App::create` takes the workspace's
# `std.mem.Allocator` map — `allocator_api2::alloc::Global` — exactly as the GTK
# backend's own KATs construct `CoreApp::<A>::create(Global)`. Optional, pulled
# only by the `gtk` feature (the sole consumer is the Linux GTK launch arm).
allocator-api2 = { workspace = true, optional = true }
# C6 (CLI_BLUEPRINT.md §5/§6 + ADV-FIX 2): the bin runs the CLI action DETECTION
# itself (`cli::action::detect_iter::<cli::rustty::Action>`) and constructs its
# OWN `rustty_global::GlobalState<Action>` (NOT `rustty_core::STATE`, which is
# bound `Action=()`). Detection living HERE (bin deps cli) — instead of in
# `rustty_apprt::init` (which sits below cli and would cycle `apprt→cli`) — is the
# fix that keeps `apprt` cli-free and the crate graph acyclic (G7). rustty-global
# is member 8 (strictly-earlier) so the graph stays acyclic.
rustty-global = { workspace = true }
# C6: main_ghostty.zig branches on `build_config.app_runtime == .none` (the
# headless usage-banner path vs the Phase-3 GUI leaf) and the identity-renamed
# banner / "unknown CLI action" text emit the rustty product name via
# rustty-identity (R2). Both are strictly-earlier members (2, 3) — acyclic.
rustty-build-config = { workspace = true }
rustty-identity = { workspace = true }

[dev-dependencies]
# The "it runs" KAT (CLI_BLUEPRINT.md §7, tests/cli_smoke.rs) spawns the built
# `rustty` binary via env!("CARGO_BIN_EXE_rustty"). It reads `app_runtime()` to
# scope the no-args usage-banner assertion to the headless `.none` build (the GUI
# `.gtk` build would take the Phase-3 leaf instead). Temp dirs for the
# ssh-cache / validate-config cases are created with std::env::temp_dir (no
# extra dep — the disk_cache tests' precedent).
rustty-build-config = { workspace = true }

# The GUI-leaf KAT (`tests/gui_leaf.rs`) names `rustty_apprt::gtk::App` as a
# compile-gate that the `Runtime::Gtk` arm wires the NATIVE backend (integration
# tests reach only dev-dependencies, not the crate's regular `rustty-apprt`
# edge). Target-gated to mirror the backend's own
# `cfg(any(target_os = "linux", target_os = "freebsd"))` deps (W2D/F-002); the
# test file is itself
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "gtk"))]`,
# so without the feature nothing here is referenced.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
rustty-apprt = { workspace = true, features = ["gtk"] }
