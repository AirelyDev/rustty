# rustty — the binary crate (parity port order, member 27)
#
# Produces the `rustty` binary (R2). Crate IDENTITY `rustty` IS the published
# product name here. NO dependency on the ghostty tree (R3).
[package]
name = "rustty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "rustty"
path = "src/main.rs"

[features]
# The NATIVE GTK4/libadwaita apprt backend leaf (L5.1 T12): turns
# `main_rustty`'s GUI launch path (`App::create` + `gtk::App::init/run`) on for
# the `Runtime::Gtk` build. DEFAULT-ON so a plain `cargo build -p rustty` on
# Linux — where `Runtime::Gtk` is the build-config default
# (`rustty-build-config/src/apprt.rs:30`) — enters the GTK app instead of the
# deferred placeholder leaf.
#
# R5: a NO-OP off Linux. `rustty-apprt/gtk` only pulls the gtk4-rs stack behind
# its own `cfg(target_os = "linux")` table, and the GTK arm in `main_rustty.rs`
# is `#[cfg(all(target_os = "linux", feature = "gtk"))]`-gated — so on macOS the
# default `gtk` feature compiles no gtk4-rs and changes no behavior (the None
# runtime takes the usage-banner path). `--no-default-features` yields the
# headless / deferred-leaf build.
default = ["gtk"]
gtk = ["rustty-apprt/gtk", "rustty-cli/gtk", "dep:allocator-api2"]
# Windowing-protocol arms of the GTK apprt's `winproto` union, passed through to
# rustty-apprt. Both imply `gtk` and are OFF by default (R5: the macOS/embedded
# build never selects them, and a plain `--features gtk` build stays noop-only,
# pulling zero protocol crates). A Linux distro build enables the arms its target
# sessions need — typically both. `x11` additionally makes `GDK_BACKEND=x11` runs
# land on the real X11 arm rather than falling through to noop.
wayland = ["gtk", "rustty-apprt/wayland"]
x11 = ["gtk", "rustty-apprt/x11"]

[dependencies]
# Entry points fan out only: cli, apprt, core.
rustty-cli = { workspace = true }
rustty-apprt = { workspace = true }
rustty-core = { workspace = true }
# C6 GUI leaf (L5.1 T12): `rustty_core::App::create` takes the workspace's
# `std.mem.Allocator` map — `allocator_api2::alloc::Global` — exactly as the GTK
# backend's own KATs construct `CoreApp::<A>::create(Global)`. Optional, pulled
# only by the `gtk` feature (the sole consumer is the Linux GTK launch arm).
allocator-api2 = { workspace = true, optional = true }
# C6 (CLI_BLUEPRINT.md §5/§6 + ADV-FIX 2): the bin runs the CLI action DETECTION
# itself (`cli::action::detect_iter::<cli::rustty::Action>`) and constructs its
# OWN `rustty_global::GlobalState<Action>` (NOT `rustty_core::STATE`, which is
# bound `Action=()`). Detection living HERE (bin deps cli) — instead of in
# `rustty_apprt::init` (which sits below cli and would cycle `apprt→cli`) — is the
# fix that keeps `apprt` cli-free and the crate graph acyclic (G7). rustty-global
# is member 8 (strictly-earlier) so the graph stays acyclic.
rustty-global = { workspace = true }
# C6: main_ghostty.zig branches on `build_config.app_runtime == .none` (the
# headless usage-banner path vs the Phase-3 GUI leaf) and the identity-renamed
# banner / "unknown CLI action" text emit the rustty product name via
# rustty-identity (R2). Both are strictly-earlier members (2, 3) — acyclic.
rustty-build-config = { workspace = true }
rustty-identity = { workspace = true }

[dev-dependencies]
# The "it runs" KAT (CLI_BLUEPRINT.md §7, tests/cli_smoke.rs) spawns the built
# `rustty` binary via env!("CARGO_BIN_EXE_rustty"). It reads `app_runtime()` to
# scope the no-args usage-banner assertion to the headless `.none` build (the GUI
# `.gtk` build would take the Phase-3 leaf instead). Temp dirs for the
# ssh-cache / validate-config cases are created with std::env::temp_dir (no
# extra dep — the disk_cache tests' precedent).
rustty-build-config = { workspace = true }

# The GUI-leaf KAT (`tests/gui_leaf.rs`) names `rustty_apprt::gtk::App` as a
# compile-gate that the `Runtime::Gtk` arm wires the NATIVE backend (integration
# tests reach only dev-dependencies, not the crate's regular `rustty-apprt`
# edge). Linux-target-gated to mirror the backend's own `cfg(target_os =
# "linux")` deps; the test file is itself `#[cfg(all(target_os = "linux",
# feature = "gtk"))]`, so without the feature nothing here is referenced.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustty-apprt = { workspace = true, features = ["gtk"] }
