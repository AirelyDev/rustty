# rustty-os — port crate (parity port order)
#
# Crate IDENTITY is `rustty-os` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# R3: pty.c is vendored in-tree and compiled standalone via `cc` (see build.rs),
# matching the reference's `src/pty.c` (used by pty.zig).
build = "build.rs"

[lints]
workspace = true

[features]
# R1/R4 parity seam: `passwd.zig`'s flatpak host-command path is `comptime`-gated
# behind `build_config.flatpak` in the reference and depends on the (not-yet-ported)
# `pty`/`flatpak` groups. This feature mirrors that gate: it is OFF by default so
# the block is excluded exactly as the reference excludes it when flatpak support
# is disabled. It will be wired to the real `pty`/`flatpak` modules when those
# groups land. No behavior is added or lost.
#
# WS20: the feature now pulls in `rustty-xev` — `os/flatpak.zig`'s `FlatpakHostCommand`
# imports `xev = @import("../global.zig").xev` for `waitXev`/`Completion.c_xev`, so the
# real libxev types must be in scope (the `rustty_global::xev` anchor is `()`). Acyclic:
# rustty-xev depends only on { rustty-global, libc }, strictly below rustty-os.
flatpak = ["dep:rustty-xev"]
# The pre-`9dc2e5978` `os/wasm.zig` host-ownership allocation tracker
# (malloc/free/toHostOwned/isHostOwned/toModuleOwned). Resurrected reference code,
# needed by `font/Atlas.zig`'s `Wasm` block; OFF by default so the desktop build is
# byte-identical. Host-buildable (the map is target-agnostic) so the two reference
# tests run under plain `cargo test`.
wasm-host-owned = []

[dependencies]
# The `LOG`-class facade (DECISION-logging.md §6r4, call shape 2). See the
# task-14e-2 note below for why this is unconditional rather than wasm-gated.
log = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-util = { workspace = true }
rustty-global = { workspace = true }
rustty-build-config = { workspace = true }
# R2: the published product-identity strings (`APP_NAME`, terminfo entry names,
# the resources-dir env var prefix) used by `os/resourcesdir.zig` after
# retargeting. Source-of-truth `rustty-identity` crate (single owner of identity).
rustty-identity = { workspace = true }
# R1/R4 parity seam: the explicit-allocator trait (`core::alloc::Allocator`
# polyfill) that is the faithful map of Zig's `std.mem.Allocator`. The ported
# `pageAllocator()` (PageList.zig) implements this trait so it can be threaded as
# a real `Allocator` parameter exactly as the reference threads a `std.mem.Allocator`.
allocator-api2 = { workspace = true }
# The `ResizeInPlace` seam (rustty-zigstd::arena_allocator) — the faithful map of
# the `rawResize` entry of Zig's `std.mem.Allocator` vtable. `PageAllocator`
# implements it by delegating to the ported `TaggedPageAllocator::resize`
# (mach.zig / Zig 0.15.2 PageAllocator), so `ArenaAllocator::reset` can shrink a
# retained arena node in place exactly like the reference. Acyclic: rustty-zigstd
# depends only on rustty-util + allocator-api2 — strictly below rustty-os.
rustty-zigstd = { workspace = true }
# The libxev backend for `os/flatpak.zig`'s `FlatpakHostCommand.waitXev` (WS20).
# Optional + enabled by the `flatpak` feature, exactly as the reference gates the
# whole GIO host-command path behind `build_config.flatpak`.
rustty-xev = { workspace = true, optional = true }

# Raw FFI bindings to the platform libc (syscalls/constants used across os/*).
# R3: `libc` binds the SAME system library the reference's Zig `std.c`/`std.posix`
# layer targets — it is a binding, not a pure-Rust reimplementation.
[target.'cfg(target_family = "unix")'.dependencies]
libc = "0.2"

# macOS: Objective-C runtime + Foundation/CoreFoundation bindings (the reference
# uses these for the Darwin code paths, e.g. mach.zig/macos.zig/cf_release_thread.zig).
# R3: bindings to the SAME system frameworks, not reimplementations. `gettext-sys`
# provides the vendored libintl `locale_name_canonicalize` for os/i18n.zig.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# CFBase (CFGetRetainCount/CFRetained) + CFString for the cf_release live KAT.
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFString"] }
gettext-sys = { path = "../../crates-sys/gettext-sys" }
# The live libxev kqueue Loop/Async backend for cf_release_thread (macOS-gated;
# rustty_xev::Loop/Async are #[cfg(target_os="macos")]). Acyclic: rustty-xev deps
# only { rustty-global, libc } — strictly below rustty-os.
rustty-xev = { workspace = true }

# task-14a review round 3 (finding 3): the `log` facade backend for the wasm
# artifact (`rustty-wasm`). `wasm::log` already hosts the freestanding sink
# (`freestanding::log`, the port of `os/wasm/log.zig`); this crate is the
# natural shared home for its `log::Log` registration too, since it is already
# a dependency of every crate that needs to call the install fn from an actual
# JS-callable entry point (`rustty-config`'s wasm-feature `config_new`,
# `rustty-wasm`'s own atlas exports) without a layering cycle.
#
# task-14e-2: PROMOTED from `[target.'cfg(target_arch = "wasm32")'.dependencies]`
# to an unconditional dependency (moved to `[dependencies]` above). `os/
# locale.zig` and `os/cf_release_thread.zig` restore 23 `log.*` sites that are
# NATIVE-only code (the cf release thread is macOS-gated); with the dependency
# wasm-gated they could not compile. The wasm registration above is unaffected —
# `wasm32` still gets the same crate, now via the unconditional line.

[build-dependencies]
# R3: compile the vendored `pty.c` standalone with the host C compiler.
cc = "1"
# Discovers gio-2.0 for the `flatpak` feature's host-command path — the analogue
# of the reference's `linkSystemLibrary("gio-2.0", dynamic_link_opts)`
# (SharedDeps.zig:683), which is itself pkg-config-backed. Only consulted when
# that feature is on and the target is Linux/FreeBSD; see build.rs.
pkg-config = "0.3"
