# rustty-global — port crate (parity port order)
#
# Crate IDENTITY is `rustty-global` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-global"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# BREAK #1 (R4): `rustty-global` is the LEAF state-holder. Its only dependency is
# the leaf `rustty-build-config` (used by the `Logging`/log-line semantics). The
# upward crates the reference `global.zig` imported (apprt/cli/renderer/crash/font
# /os/xev) are DEFERRED SEAMS wired in `rustty-core` — pulling them in here would
# re-introduce the import cycle this break exists to sever.
rustty-build-config = { path = "../rustty-build-config" }
# BREAK #1 seam rebind (WS4): `seam::Rlimit` is the REAL `posix.rlimit`
# (`libc::rlimit`, the same type rustty-os `file::rlimit` aliases), and
# `ResourceLimits::restore` performs the reference `internal_os.restoreMaxFiles`
# setrlimit syscall directly (rustty-os sits ABOVE this leaf, so the one-line
# syscall body is mirrored here rather than imported — R4 acyclic).
libc = "0.2"
