# rustty-inspector — port crate (parity port order)
#
# Crate IDENTITY is `rustty-inspector` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-vt = { workspace = true }
rustty-font = { workspace = true }
rustty-util = { workspace = true }
# C1 (CORE_BLUEPRINT §4): widgets/key.zig's `input.Binding.Action` lives in
# rustty-input (binding.rs); `CircBuf` (EventRing) in rustty-datastruct.
# Both edges point downward (inspector is upper-tier) — acyclic.
rustty-input = { workspace = true }
rustty-datastruct = { workspace = true }
# `Allocator` parameter parity (allocator_api2 Global — termio precedent).
allocator-api2 = { workspace = true }
