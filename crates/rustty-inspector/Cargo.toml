# rustty-inspector — port crate (parity port order)
#
# Crate IDENTITY is `rustty-inspector` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-vt = { workspace = true }
# termio.rs: names `rustty_lib::allocator::{GlobalZigAllocator, ZigAllocatorRef}`
# for the inspector parser `Stream::init_alloc` (the VT-events widget backing
# allocator).
rustty-lib = { workspace = true }
rustty-font = { workspace = true }
rustty-util = { workspace = true }
# R2 acyclic overlay edge (INV-7, Task 5): the inspector's
# `widgets::renderer::Info` impls the renderer-owned `InspectorOverlay` accessor
# trait and names `rustty_renderer::overlay::Feature`. The edge points
# inspector -> renderer (renderer is the lower tier; the renderer NEVER names an
# inspector type) — acyclic, the `RendererConfig` precedent
# (renderer-config-accessor-trait-acyclic). `check_acyclic.sh` stays green.
rustty-renderer = { workspace = true }
# The inspector UI toolkit — vendored Dear ImGui 1.92.5 (docking) + Dear
# Bindings 0.17 C API (`links = "dcimgui"`). `Inspector.setup()` drives the
# shared ImGui IO (docking/sRGB flags, embedded font atlas) through it. A
# lower-tier -sys leaf (acyclic; the inspector is upper-tier).
dcimgui-sys = { workspace = true }
# C1 (CORE_BLUEPRINT §4): widgets/key.zig's `input.Binding.Action` lives in
# rustty-input (binding.rs); `CircBuf` (EventRing) in rustty-datastruct.
# Both edges point downward (inspector is upper-tier) — acyclic.
rustty-input = { workspace = true }
rustty-datastruct = { workspace = true }
# `Allocator` parameter parity (allocator_api2 Global — termio precedent).
allocator-api2 = { workspace = true }
# The `log` facade (DECISION-logging.md §6 / §6r4): `widgets/termio.zig`'s five
# `std.log.scoped(.inspector_terminal_io)` sites restore through it. rustty-inspector
# is below `rustty-vt-c` in R4's layering, so the facade is the call shape.
log = { workspace = true }
# R4 acyclic Surface seam (Inspector.rs `render`): `surface.renderer_thread.
# wakeup.notify()` crosses as a bare `&rustty_xev::Async` parameter rather than
# the core-local `renderer_thread: Thread<A>` (which names the cyclic
# `rustty_core::Surface`). `rustty-xev` is a self-contained low leaf (deps =
# {rustty-global, libc} only, per its own Cargo.toml) with no edge back to
# rustty-inspector — acyclic, `check_acyclic.sh` stays green.
rustty-xev = { workspace = true }
