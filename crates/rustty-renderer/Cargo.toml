# rustty-renderer — port crate (parity port order)
#
# Crate IDENTITY is `rustty-renderer` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-vt = { workspace = true }
rustty-os = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-unicode = { workspace = true }
rustty-util = { workspace = true }
rustty-crash = { workspace = true }
rustty-font = { workspace = true }
rustty-render-types = { workspace = true }
# renderer/generic.zig's `prepBackgroundImage` decodes the configured background
# image (PNG/JPEG) via `wuffs.png.decode`/`wuffs.jpeg.decode`. rustty-wuffs is the
# faithful port of ghostty's `pkg/wuffs` package (the safe decode wrappers over the
# `wuffs-sys` FFI leaf). A downward, acyclic edge toward the `-sys` leaf (renderer
# -> rustty-wuffs -> wuffs-sys); adds no `renderer -> config` edge (R4/G7). It adds
# a transitive C-FFI edge (wuffs-sys), but rustty-renderer is ALREADY an FFI crate
# (oniguruma-sys/glslang-sys/...) in check_leaks.sh, so G6 is unaffected.
rustty-wuffs = { workspace = true }
# renderer/Overlay.zig renders the debug overlay on the CPU via z2d (surface +
# context + pixel). rustty-z2d is a pure-Rust LEAF (its [dependencies] is empty)
# and is already an established sink below rustty-font (`rustty-font/Cargo.toml:42`),
# so this is a downward, acyclic edge parallel to font->z2d. No new FFI (pure
# Rust), so G6/check_leaks.sh is unaffected. (GPU_RD_P1_DESIGN.md §1.2.)
rustty-z2d = { workspace = true }
# rustty-font-shaper supplies the `SharedGrid` of rendered glyphs that the
# renderer's cell-vertex assembly reads from (per the R-a task scope). The
# headless cell/cursor/link/State/size logic ported in this milestone does not
# yet touch the shaper directly; the edge is wired now so the glyph-consuming
# draw path (R-d/Phase 3) has it available. The edge is acyclic.
rustty-font-shaper = { workspace = true }
# renderer/link.zig imports `../input.zig` (`inputpkg.Link`/`Highlight`) and
# `oniguruma` (`oni.Regex`). The reference imports oniguruma UNCONDITIONALLY in
# the renderer link path (same as src/input/Link.zig), so `rustty-oniguruma` is a
# NON-optional dep. Both edges are acyclic (neither input nor oniguruma depends
# on renderer; only apprt/config/core depend on renderer). This adds a C-FFI edge
# (oniguruma-sys), so rustty-renderer is an FFI crate for G6 (already in
# check_leaks.sh FFI_CRATES).
rustty-input = { workspace = true }
rustty-oniguruma = { workspace = true }
# `State.mutex` (`*std.Thread.Mutex`) is a raw pointer to the guard-less
# Zig-shaped `rustty_zigstd::thread::Mutex` — the core-tier mutex-model
# decision (CORE_BLUEPRINT §3, landed in C0). rustty-zigstd is a leaf over
# rustty-util (downward-safe).
rustty-zigstd = { workspace = true }
# rustty-xev: the `xev::Async` (Copy+Send mach-port wakeup) the CVDisplayLink
# output callback notifies — the reference `thr.draw_now: xev.Async` (W2). R4: this
# is NOT an apprt type; xev is a leaf crate (deps rustty-global + libc only), so the
# renderer -> xev edge adds no dependency cycle (check_acyclic.sh gate).
rustty-xev = { workspace = true }
# renderer/shadertoy.zig imports `glslang` + `spirv_cross` for the custom-shader
# transpile path (GLSL -> SPIR-V -> MSL/GLSL). These are the vendored FFI sys
# crates. (shadertoy.zig also imports `../config.zig` for `RepeatablePath`, but
# rustty-config ALREADY depends on rustty-renderer, so that back-edge would cycle;
# the two config-coupled `loadFromFile*` fns are deferred — see DEFERRALS.md.)
glslang-sys = { workspace = true }
spirv-cross-sys = { workspace = true }
# link.rs's `render_cell_map`/`from_config` public API takes an `Allocator`
# (`allocator_api2::alloc::Global`, matching `RenderState::string`'s parameter),
# so allocator-api2 is a NORMAL dependency (not dev-only). It also backs the
# cell/cursor tests, which drive a real `Terminal`/`RenderState`.
allocator-api2 = { workspace = true }

# macOS: the Metal graphics-API backend (GPU R-d). R3/objc2: the crates.io objc2
# framework crates REPLACE ghostty's `pkg/objc` + `pkg/macos` bindings — exactly
# as `rustty-font-shaper` replaced them for CoreText. `metal/api.zig`'s hand-rolled
# `extern`/`enum` Metal declarations -> `objc2-metal` (bindings to the SAME
# Metal.framework — identical Apple constants, not a reimplementation); `objc.Object`
# / manual message sends -> `objc2` (`Retained`/`ProtocolObject`); Foundation
# (`NSString`/`NSArray`/`NSError`/`NSRange`) -> `objc2-foundation`.
[target.'cfg(target_os = "macos")'.dependencies]
# objc2: the ObjC runtime (`Retained`/`ProtocolObject` ownership; ARC via `Drop`).
objc2 = { version = "0.6" }
# objc2-foundation: the Foundation types the Metal wrappers pass across the FFI.
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSRange"] }
# objc2-metal: Metal.framework bindings. `default-features = false` + the exact
# PER-TYPE features `metal/api.rs` re-exports (objc2-metal's `[features]` are
# per-type — e.g. `MTLPixelFormat` gates `generated/MTLPixelFormat.rs`; the
# `bitflags`/`objc2-foundation/NS*` sub-deps are pulled transitively by these).
# Only Chunk-0 vocabulary is enabled:
#   MTLCommandBuffer        -> MTLCommandBufferStatus
#   MTLRenderPass           -> MTLLoadAction, MTLStoreAction, MTLClearColor
#   MTLRenderCommandEncoder -> MTLPrimitiveType, MTLRenderStages, MTLViewport
#   MTLArgument             -> MTLIndexType
#   MTLVertexDescriptor     -> MTLVertexFormat, MTLVertexStepFunction
#   MTLResource             -> MTLResourceOptions (+ CPUCacheMode/StorageMode/
#                              HazardTrackingMode), MTLPurgeableState
#   MTLSampler              -> MTLSamplerMinMagFilter, MTLSamplerAddressMode
#   MTLRenderPipeline       -> MTLBlendFactor, MTLBlendOperation
#   MTLCommandEncoder       -> MTLBarrierScope
#   MTLTexture              -> MTLTextureUsage
#   MTLPixelFormat          -> MTLPixelFormat
#   MTLDevice               -> MTLGPUFamily, MTLCopyAllDevices,
#                              MTLCreateSystemDefaultDevice
#   MTLTypes                -> MTLRegion, MTLOrigin, MTLSize
# Chunk-1a ADD (the PURE Metal resource leaves — buffer/texture/sampler):
#   MTLBuffer               -> the `MTLBuffer` protocol (contents/length/
#                              didModifyRange) + MTLDevice newBufferWithLength:/
#                              newBufferWithBytes: (buffer.rs). NSRange (for
#                              didModifyRange:) comes from objc2-foundation above.
#   MTLAllocation          -> MTLBuffer's supertrait; also gates MTLDevice's
#                              newBufferWith*/newTextureWithDescriptor: methods.
#   MTLCommandQueue        -> MTLDevice newCommandQueue (smoke test only — proves
#                              the device is live).
# (MTLTexture already covers MTLTextureDescriptor + replaceRegion:…; MTLSampler
#  already covers MTLSamplerDescriptor + newSamplerStateWithDescriptor:.)
# Chunk 1b ADD (the draw-plumbing leaves — Pipeline/RenderPass/Target/Frame/
# shaders):
#   MTLLibrary       -> newLibraryWithData:/Source:, newFunctionWithName:,
#                       MTLFunction (shaders.rs library load + pipeline.rs funcs).
#   dispatch2        -> newLibraryWithData:error: (DispatchData → dispatch_data_t
#                       for the embedded metallib bytes; pulls the dispatch2 crate).
#   block2           -> addCompletedHandler: / MTLCommandBufferHandler (the async
#                       present seam; pulls block2 + gates DispatchData::from_bytes).
#   objc2-io-surface -> newTextureWithDescriptor:iosurface:plane: (Target's
#                       IOSurface-backed MTLTexture; pulls objc2-io-surface).
# Chunk 4 ADD (not yet): objc2-core-graphics (Target DisplayP3 setColorSpace, the
# deferred on-screen seam), and the `png` dev-dep (golden-image decode).
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLCommandBuffer",
    "MTLRenderPass",
    "MTLRenderCommandEncoder",
    "MTLArgument",
    "MTLVertexDescriptor",
    "MTLResource",
    "MTLSampler",
    "MTLRenderPipeline",
    "MTLCommandEncoder",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLDevice",
    "MTLTypes",
    "MTLBuffer",
    "MTLAllocation",
    "MTLCommandQueue",
    "MTLLibrary",
    "dispatch2",
    "block2",
    "objc2-io-surface",
] }

# IOSurface create/lock/readback (Target). The explicit per-feature set keeps the
# objc2 per-feature style: IOSurfaceRef (create/lock/base_address/bytes_per_row +
# the `kIOSurface*` CFString keys, under `objc2-core-foundation`), IOSurfaceTypes
# (IOSurfaceLockOptions), objc2 (Encode/RefEncode impls), objc2-core-foundation
# (the CFString keys), libc (lock/unlock -> kern_return_t).
objc2-io-surface = { version = "0.3", features = [
    "IOSurfaceRef",
    "IOSurfaceTypes",
    "objc2",
    "objc2-core-foundation",
    "libc",
] }

# CoreFoundation: the IOSurface property dictionary (CFDictionary + CFNumber over
# the `kIOSurface*` CFString keys) that Target.init hands to IOSurfaceCreate.
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }

# objc2-quartz-core: CALayer + the IOSurfaceLayer subclass (W0.T3) and, for W1,
# CAMetalLayer. Feature gate (per upstream docs; CONFIRM via the T3 spike against
# the resolved local crate BEFORE trusting — this crate is not yet in Cargo.lock):
# the `CALayer` feature (NOT `CoreAnimation`, which is an empty marker) gates
# CALayer + `kCAGravityTopLeft` + contents/setContents/contentsGravity;
# `objc2-core-foundation` gates the bounds()/contentsScale() geometry accessors the
# resize-discard path reads; `CAMetalLayer` is enabled now for W1 (harmless; pulls
# objc2-metal which this crate already deps). If a gate name is wrong it is a
# one-line feature add/rename at port time.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
] }

# DispatchData for newLibraryWithData: (the embedded metallib bytes wrapped in a
# dispatch_data_t). `DispatchData::from_bytes` is gated on the block2 feature.
dispatch2 = { version = "0.3", features = ["block2"] }

# The addCompletedHandler: completion block (RcBlock) — the deferred async present
# seam (Frame.complete's `!sync` path). Also brought in transitively by dispatch2.
block2 = { version = "0.6" }

[dev-dependencies]
# Pure-Rust PNG encoder — generates the small solid-color background-image fixture
# the offscreen bg-image golden (T3) writes to a temp file + `prepBackgroundImage`
# decodes, and the layout-invariant test (T4) decodes. Dev-only; the same 0.18
# stand-in rustty-font/rustty-wuffs use.
png = { workspace = true }
# The crate-root `Health` enum (hoisted from `renderer.zig`) carries the
# `ghostty.h Health` -> `checkGhosttyHEnum` test, which uses the `enum_type`/
# `check_ghostty_henum` helpers from `rustty-lib`. Test-only, so a dev-dep; the
# edge is acyclic (rustty-lib is a FIRM leaf, nothing it deps reaches renderer).
rustty-lib = { workspace = true }
