# rustty-font-shaper — port crate (the D1 three-tier split: shaper tier)
#
# Crate IDENTITY is `rustty-font-shaper` (R4). This is NOT the published artifact
# name; the library artifacts are renamed to the `rustty` product identity later
# (R2). NO dependency on the ghostty tree (R3) — reference is an external oracle
# only.
#
# LAYERING (memory `apc-glyf-font-layering-d1`, D1 signed off): `rustty-font` is
# a PURE parsing/sprite leaf BELOW `rustty-vt` (font must NEVER have a vt edge;
# `rustty-vt`'s apc/glyph deps `rustty-font` directly). This crate is the SHAPER
# tier ABOVE both `rustty-vt` and `rustty-font`: it hosts the backend `Face`
# selector (`face.zig`), the CoreText/FreeType faces, and HarfBuzz shaping, so it
# may depend on `rustty-vt` + `rustty-font` + the `-sys`/objc2 backends. Nothing
# depends back on it, so the graph stays acyclic (G7).
[package]
name = "rustty-font-shaper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# PORT NOTE: doc comments in this crate are verbatim ports of the reference Zig
# doc comments (R1), including spec prose and external links (e.g. the MDN
# `font-variation-settings` citation on `Variation`). This crate defines no
# intended doc examples — all tests live in `#[test]` blocks — so doctests are
# disabled rather than risk rustdoc misparsing the faithful comment text.
[lib]
doctest = false

[features]
# The Ghostty-ABI wasm C-ABI export groups the reference retains via
# `comptime { _ = DeferredFace.Wasm; _ = face.web_canvas.Wasm; _ = shape.web_canvas.Wasm; }`
# in `src/font/main.zig` — the UNPREFIXED `deferred_face_*`/`face_*`/`shaper_*`
# exports (`DeferredFace.zig:423-466`, `face/web_canvas.zig:489-557`,
# `shaper/web_canvas.zig:231-305`). OFF by default so the separate
# `rustty_web_canvas.wasm` deliverable keeps its documented `rustty_wc_*`-only
# surface; `rustty-wasm` (the `main_wasm.zig` artifact) turns it ON. Pulls in
# `rustty-os` for the resurrected `os/wasm.zig` host-ownership tracker
# (`face_render_glyph` returns a `wasm.toHostOwned` heap `*Glyph`).
ghostty-wasm-abi = ["dep:rustty-os"]

# The three vendored-C font backends, DEFAULT-ON so every existing build is
# byte-identical (R5): `cargo build`/`cargo test` in this workspace resolves the
# same graph, the same `-sys` crates, and the same modules as before these
# features existed. They exist for ONE reason.
#
# WHY THEY EXIST — the `links` collision an EMBEDDER hits. Cargo permits exactly
# ONE package per resolve graph declaring a given `links` value, and that check
# runs over the WHOLE graph regardless of target: a `[target.'cfg(...)']`
# dependency table does NOT exempt it. A desktop app that wants `rustty-termio` +
# `rustty-renderer` on macOS therefore cannot build if its own graph already
# links FreeType or Fontconfig through some other package (the concrete case:
# `freetype-sys 0.20.1` and `yeslogic-fontconfig-sys 6.0.1`, pulled in by a GPUI
# app's font stack). Making our `-sys` edges OPTIONAL is the only fix, because it
# removes them from the graph entirely rather than merely from the link line.
#
# WHY IT IS SOUND ON macOS. The Darwin default backend is `.coretext` —
# "CoreText for font discovery, rendering, and shaping" (`backend.rs`
# `Backend::default`). FreeType serves only the non-default `coretext_freetype`
# / `freetype` backends and the Linux/Windows backends, HarfBuzz additionally
# `coretext_harfbuzz`, and Fontconfig only `fontconfig_freetype` (the `fc`
# module is compiled only on that backend, which is selectable on macOS too).
# The BACKEND itself is `-Dfont-backend`, i.e.
# `rustty-build-config`'s `font-backend-*` features (S-14, N266); these three
# features only decide which `-sys` crates are in the graph, and `build.rs`
# refuses a selected backend whose libraries they leave out. A macOS embedder
# that turns all three off gets the reference's own default backend, unchanged.
#
# THE IMPLICATION CHAIN is forced by the code, not by taste:
#   * `harfbuzz` pulls `dep:freetype-sys` as well, because `harfbuzz-sys` has a
#     hard (non-optional) `freetype-sys` dependency — HarfBuzz is built with
#     `-DHAVE_FREETYPE=1` so `src/hb-ft.cc` needs FreeType's headers and archive,
#     mirroring the reference's `lib.linkLibrary(freetype)` — and because `hb.rs`'s
#     `hb_ft` bridge (`create_font`/`create_face`, the port of
#     `pkg/harfbuzz/freetype.zig`) is TYPED against `freetype_sys::FT_Face`.
#     Enabling HarfBuzz therefore cannot drop FreeType from the graph; only
#     turning HarfBuzz off can.
#   * `freetype` implies `harfbuzz`, because the FreeType backend face
#     (`face/freetype.rs`) shapes through HarfBuzz — it holds an `hb::Font` built
#     by `hb::create_font` — exactly as `backend.zig`'s `hasHarfbuzz()` is true for
#     every freetype-active backend.
#   * `fontconfig` implies `freetype`, because the only backend that uses
#     Fontconfig is `fontconfig_freetype` (`Backend::has_fontconfig` is true for
#     that one arm alone).
# So the minimal CoreText-only build is simply `default-features = false` with no
# features named; anything else keeps FreeType in the graph.
default = ["freetype", "harfbuzz", "fontconfig"]

# HarfBuzz 11.0.0 text shaping: the `hb.rs` package port (`pkg/harfbuzz`), the
# `shape::harfbuzz` shaper, and the `hb_font` the FreeType face carries. The
# CoreText face carries one only in a `-Dfont-backend=coretext_harfbuzz` build
# (its `harfbuzz_shaper` arms; on the default `.coretext` `hasHarfbuzz()` is
# false and `hb_font` is the reference declaration's `void` arm — see
# `HARFBUZZ_SHAPER`). Also pulls `freetype-sys` — see the implication chain
# above. `build.rs` refuses a `hasHarfbuzz()` backend with this feature off.
harfbuzz = ["dep:harfbuzz-sys", "dep:freetype-sys"]
# FreeType 2.13.2 glyph rasterization: the `ft` FFI glue, the `face::freetype`
# backend face, and `library::FreetypeLibrary`. Implies `harfbuzz`.
freetype = ["dep:freetype-sys", "harfbuzz"]
# Fontconfig 2.18.3 font discovery/matching (the `fc` module, the port of
# `pkg/fontconfig/*.zig`) for the `fontconfig_freetype` backend (the `fc`
# module is compiled only there; `fontconfig-sys` is off Windows/wasm by `cfg`).
# This feature is what lets an embedder drop `links = "fontconfig"` from the
# graph. Implies `freetype`.
fontconfig = ["dep:fontconfig-sys", "freetype"]

[dependencies]
# The `log` facade (`.port/parity-closure/DECISION-logging.md` §6/§6r): every
# restored `log.warn`/`log.err`/`log.info`/`log.debug` reference call site in
# this crate emits through `log::warn!(target: LOG_SCOPE, ...)`, reaching
# whichever process-wide `log::Log` backend the running binary installed
# (`rustty-core::logging::AppLogger` in the app/libghostty artifacts,
# `rustty-vt-c::sys::Logger` in the standalone library, and
# `rustty-os::wasm::log::WasmLogger` in the wasm artifacts).
#
# Plain and unconditional: NO `release_max_level_*` feature here. That
# compile-time gate belongs only on wasm ARTIFACT ROOT crates (§8r); declaring
# it here would silently mute the native app build.
log = { workspace = true }
# Optional (feature `ghostty-wasm-abi` only): the resurrected pre-`9dc2e5978`
# `os/wasm.zig` host-ownership tracker (`toHostOwned`), which the reference
# `face_render_glyph` uses to hand a heap `*Glyph` to the JS host for the
# exported `free` to release. Acyclic: `rustty-os` sits below the shaper tier
# (rustty-vt-adjacent leaf) and depends on nothing in this crate's graph.
rustty-os = { workspace = true, features = ["wasm-host-owned"], optional = true }
# The crown-jewel terminal crate: the shaper tier sits ABOVE vt (D1). vt's
# apc/glyph deps `rustty-font` below; this tier consumes vt types for shaping.
rustty-vt = { workspace = true }
# The PURE font leaf (Atlas/opentype/sprite/Metrics/glyph). Owns the shared face
# types (`Metrics`, glyph `RenderOptions`) this tier re-exports.
rustty-font = { workspace = true }
# Size types leaf (renderer/terminal size), depended on across font/renderer/vt-c.
rustty-render-types = { workspace = true }
# Base utilities leaf.
rustty-util = { workspace = true }
# `build_config.font_backend` (`-Dfont-backend`). A leaf. Its build script
# publishes the resolved backend as `links` metadata, which only a DIRECT
# dependent's build script receives: `build.rs` turns it into the
# `rustty_font_backend` cfg every backend selector here is keyed on.
rustty-build-config = { workspace = true }
# Zig std equivalents: `fmt::format_float_d` is the `{d}` the wasm `web_canvas`
# face formats its CSS font size with (S91-F2). A leaf (already a transitive
# dep via rustty-font).
rustty-zigstd = { workspace = true }
# Grapheme clustering (`unicode.graphemeBreak`/`uucode.grapheme.BreakState`): the
# wasm `web_canvas` shaper performs grapheme clustering. Pure-Rust leaf (wasm-safe;
# already a transitive dep via rustty-vt). Only referenced by the wasm shaper.
rustty-unicode = { workspace = true }
# Container/testing utilities leaf. Provides `comparison::expectApproxEqual`
# (the Collection metrics tests) — the reference `datastruct/comparison.zig`.
rustty-datastruct = { workspace = true }
# Faithful model of `std.mem.Allocator` (same map rustty-font/vt use): the
# freetype face's `renderGlyph`/`copyTable` thread an allocator, and `Atlas<A>`
# is generic over it. Callers pass `allocator_api2::alloc::Global`.
allocator-api2 = { workspace = true }
# R3: bindings to the SAME C libraries the reference links — NOT reimplementations.
# FreeType 2.13.2 (glyph rasterization for the freetype backend) and HarfBuzz
# 11.0.0 (text shaping; the `hb_ft` bridge works against freetype-sys). Referenced
# by path (the `-sys` crates are not in `[workspace.dependencies]`).
#
# WASM DIVERGENCE (`cfg(not(target_arch = "wasm32"))`): the `wasm32` web_canvas
# backend has no FreeType/HarfBuzz (freestanding wasm has no C deps); these are
# excluded from the wasm dependency graph. The `Face`/`Shaper`/`Library`
# selectors resolve to the browser Canvas backend on wasm (see `face`/`shape`/
# `library`/`backend`). Native/other targets are untouched.
# wasm32: the `log::Log` BACKEND for the wasm artifacts
# (`.port/parity-closure/DECISION-logging.md` §6r3 finding 3, §8r).
#
# The `rustty-os` entry in `[dependencies]` above is OPTIONAL (feature
# `ghostty-wasm-abi`, for the `toHostOwned` tracker). That is not enough here:
# `rustty_web_canvas.wasm` does NOT enable that feature, and its only entry
# points are this crate's `rustty_wc_*` exports — so without an unconditional
# wasm32 edge there is no backend to install and every restored `log::` site in
# the `web_canvas` face/shaper would emit into `log`'s no-op default. Declared
# on the TARGET table so the native builds are untouched.
#
# NOTE (§8r): NO `release_max_level_*` feature on the `log` line in
# `[dependencies]`. That compile-time gate is declared by the wasm ARTIFACT ROOT
# crates (`rustty-vt-c`, `rustty-wasm`), and feature unification carries it down
# to this crate for those builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustty-os = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# OPTIONAL (features `freetype` / `harfbuzz`, both DEFAULT-ON): see the
# `[features]` header — an embedder whose graph already declares
# `links = "freetype"` can only build if these leave the graph entirely, and a
# macOS build needs neither (the default Darwin backend is `.coretext`).
freetype-sys = { path = "../../crates-sys/freetype-sys", optional = true }
harfbuzz-sys = { path = "../../crates-sys/harfbuzz-sys", optional = true }

# Fontconfig 2.18.3 (font discovery/matching) for the FreeType/Fontconfig
# discovery backend — the SAME C library the reference links (R3), consumed by
# the `fc` module (the port of `pkg/fontconfig/*.zig`), which is compiled only
# on `hasFontconfig()` (`-Dfont-backend=fontconfig_freetype`: the Linux/BSD
# default, and selectable on macOS like the reference's `SharedDeps.zig:292`,
# which builds fontconfig from source on any target whose backend has it).
# CORRECTION (S-14b, review M3): this table excluded macOS on the premise that
# macOS "never links fontconfig"; that is only the DEFAULT backend. A default
# macOS build compiles the crate but references nothing in it, as the
# `rustty-apprt` edge to it already did. Freestanding wasm has no C deps.
# Referenced by path (the `-sys` crates are not in `[workspace.dependencies]`).
#
# LATENT GAP FIXED [WS20, 2026-07-30]: this table used to include Windows, so a
# Windows build would have tried to link fontconfig — the exact thing
# `backend.zig`'s `.windows => .freetype_windows` arm exists to avoid ("Avoid
# fontconfig on Windows because its libxml2 dependency isn't available"). With the
# `freetype_windows` discoverer now live, Windows uses the FreeType directory scan
# and links no fontconfig.
# N286 (task W-6): a GNU-ABI Windows target is back in the table.
# `-Dfont-backend=fontconfig_freetype` builds there in the reference
# (`-Dtarget=x86_64-windows-gnu`, MinGW headers; its fontconfig tests pass on
# Windows 11), with libxml2's iconv off (pkg/fontconfig/build.zig:53-57). An
# MSVC-ABI target stays out: the reference's fontconfig does not compile against
# the MSVC headers (`unistd.h`), and `rustty-build-config` refuses the backend
# there by name.
[target.'cfg(not(any(all(target_os = "windows", target_env = "msvc"), target_arch = "wasm32")))'.dependencies]
# OPTIONAL (feature `fontconfig`, DEFAULT-ON): the `cfg` table above keeps
# fontconfig off Windows/wasm, but Cargo's `links` uniqueness check ignores
# `cfg` and runs over the whole resolve graph — so an embedder colliding on
# `links = "fontconfig"` needs the dependency gone, not merely inactive.
fontconfig-sys = { path = "../../crates-sys/fontconfig-sys", optional = true }

# macOS: the CoreText backend (font discovery + rendering + shaping) and its
# CoreGraphics rasterization surface. R3/objc2: the crates.io objc2 framework
# crates REPLACE ghostty's `pkg/macos` bindings — `macos.text.*` -> objc2-core-text
# (CTFont/CTFontDescriptor), `macos.graphics.*` -> objc2-core-graphics
# (CGContext/CGBitmapContext), `macos.foundation.*` -> objc2-foundation
# (CFString/CFArray). Bindings to the SAME system frameworks, not reimplementations.
[target.'cfg(target_os = "macos")'.dependencies]
# `macos.foundation.*` -> objc2-core-foundation (CFString/CFData/CFNumber/CFAllocator);
# `macos.graphics.*` -> objc2-core-graphics (CGContext/CGColorSpace/CGBitmapContext/
# CGAffineTransform/CGGlyph); `macos.text.*` -> objc2-core-text (CTFont/CTFontDescriptor/
# CTFontManager). Feature-gated to just the tables the CoreText face touches.
# `CFDictionary`/`CFArray`/`CFCharacterSet` are added for the CoreText discoverer
# (`toCoreTextDescriptor` builds an attribute dictionary; `discover` walks the
# matching-descriptor array; the codepoint search builds a character set).
# `CFAttributedString` is added for the CoreText shaper (`shape` builds a
# `CFAttributedString` over the run's UTF-16 string before typesetting).
# `CFURL` is added for `DeferredFace.loadCoreTextFreetype` (the
# `coretext_freetype` backend: `url.copyPath()` +
# `URL.createStringByReplacingPercentEscapes`).
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFData", "CFString", "CFNumber", "CFCGTypes", "CFDictionary", "CFArray", "CFCharacterSet", "CFAttributedString", "CFURL"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGColorSpace", "CGBitmapContext", "CGImage", "CGFont", "CGAffineTransform", "CGGeometry"] }
# `CTFontCollection` is added for the CoreText discoverer's font-collection search.
# `CTLine`/`CTRun`/`CTTypesetter`/`CTStringAttributes` are added for the CoreText
# shaper (`CTTypesetter` -> `CTLine` -> `CTRun` glyph extraction + the
# `kCTFontAttributeName` string attribute).
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor", "CTFontManager", "CTFontTraits", "CTFontCollection", "CTLine", "CTRun", "CTTypesetter", "CTStringAttributes", "objc2-core-graphics"] }
# The CoreText shaper's dedicated release thread is the reference's
# `os.CFReleaseThread` (S94-F1): `rustty_os::CFReleaseThread` on the
# `rustty_xev` kqueue loop. Neither adds a crate to the graph: rustty-os is
# already a dependency of rustty-font, and rustty-xev of rustty-os.
rustty-os = { workspace = true }
rustty-xev = { workspace = true }

# R3: compile the vendored `stb_image_resize` single-header C (used by the
# freetype face to scale bitmap-strike glyphs) standalone with `cc`. Same lib
# the reference links (`src/stb`), copied into `vendor/` — see `build.rs`.
[build-dependencies]
cc = "1"

[dev-dependencies]
# TEST-ONLY (parity S83-F3 / S86-F4): enable rustty-util's `tripwire-test`
# feature so this crate's fail-point tests trip in the RELEASE test lane too.
# Zig's `builtin.is_test` is true for the whole compilation unit at ANY optimize
# mode, so the reference's allocation-failure tests run under
# `zig build test -Doptimize=Release*`. `Module::enabled()` is
# `cfg!(any(test, debug_assertions, feature = "tripwire-test"))`, and `cfg(test)`
# there is evaluated in rustty-util's OWN compilation unit — which is not a test
# — so without this feature the fail points silently no-op in release and the
# tests had to be `#[ignore]`d. A dev-dependency activates the feature ONLY for
# test/bench/example builds, so `cargo build --release` still compiles
# `tripwire::check` away.
rustty-util = { workspace = true, features = ["tripwire-test"] }
