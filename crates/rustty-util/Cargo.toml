# rustty-util — port crate (parity port order)
#
# Crate IDENTITY is `rustty-util` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Restores Zig's `builtin.is_test` semantics for the `tripwire` fail-point
# module ACROSS crate boundaries. `builtin.is_test` is true for the WHOLE
# compilation unit under `zig build test` at ANY optimize mode (including
# ReleaseFast), so the reference's fail-point tests run in release test builds.
# Rust has no cross-crate `cfg(test)`, so a consumer crate turns this on as a
# DEV-dependency feature: dev-dep features unify only into test/bench/example
# builds, so a production `cargo build --release` (which builds no dev-deps)
# still compiles `check` away exactly as before.
tripwire-test = []

[dependencies]
