# rustty-build-config — port crate (parity port order)
#
# Crate IDENTITY is `rustty-build-config` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-build-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `build_config.artifact == .lib` — the reference derives this from Zig's
# `builtin.output_mode` (`Artifact.detect()`), which is `.Lib` exactly when the
# build produces libghostty. Rust has no equivalent introspection, so the
# embeddable-library artifact is selected by this additive feature, which
# `rustty-apprt-c` (the librustty cdylib/staticlib hub) turns on for its own
# dependency edge. Everything it gates is additive (diagnostics precompute, the
# macOS launch-source probe); see `Artifact::detect` for the feature-unification
# caveat.
artifact-lib = []

# `build_config.flatpak` — the port of the reference's `-Dflatpak=true` build
# option (`src/build/Config.zig:212`), which its own Flatpak manifest passes.
#
# This is the OPTION seam, and it is load-bearing: with it off,
# `build_config::flatpak()` is false and four ported code paths are inert —
# `apprt/gtk/flatpak.rs`'s portal/DBus integration, `termio/exec.rs`'s
# `flatpak-spawn --host` (so commands run inside the sandbox instead of on the
# host), and `os/passwd.rs`'s host lookup. A Flatpak built without it starts,
# prints `+version`, and quietly does none of that — which is exactly what
# rustty shipped until this feature existed.
#
# Turn it on through `rustty-termio/flatpak` rather than directly: that feature
# ALSO swaps the real `rustty_os::flatpak::FlatpakHostCommand` in for its
# placeholder, and the two must never diverge — `flatpak()` returning true while
# termio holds the empty placeholder struct is strictly worse than both off.
flatpak = []

# `build_config.snap` — the port of `-Dsnap` (`src/build/Config.zig:218`),
# passed by the reference's `snapcraft.yaml`. Gates `os/open.rs`'s
# snap-confinement handling of `xdg-open`. No type-swap partner, so unlike
# `flatpak` this one is safe to enable on its own.
snap = []

[dependencies]
# Version/identity source-of-truth (R2). identity has no deps so this adds no
# cycle; BREAK #3 keeps build-config a leaf above only util/identity.
rustty-identity = { workspace = true }
# DeepEqual impl for `ReleaseChannel` (a config field type): the orphan rule
# requires the impl in this crate (the type's home) or datastruct (the trait's).
# datastruct deps only util, so this is acyclic.
rustty-datastruct = { workspace = true }
