# rustty-simd — port crate (parity port order)
#
# Crate IDENTITY is `rustty-simd` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
#
# This crate ports ghostty src/simd/. The SIMD kernels are ghostty's OWN C++
# (src/simd/*.cpp,*.h) and are copied VERBATIM into `cbits/simd/` and cc-built
# against highway-sys + simdutf-sys (R3: same C libs, no pure-Rust substitution).
# The Zig wrappers (base64.zig, codepoint_width.zig, index_of.zig, vt.zig,
# base64_scalar.zig, main.zig) are ported to Rust modules as the crate is carved.
[package]
name = "rustty-simd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
# `quirks.inlineAssert` (the reference imports `../quirks.zig`) lives in
# rustty-util (a leaf crate).
rustty-util = { workspace = true }
# codepoint_width.zig's scalar fallback imports `uucode`; rustty embeds the
# uucode-derived data in rustty-unicode (R3: no uucode dep), so the scalar path
# reads the identical values back out of rustty-unicode (a leaf crate).
rustty-unicode = { workspace = true }
# The `LOG`-class facade (DECISION-logging.md §6r4, call shape 2). `rustty-simd`
# sits below `rustty-vt-c`/`rustty-core` in R4's layering, so `base64.zig`'s
# `log.warn` restores onto `log::warn!(target: "simd_base64", ..)` and reaches
# whichever `log::Log` backend the running binary installed. Plain and
# unconditional — the `release_max_level_*` comptime gate belongs only on the
# wasm ARTIFACT crates (`rustty-vt-c`, `rustty-wasm`), per §8/§8r.
log = { workspace = true }

# R3: the SIMD kernels link against the SAME C libraries the reference uses,
# vendored standalone (no ghostty dep). highway provides the runtime dispatch;
# simdutf provides UTF/base64 transcoding used by base64.cpp / vt.cpp.
#
# WASM DIVERGENCE (`cfg(not(target_arch = "wasm32"))`): the freestanding
# `wasm32-unknown-unknown` browser target has no libc/libc++, so the C++ SIMD
# kernels (and their highway/simdutf `-sys` deps) cannot be linked. On wasm the
# crate compiles PURE-RUST scalar fallbacks instead (see the per-module `SIMD`
# gates + `build.rs`), so these C deps are excluded from the wasm dependency
# graph. The `wasm32-wasip1` target ALSO takes this arm (no C++ toolchain wired
# for it); the shipped `wasm32-wasip1` VT build uses the scalar lanes too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
highway-sys = { path = "../../crates-sys/highway-sys" }
simdutf-sys = { path = "../../crates-sys/simdutf-sys" }

[build-dependencies]
# R3: compile the copied ghostty SIMD .cpp standalone via the host C++ compiler
# with the reference's highway flags (mirrors SharedDeps.zig addSimd).
cc = "1"
