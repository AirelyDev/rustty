# rustty-crash — port crate (parity port order)
#
# Crate IDENTITY is `rustty-crash` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-crash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The reference's `-Dsentry` build option (src/build/Config.zig:33,224-236),
# resolved. It is the SINGLE source of truth for `build_options::SENTRY`
# (src/build_options.rs) AND — through `dep:sentry-sys` — for whether
# sentry-native + breakpad are LINKED AT ALL. That second half is
# `SharedDeps.zig:407`'s `if (self.config.sentry) { … }`, which rustty
# previously did not have: sentry-sys was an unconditional dependency, so a
# Linux rustty build linked libraries a Linux ghostty build does not.
#
# PORT NOTE (cargo cannot express the per-target `orelse`): Config.zig resolves
# the option per target — true on macOS/iOS, false everywhere else, "because
# the crash reports on Linux don't have much useful information". A cargo
# `default = [...]` list is not target-conditional, and a `cfg`-gated dependency
# is still PRESENT in the resolve graph (which is the whole point of making it
# optional), so the per-target switch has to live where the reference's lives:
# build orchestration. `xtask`'s Apple xcframework build passes
# `--features sentry`; non-Apple artifacts do not. This is exactly the
# precedent `-Dsimd` already set here (xtask/src/main.rs, the `--features simd`
# arm: "rustty's plain-`cargo build` default stays SIMD-off"). CONSEQUENCE,
# stated plainly: a plain `cargo build`/`cargo test` on macOS now has
# `SENTRY == false`, the same visible dev-workflow trade already accepted for
# `simd`.
#
# So this ONE feature spells both directions of `-Dsentry=…` that the reference
# can reach: on = `-Dsentry=true` (incl. the W15-04 Linux opt-in enablement),
# off = `-Dsentry=false`, which an embedder previously could not reach at all.
sentry = ["dep:sentry-sys"]

[dependencies]
# The `LOG`-class facade (DECISION-logging.md §6r4, call shape 2). `crash/
# sentry.zig`'s five `log.*` sites emit through it under the reference's
# `.sentry` scope. Plain and unconditional (§8r).
log = { workspace = true }
# `internal_os = @import("../os/main.zig")` — xdg state/cache dirs + the macOS
# NSCachesDirectory / pthread_setname_np paths.
rustty-os = { workspace = true }
# `std.Thread.spawn(.{}, ..)`: the Zig default thread config (16 MiB stack).
rustty-zigstd = { workspace = true }
# `build_config = @import("../build_config.zig")` — version_string + the
# setTag build-mode/app-runtime/font-backend/renderer values.
rustty-build-config = { workspace = true }
# `build_config.version_string` / `release_channel`: the version derived from
# the checkout, in its own leaf crate so a commit rebuilds only its readers.
rustty-version = { workspace = true }
# R2: the app-name segment of the reference's `"ghostty/crash"`/`"ghostty/sentry"`
# XDG subdirs (and the `.ghosttycrash` report extension) comes from the identity
# source-of-truth crate instead of being hardcoded.
rustty-identity = { workspace = true }
# R3: the vendored sentry-native 0.7.8 (ghostty's product `backend = .breakpad`
# — SharedDeps.zig; breakpad client provided by breakpad-sys — and
# `transport = .none` build) behind the ported pkg/sentry wrapper (`sentry_pkg`).
#
# OPTIONAL: this edge IS `SharedDeps.zig:407`'s `if (self.config.sentry)` link
# gate (see the `sentry` feature above). `breakpad-sys` needs no separate gate —
# it reaches the graph only as sentry-sys's own dependency
# (crates-sys/sentry-sys/Cargo.toml:43), so it leaves with it.
sentry-sys = { workspace = true, optional = true }
# `std.json.ObjectMap` (`StringArrayHashMap`, insertion-ordered) for
# `src/json.rs`, the port of the `std.json` parse/stringify sentry_envelope uses.
# CORRECTION (LEDGER S79-F3, S79-F4): this edge was `serde_json`, whose value
# model and printer differ from `std.json` (see `src/json.rs`).
indexmap = "2"

# P4-E33 (`15c50c1db` "crash: do not use global state"): upstream's crash files
# no longer import `global` AT ALL — callers pass the environment-map snapshot
# in (`sentry.init` owns it; `defaultDir` borrows it). This edge remains only
# for the `EnvMap` TYPE (the Rust image of `std.process.Environ.Map`, hosted by
# the leaf state crate); rustty-crash performs no live global reads.
rustty-global = { workspace = true }

# NOTE (R4, integration-tier blueprint): `rustty-global` stays INJECTED for the
# allocator (break #1
# — the reference's `state = &@import("../global.zig").state` allocator read is a
# DI seam, not a hard dep), and rustty-crash must NOT depend on rustty-renderer
# (renderer already deps crash — the reverse edge would cycle), which is why the
# `ThreadStateSurface` seam uses plain `(u32, u32)` tuples.
