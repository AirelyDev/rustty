# rustty-crash — port crate (parity port order)
#
# Crate IDENTITY is `rustty-crash` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-crash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The explicit `zig build -Dsentry=true` user override of the reference's
# src/build/Config.zig `sentry` option (W15-04): forces `build_options::SENTRY`
# on for ANY target — the Linux opt-in enablement. Without it the per-target
# `orelse` default applies (macOS/iOS on, everything else off). Cargo features
# are additive, so the `-Dsentry=false` direction has no cargo seam (see
# src/build_options.rs).
sentry = []

[dependencies]
# `internal_os = @import("../os/main.zig")` — xdg state/cache dirs + the macOS
# NSCachesDirectory / pthread_setname_np paths.
rustty-os = { workspace = true }
# `build_config = @import("../build_config.zig")` — version_string + the
# setTag build-mode/app-runtime/font-backend/renderer values.
rustty-build-config = { workspace = true }
# R2: the app-name segment of the reference's `"ghostty/crash"`/`"ghostty/sentry"`
# XDG subdirs (and the `.ghosttycrash` report extension) comes from the identity
# source-of-truth crate instead of being hardcoded.
rustty-identity = { workspace = true }
# R3: the vendored sentry-native 0.7.8 (ghostty's product `backend = .breakpad`
# — SharedDeps.zig; breakpad client provided by breakpad-sys — and
# `transport = .none` build) behind the ported pkg/sentry wrapper (`sentry_pkg`).
sentry-sys = { workspace = true }
# Zig `std.json` equivalent (ObjectMap == insertion-order-preserving map; see
# the workspace manifest note). Used by the sentry_envelope port.
serde_json = { workspace = true }

# P4-E33 (`15c50c1db` "crash: do not use global state"): upstream's crash files
# no longer import `global` AT ALL — callers pass the environment-map snapshot
# in (`sentry.init` owns it; `defaultDir` borrows it). This edge remains only
# for the `EnvMap` TYPE (the Rust image of `std.process.Environ.Map`, hosted by
# the leaf state crate); rustty-crash performs no live global reads.
rustty-global = { workspace = true }

# NOTE (R4, integration-tier blueprint): `rustty-global` stays INJECTED for the
# allocator (break #1
# — the reference's `state = &@import("../global.zig").state` allocator read is a
# DI seam, not a hard dep), and rustty-crash must NOT depend on rustty-renderer
# (renderer already deps crash — the reverse edge would cycle), which is why the
# `ThreadStateSurface` seam uses plain `(u32, u32)` tuples.
