# rustty-apprt-api — port crate (parity port order)
#
# Crate IDENTITY is `rustty-apprt-api` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-apprt-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Pass-throughs for `rustty-font-shaper`'s three vendored-C font backends
# (FreeType / HarfBuzz / Fontconfig), forwarded through `rustty-renderer`.
# DEFAULT-ON, so every existing build of this crate is byte-identical (R5).
#
# They exist ONLY so an embedder can turn them off. Cargo permits exactly one
# package per resolve graph declaring a given `links` value, and that check spans
# the WHOLE graph regardless of target — so a `cfg`-gated `-sys` dependency does
# not avoid it; it has to be absent. This crate sits on the path
# `rustty-termio` -> here -> `rustty-renderer` -> `rustty-font-shaper`, and cargo
# features UNIFY across a graph, so if this crate named the features outright the
# embedder's opt-out would be silently overridden. Forwarding is the point. Full
# rationale, and why a macOS CoreText-only build loses nothing, is in the
# `[features]` header of `crates/rustty-font-shaper/Cargo.toml`.
default = ["freetype", "harfbuzz", "fontconfig"]
freetype = ["rustty-renderer/freetype", "rustty-config/freetype"]
harfbuzz = ["rustty-renderer/harfbuzz", "rustty-config/harfbuzz"]
fontconfig = ["rustty-renderer/fontconfig", "rustty-config/fontconfig"]

[dependencies]
# The acyclicity guarantee (break #8): apprt-api depends ONLY on downstream
# crates — never on rustty-core or rustty-apprt. This is what lets rustty-core
# depend on the iface (apprt-api) instead of the concrete apprt, breaking the
# apprt<->core cycle. `check_acyclic.sh` is the hard proof.
rustty-lib = { workspace = true }              # checkGhosttyHEnum / enum_type
rustty-build-config = { workspace = true }     # apprt.Runtime (runtime.zig re-export)
# `default-features = false` + the explicit feature list (the same shape
# `rustty-wasm` uses on this dependency): `rustty-config`'s defaults now include
# the `freetype`/`harfbuzz`/`fontconfig` pass-throughs, and this crate sits on an
# EMBEDDER's dependency path, where cargo feature UNIFICATION means one edge
# still enabling them turns them back on for the whole graph. The two non-font
# defaults are named back explicitly so the build is otherwise unchanged (R5),
# and the font trio is forwarded by this crate's own features instead. It cannot
# be spelled as `{ workspace = true, default-features = false }` — Cargo IGNORES
# a member's `default-features = false` when the workspace dependency did not
# declare it.
# Config, Config.Duration
rustty-config = { path = "../rustty-config", default-features = false, features = [
    "renderer",
    "input-oniguruma",
] }
rustty-vt = { workspace = true }               # Scrollbar, MouseShape, osc ProgressReport/ColoredTarget
rustty-input = { workspace = true }            # input.Trigger (+ Trigger.C) for KeySequence
rustty-datastruct = { workspace = true }       # MessageData (surface WriteReq)
# P3-W7 T2: `defaultTermioEnv`'s `std.process.EnvMap`. Upstream retyped that to
# `std.process.Environ.Map` (`e8525c0fd`); rustty's single definition of the
# byte-typed env map lives next to the captured `Environ` block in
# rustty-global, which is the LEAF state-holder (break #1) — a downward edge.
rustty-global = { workspace = true }
# renderer.Health (Action::renderer_health / Message::renderer_health). renderer
# is BELOW apprt-api (nothing renderer deps reaches apprt-api), so the edge is
# acyclic — confirmed by check_acyclic.sh. rustty-config already deps renderer,
# so apprt-api -> config -> renderer AND apprt-api -> renderer are both downward.
rustty-renderer = { workspace = true }
# crash.sentry.ThreadStateSurface: `AppMailbox::crash_surface` hands termio the
# surface its io threads tag their crash metadata with (`Mailbox.surface`,
# LEDGER S211-F2 / S212-F2). rustty-crash deps only os/build-config/version/
# identity/global, all below apprt-api, so the edge is downward. Its `sentry`
# feature (the C SDK) stays off unless an apprt turns it on.
rustty-crash = { workspace = true }
# ipc Action.cval / NewWindow.cval take a std.mem.Allocator; modeled with the
# allocator-api2 Allocator trait (matching the rest of the workspace).
allocator-api2 = { workspace = true }
