# rustty-apprt-api — port crate (parity port order)
#
# Crate IDENTITY is `rustty-apprt-api` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-apprt-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The acyclicity guarantee (break #8): apprt-api depends ONLY on downstream
# crates — never on rustty-core or rustty-apprt. This is what lets rustty-core
# depend on the iface (apprt-api) instead of the concrete apprt, breaking the
# apprt<->core cycle. `check_acyclic.sh` is the hard proof.
rustty-lib = { workspace = true }              # checkGhosttyHEnum / enum_type
rustty-build-config = { workspace = true }     # apprt.Runtime (runtime.zig re-export)
rustty-config = { workspace = true }           # Config, Config.Duration
rustty-vt = { workspace = true }               # Scrollbar, MouseShape, osc ProgressReport/ColoredTarget
rustty-input = { workspace = true }            # input.Trigger (+ Trigger.C) for KeySequence
rustty-datastruct = { workspace = true }       # MessageData (surface WriteReq)
# P3-W7 T2: `defaultTermioEnv`'s `std.process.EnvMap`. Upstream retyped that to
# `std.process.Environ.Map` (`e8525c0fd`); rustty's single definition of the
# byte-typed env map lives next to the captured `Environ` block in
# rustty-global, which is the LEAF state-holder (break #1) — a downward edge.
rustty-global = { workspace = true }
# renderer.Health (Action::renderer_health / Message::renderer_health). renderer
# is BELOW apprt-api (nothing renderer deps reaches apprt-api), so the edge is
# acyclic — confirmed by check_acyclic.sh. rustty-config already deps renderer,
# so apprt-api -> config -> renderer AND apprt-api -> renderer are both downward.
rustty-renderer = { workspace = true }
# ipc Action.cval / NewWindow.cval take a std.mem.Allocator; modeled with the
# allocator-api2 Allocator trait (matching the rest of the workspace).
allocator-api2 = { workspace = true }
