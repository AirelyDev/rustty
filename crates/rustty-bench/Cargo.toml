# rustty-bench — port crate (parity port order)
#
# Crate IDENTITY is `rustty-bench` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Branch A `ghostty_benchmark_cli` symbol identity (PREPORT_SWIFT_APP §3). OFF by
# default so the canonical product exports only `rustty_benchmark_cli` (R2); enabling
# `identity-ghostty` compiles `src/ghostty_alias.rs`, adding the `ghostty_benchmark_cli`
# thin forwarder over the canonical body. apprt-c enables this feature from its own
# `identity-ghostty` so the alias lands in the linked staticlib alongside the app-C-ABI
# ones (this is the `benchmark` slice of the 90-symbol app C-ABI; its body lives here,
# so the alias lives here too — the `rustty-config` per-crate precedent).
[features]
identity-ghostty = []

[dependencies]
rustty-vt = { workspace = true }
rustty-simd = { workspace = true }
rustty-unicode = { workspace = true }
# `cli.args.parse` / `cli.args.argsIterator` (the Options parsing + argv iterator).
# rustty-args is member 15, strictly-earlier than rustty-bench (28) — acyclic (R4).
rustty-args = { workspace = true }
# `ZigAllocatorRef` / `GlobalZigAllocator` for the OSC `Parser::init` allocator
# seam (member 7, strictly-earlier — acyclic).
rustty-lib = { workspace = true }
# The `std.mem.Allocator` map used by every benchmark's `create(alloc, ..)` and by
# `Terminal`/`Screen` (`allocator_api2::alloc::Global` == the process allocator).
allocator-api2 = { workspace = true }
