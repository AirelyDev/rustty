# rustty-bench — port crate (parity port order)
#
# Crate IDENTITY is `rustty-bench` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Faithful port of ghostty `src/main_bench.zig` (the 2-line re-export hub whose
# `pub const main = benchmark.cli.main` names the program entry point). The lib
# and bin share the `rustty-bench` name (a same-named lib+bin is permitted).
[[bin]]
name = "rustty-bench"
path = "src/main_bench.rs"

# `identity-oracle` no longer compiles any `ghostty_benchmark_cli` C-ABI alias (that
# forwarder layer was deleted by the rebrand — rebrand Task 1); the canonical product
# exports only `rustty_benchmark_cli` (R2), always. Enabling `identity-oracle` now
# only flips this crate's `rustty-identity` string identity; apprt-c enables this
# feature from its own `identity-oracle` so the flip is consistent across the linked
# staticlib.
[features]
identity-oracle = ["rustty-identity/identity-oracle"]
# `-Dsimd` (N420). ghostty-bench is built with the build's `cfg.simd` (default
# true off wasm), so this is default-on and threaded to every crate that reads
# it; before N420 the `rustty-vt` edges below pinned it, so `rustty-apprt-c`
# (which links this crate) could never be built SIMD-free. The workspace edge
# sets `default-features = false`; `rustty-apprt-c` threads it from its own.
default = ["simd"]
simd = ["rustty-vt/simd", "rustty-simd/simd", "rustty-apprt/simd"]

[dependencies]
# The `LOG`-class facade (DECISION-logging.md §6r4, call shape 2). This crate's
# 52 reference diagnostics were bare `eprintln!("[scope] ..")`, which reproduced
# neither logFn's rendering nor its behaviour. They now emit through the facade;
# `src/log_backend.rs` is the backend the standalone `[[bin]]` installs, since
# neither shipped backend is reachable from it (see §6r2/§7 and that module's
# header). Plain and unconditional (§8r).
log = { workspace = true }
# `identity-oracle` (above) flips this crate's string identity; `benchmark.rs`'s
# macOS signpost interval reads `APP_NAME` for the R2 signpost name (upstream's
# comptime `const signpost_name = "ghostty"`).
rustty-identity = { workspace = true }
# `build_config.bundle_id` — the os_log subsystem of the macOS Instruments
# signpost interval (`Benchmark.zig:50`). Member 2, strictly-earlier than
# rustty-bench (28) — acyclic (R4).
rustty-build-config = { workspace = true }
# `macos.os.Log` + `macos.os.signpost.*` — the Instruments interval in
# `Benchmark.run` (`Benchmark.zig:45-66`). Member 10, strictly-earlier than
# rustty-bench (28) — acyclic (R4).
rustty-os = { workspace = true }
# PERF(port): `simd` (now this crate's `simd` feature, N420) restores the
# reference bench binary's build configuration —
# ghostty-bench is built with `build_options.simd = true` (src/build/Config.zig:34,
# the default everywhere but wasm), so its terminal-stream bench runs the SIMD
# `nextSlice` fast path. The ported `Stream::next_slice` SIMD path is live and
# test-covered in both modes; without this flag the Rust bench binary was running
# the scalar fallback (a measured ~24% terminal-stream pessimization vs SIMD).
#
# `oniguruma` + `wuffs` (parity S43-F3, review-T-H Part 2B, Decision B commit
# 1): `GhosttyBench.zig:31-45` builds ghostty-bench through `deps.add(exe)`,
# i.e. `SharedDeps.add`, which gives every exe `terminalOptions(.ghostty, ..)`
# with `oniguruma = true` (so `tmux_control_mode` is on; `SharedDeps.zig:182`,
# `Config.zig:714`), the oniguruma library (`SharedDeps.zig:345-361`) and wuffs
# (`:521-526`, the `decodePngWuffs` default). The same set rustty-core turns on
# for the app. Before this, the Rust bench measured a rustty-vt without the
# tmux DCS arm or the built-in PNG decoder.
rustty-vt = { workspace = true, features = ["oniguruma", "wuffs"] }
rustty-simd = { workspace = true }
rustty-unicode = { workspace = true }
# WS7 D8: the `+scrollback-compression` bench walks the PageList node chain the
# way the oracle does (`node.next`). `PageList.Node`'s intrusive links are
# `pub(crate)` in rustty-vt and are reached through the
# `rustty_datastruct::intrusive_linked_list::Node` trait, so that crate (member 4,
# strictly-earlier than rustty-bench — acyclic) is a direct dependency.
rustty-datastruct = { workspace = true }
# `std.Random.DefaultPrng` (Xoshiro256++) for TerminalResize's deterministic
# synthetic fill (`std.Random.DefaultPrng.init(0xB3)`, dc52c248e). The
# workspace's std.Random port lives in rustty-synthetic (`rand.rs`). Acyclic
# (R4): rustty-synthetic depends only on rustty-vt/rustty-os/rustty-args, never
# on rustty-bench — mirroring the reference where `benchmark/` and `synthetic/`
# are sibling subtrees of one Zig module and benchmark code may draw on
# synthetic's stdlib surface.
rustty-synthetic = { workspace = true }
# `std.hash.Wyhash` for TerminalFormatter's report-mode output/pin hashes
# (85b1dd0dd/2ed67cadd). The Zig-stdlib shim crate; leaf — acyclic (R4).
rustty-zigstd = { workspace = true }
# `cli.args.parse` / `cli.args.argsIterator` (the Options parsing + argv iterator).
# rustty-args is member 15, strictly-earlier than rustty-bench (28) — acyclic (R4).
rustty-args = { workspace = true }
# `ZigAllocatorRef` / `GlobalZigAllocator` for the OSC `Parser::init` allocator
# seam (member 7, strictly-earlier — acyclic).
rustty-lib = { workspace = true }
# The `std.mem.Allocator` map used by every benchmark's `create(alloc, ..)` and by
# `Terminal`/`Screen` (`allocator_api2::alloc::Global` == the process allocator).
allocator-api2 = { workspace = true }
# `global.init(.{ .tool = minimal })` (`benchmark/cli.zig:55`; parity S43-F3,
# controller Decision B commit 2). The port's global init is
# `rustty_apprt::init_with_action`, whose body needs resourcesDir (apprt),
# crash, glslang and oniguruma init, so there is no lighter crate to take it
# from; `init_with_action(false)` is the `.tool` arm (no app-action detection).
# Default features only: on Linux that is the non-GTK build, so resourcesDir
# takes its non-GTK arm (the reference links the app runtime into every exe;
# the bench does not need GTK to init). Acyclic (R4): rustty-apprt does not
# depend on rustty-bench; rustty-apprt-c, which depends on both, sits above.
rustty-apprt = { workspace = true }

# P3-W0 T7 step 3. A DEV-dependency on purpose, not a normal one: the feature
# must be ON for `cargo test -p rustty-bench` and OFF for the shipped
# `rustty-bench` binary, which has to measure the REAL kernel decommit path.
# Cargo only pulls dev-dependencies into test/bench/example builds, so this
# split gives exactly that.
#
# Why the feature exists at all: `cfg(test)` is not transitive across crates.
# Zig's `builtin.is_test` is true for the WHOLE module graph under
# `zig build test`, so upstream's benchmark tests see the zeroing simulation in
# mem.rs; rustty-bench's tests link rustty-vt with `cfg(test)` FALSE and would
# instead exercise the real `MADV_FREE_REUSABLE` path. They pass on macOS/arm64
# today, but `scrollback_compression_restores_cold_terminal_pages` asserts
# `compressed_pages > 0`, which then depends on a real kernel call succeeding —
# on any target where `can_reclaim(Strict)` is false (non-Darwin, non-Linux,
# non-64-bit) it would FAIL where upstream's equivalent passes.
# See .port/phase-3/REVIEW_CLASSES.md section 3.
[dev-dependencies]
rustty-vt = { workspace = true, features = ["oniguruma", "wuffs", "test-decommit-sim"] }
