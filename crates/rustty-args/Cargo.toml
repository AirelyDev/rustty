# rustty-args — port crate (parity port order)
#
# Crate IDENTITY is `rustty-args` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-args"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The `LOG`-class facade (DECISION-logging.md §6r4, call shape 2). `rustty-args`
# sits below `rustty-vt-c`/`rustty-core` in R4's layering, so `cli/args.zig`'s
# three `log.{info,warn}` sites restore onto
# `log::{info,warn}!(target: "cli", ..)` and reach whichever `log::Log` backend
# the running binary installed. Plain and unconditional (§8r).
log = { workspace = true }
rustty-os = { workspace = true }
rustty-util = { workspace = true }
rustty-build-config = { workspace = true }
