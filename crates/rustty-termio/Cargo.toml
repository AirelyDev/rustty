# rustty-termio — port crate (parity port order)
#
# Crate IDENTITY is `rustty-termio` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-termio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-vt = { workspace = true }
rustty-crash = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-os = { workspace = true }
rustty-util = { workspace = true }
rustty-terminfo = { workspace = true }
# Integration-tier stage 2 dep wiring (blueprint: all four verified
# downward-safe — none deps termio; the acyclic gate is the backstop):
# - rustty-config: `Config` + the termio DerivedConfig source values
#   (reference `configpkg = @import("../config.zig")`).
# - rustty-renderer: `renderer.Size`/`renderer.State` + the cross-thread
#   `renderer.Thread.Mailbox`/`renderer.Message` surface.
# - rustty-apprt-api: `apprt.surface.Mailbox` == the already-landed
#   `surface::{AppMailbox, Message, SurfaceMessageEnvelope}` seam (termio is a
#   generic consumer, `M: AppMailbox`).
# - rustty-global: the `xev = @import("../global.zig").xev` seam anchor (D6
#   deferred; see `xev_seam` in src/xev_seam.rs).
rustty-config = { workspace = true }
rustty-renderer = { workspace = true }
rustty-apprt-api = { workspace = true }
rustty-global = { workspace = true }
# Core-tier C0 dep wiring (both downward-safe leaves):
# - rustty-xev: the SHARED xev handle placeholder types (`Async`/`Loop`/...),
#   hoisted from the termio-local `xev_seam` module (CORE_BLUEPRINT §5 "xev
#   handle unification"); `src/xev_seam.rs` re-exports them so in-crate paths
#   are unchanged. Also libxev's future home (D6).
rustty-xev = { workspace = true }
# - rustty-zigstd: the guard-less Zig-shaped `thread::Mutex` behind renderer
#   `State.mutex` (`mailbox::send`'s caller-held-mutex parameter — the mutex
#   model DECIDED by CORE_BLUEPRINT §3, landed in C0).
rustty-zigstd = { workspace = true }
# - rustty-inspector: `recordPtyRead` (INV-8) — the type-erased
#   `rustty_renderer::state::State::inspector_ptr` (`Option<*mut ()>`) is cast
#   back to `*mut rustty_inspector::Inspector` here (termio_impl.rs). Acyclic:
#   rustty-inspector does not depend on rustty-termio (it depends on
#   rustty-vt/rustty-renderer/rustty-font/rustty-input/rustty-datastruct/
#   rustty-lib/dcimgui-sys, all below termio); `check_acyclic.sh` stays green.
rustty-inspector = { workspace = true }
# Integration-tier stage 4 dep wiring (both leaf crates, downward-safe):
# - rustty-build-config: `build_config.version_string`/`build_config.flatpak`
#   (reference `build_config = @import("../build_config.zig")` in Exec.zig /
#   stream_handler.zig).
# - rustty-identity: the R2 product-identity source for the `GHOSTTY_*` env
#   names + shell-integration script/module names (rustty-os resourcesdir
#   precedent).
rustty-build-config = { workspace = true }
rustty-identity = { workspace = true }
# `alloc: Allocator` fields/params mirror rustty-vt's Terminal convention
# (`allocator_api2::alloc::Global as Allocator`).
allocator-api2 = { workspace = true }
# - rustty-lib: the process-static `GlobalZigAllocator`/`ZigAllocatorRef` that
#   backs the terminal Stream's OSC parser allocator in `Termio::init`
#   (`terminal_stream = .initAlloc(alloc, handler)` — the same `'static` global
#   the vt-c `TerminalWrapper` and `Terminal::vt_stream` use). FIRM leaf crate,
#   no cycle (termio already depends transitively via rustty-vt).
rustty-lib = { workspace = true }
# Raw FFI bindings to the platform libc for the relocated src/Command.zig port
# (fork/execve/dup2/dup3/fcntl/chdir/waitpid — integration-tier stage 3, break
# #13b). R3: `libc` binds the SAME system library the reference's Zig
# `std.posix`/`std.c` calls into (rustty-os precedent) — not a reimplementation.
libc = "0.2"
