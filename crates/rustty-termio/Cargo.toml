# rustty-termio — port crate (parity port order)
#
# Crate IDENTITY is `rustty-termio` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-termio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Pass-throughs for `rustty-font-shaper`'s three vendored-C font backends
# (FreeType / HarfBuzz / Fontconfig), forwarded through EVERY edge of this crate
# that reaches the shaper tier — `cargo tree -i rustty-font-shaper` names exactly
# four: `rustty-renderer` directly, plus `rustty-config`, `rustty-apprt-api` and
# `rustty-inspector`. Missing one would defeat the whole chain, because cargo
# features UNIFY across a resolve graph: a single edge still enabling them turns
# them back on for everybody.
#
# DEFAULT-ON, so every existing build of this crate is byte-identical (R5). They
# exist because this crate is what an EMBEDDER depends on. Cargo permits exactly
# one package per resolve graph declaring a given `links` value, and that check
# spans the whole graph regardless of target — so `rustty-font-shaper`'s
# `cfg`-gated `freetype-sys` / `fontconfig-sys` edges still collide with a host
# application that links FreeType or Fontconfig itself, and the only fix is for
# them to be ABSENT. A macOS embedder therefore takes
# `default-features = false` and names none of these: the reference's default
# Darwin backend is `.coretext` (CoreText for discovery, rendering AND shaping),
# so nothing is lost. Full rationale in the `[features]` header of
# `crates/rustty-font-shaper/Cargo.toml`.
default = ["freetype", "harfbuzz", "fontconfig"]
freetype = [
    "rustty-renderer/freetype",
    "rustty-config/freetype",
    "rustty-apprt-api/freetype",
    "rustty-inspector/freetype",
]
harfbuzz = [
    "rustty-renderer/harfbuzz",
    "rustty-config/harfbuzz",
    "rustty-apprt-api/harfbuzz",
    "rustty-inspector/harfbuzz",
]
fontconfig = [
    "rustty-renderer/fontconfig",
    "rustty-config/fontconfig",
    "rustty-apprt-api/fontconfig",
    "rustty-inspector/fontconfig",
]
# WS20: `build_config.flatpak` — the real `-Dflatpak` ghostty build option. When ON,
# `Exec.zig`'s `const FlatpakHostCommand = if (!build_config.flatpak) struct{...} else
# internal_os.FlatpakHostCommand` selects the REAL `os/flatpak.zig` host-command type
# and the flatpak spawn/wait/kill arms compile. OFF by default, exactly as ghostty's
# `-Dflatpak` defaults to false.
#
# It ALSO flips `rustty-build-config/flatpak`, and that chaining is the point:
# `Exec.zig`'s type selection and the `build_config.flatpak` runtime guard at
# `exec.rs`'s spawn site are two halves of ONE `-Dflatpak`. Splitting them into
# independently-settable cargo features would allow the state the reference
# cannot express — `build_config.flatpak == true` with the placeholder
# `FlatpakHostCommand` bound — so the two are welded together here.
flatpak = ["rustty-os/flatpak", "rustty-build-config/flatpak"]
# The reference `oniguruma` build option, forwarded to rustty-vt. It is what
# synthesizes `build_options.tmux_control_mode` (vt `options.rs`), which gates
# `dcsCommand`'s tmux control-mode arm here. OFF by default (matching a plain
# `cargo test -p rustty-termio`, whose vt has the feature off); the SHIPPED
# binary turns it on via rustty-core's `rustty-vt = { features = ["oniguruma"] }`.
# Turn it on to run the tmux-live half of the `dcsCommand` KAT:
#   cargo test -p rustty-termio --features oniguruma
oniguruma = ["rustty-vt/oniguruma"]

[dependencies]
rustty-vt = { workspace = true }
rustty-crash = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-os = { workspace = true }
rustty-util = { workspace = true }
rustty-terminfo = { workspace = true }
# Integration-tier stage 2 dep wiring (blueprint: all four verified
# downward-safe — none deps termio; the acyclic gate is the backstop):
# - rustty-config: `Config` + the termio DerivedConfig source values
#   (reference `configpkg = @import("../config.zig")`).
# - rustty-renderer: `renderer.Size`/`renderer.State` + the cross-thread
#   `renderer.Thread.Mailbox`/`renderer.Message` surface.
# - rustty-apprt-api: `apprt.surface.Mailbox` == the already-landed
#   `surface::{AppMailbox, Message, SurfaceMessageEnvelope}` seam (termio is a
#   generic consumer, `M: AppMailbox`).
# - rustty-global: the `xev = @import("../global.zig").xev` seam anchor (D6
#   deferred; see `xev_seam` in src/xev_seam.rs).
# `default-features = false` + the explicit feature list (the same shape
# `rustty-wasm` uses on this dependency): `rustty-config`'s defaults now include
# the `freetype`/`harfbuzz`/`fontconfig` pass-throughs, and this crate sits on an
# EMBEDDER's dependency path, where cargo feature UNIFICATION means one edge
# still enabling them turns them back on for the whole graph. The two non-font
# defaults are named back explicitly so the build is otherwise unchanged (R5),
# and the font trio is forwarded by this crate's own features instead. It cannot
# be spelled as `{ workspace = true, default-features = false }` — Cargo IGNORES
# a member's `default-features = false` when the workspace dependency did not
# declare it.
rustty-config = { path = "../rustty-config", default-features = false, features = [
    "renderer",
    "input-oniguruma",
] }
rustty-renderer = { workspace = true }
# Same opt-out as `rustty-config` above: this crate forwards the font trio
# itself, so the edge must not switch it on. Whole-graph `links` uniqueness plus
# feature unification is why one enabling edge would be enough to break an
# embedder (see this manifest's `[features]` header).
rustty-apprt-api = { path = "../rustty-apprt-api", default-features = false }
rustty-global = { workspace = true }
# Core-tier C0 dep wiring (both downward-safe leaves):
# - rustty-xev: the SHARED xev handle placeholder types (`Async`/`Loop`/...),
#   hoisted from the termio-local `xev_seam` module (CORE_BLUEPRINT §5 "xev
#   handle unification"); `src/xev_seam.rs` re-exports them so in-crate paths
#   are unchanged. Also libxev's future home (D6).
rustty-xev = { workspace = true }
# - rustty-zigstd: the guard-less Zig-shaped `thread::Mutex` behind renderer
#   `State.mutex` (`mailbox::send`'s caller-held-mutex parameter — the mutex
#   model DECIDED by CORE_BLUEPRINT §3, landed in C0).
rustty-zigstd = { workspace = true }
# - rustty-inspector: `recordPtyRead` (INV-8) — the type-erased
#   `rustty_renderer::state::State::inspector_ptr` (`Option<*mut ()>`) is cast
#   back to `*mut rustty_inspector::Inspector` here (termio_impl.rs). Acyclic:
#   rustty-inspector does not depend on rustty-termio (it depends on
#   rustty-vt/rustty-renderer/rustty-font/rustty-input/rustty-datastruct/
#   rustty-lib/dcimgui-sys, all below termio); `check_acyclic.sh` stays green.
# Same opt-out as `rustty-apprt-api` above.
rustty-inspector = { path = "../rustty-inspector", default-features = false }
# Integration-tier stage 4 dep wiring (both leaf crates, downward-safe):
# - rustty-build-config: `build_config.version_string`/`build_config.flatpak`
#   (reference `build_config = @import("../build_config.zig")` in Exec.zig /
#   stream_handler.zig).
# - rustty-identity: the R2 product-identity source for the `GHOSTTY_*` env
#   names + shell-integration script/module names (rustty-os resourcesdir
#   precedent).
rustty-build-config = { workspace = true }
rustty-identity = { workspace = true }
# `alloc: Allocator` fields/params mirror rustty-vt's Terminal convention
# (`allocator_api2::alloc::Global as Allocator`).
allocator-api2 = { workspace = true }
# - rustty-lib: the process-static `GlobalZigAllocator`/`ZigAllocatorRef` that
#   backs the terminal Stream's OSC parser allocator in `Termio::init`
#   (`terminal_stream = .initAlloc(alloc, handler)` — the same `'static` global
#   the vt-c `TerminalWrapper` and `Terminal::vt_stream` use). FIRM leaf crate,
#   no cycle (termio already depends transitively via rustty-vt).
rustty-lib = { workspace = true }
# Raw FFI bindings to the platform libc for the relocated src/Command.zig port
# (fork/execve/dup2/dup3/fcntl/chdir/waitpid — integration-tier stage 3, break
# #13b). R3: `libc` binds the SAME system library the reference's Zig
# `std.posix`/`std.c` calls into (rustty-os precedent) — not a reimplementation.
libc = "0.2"
# The `log` facade (DECISION-logging.md §6 call shape 1 / §6r4: every crate below
# `rustty-vt-c` restores its reference `std.log.scoped(...)` sites as
# `log::{warn,error,info,debug}!(target: LOG_SCOPE, ...)`). Plain and
# unconditional — the `release_max_level_*` comptime gate belongs only on the
# three wasm artifact root crates (§8r), and rustty-termio is not one.
log = { workspace = true }

[dev-dependencies]
# `P3-W3` T6 Step 4: the config -> PageList scrollback-limit handoff KAT drives
# `Config::parse_into_field`, which is the `rustty_args::args::Target` trait
# method, so the trait must be in scope for the test. TEST-ONLY; rustty-config
# (a real dependency above) already depends on rustty-args, so this adds no new
# edge to the production graph.
rustty-args = { workspace = true }
