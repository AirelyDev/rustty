# rustty-core — port crate (parity port order)
#
# Crate IDENTITY is `rustty-core` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Task R13-D2 (UD104): test-only fault injection for `Surface::init`'s
# post-spawn error path (`src/init_fault.rs`). Enabled ONLY from
# rustty-apprt-c's `[dev-dependencies]`, so with `resolver = "2"` no
# production build (`cargo build -p rustty`, `--workspace`, the release and
# xcframework profiles) compiles it; where it is compiled it is inert until a
# test arms it on its own thread.
init-fault-inject = []

[dependencies]
# The `LOG` findings-class facade (task-14a review CRITICAL 2,
# `.port/parity-closure/DECISION-logging.md` §6): the app-build counterpart of
# `rustty-vt-c::sys::Logger` — `logging::AppLogger` forwards restored
# `log::warn!` sites in `rustty-vt`/`rustty-renderer`/`rustty-font-shaper`/
# `rustty-termio`/etc. (14b-14e) into this crate's OWN already-faithful
# `logging::log` sink, so the actual `rustty` application binary (which does
# NOT link `rustty-vt-c`) has a real backend once those sites are restored.
log = { workspace = true }
# Core C13 (`linkAtPin`, Surface.zig:4347): `strmap.searchIterator(link.regex)`
# is vt's `build_options.oniguruma`-gated StringMap search surface — the
# reference build compiles Ghostty WITH oniguruma, so core (the reference
# binary tier) turns the feature on. Per-crate `cargo test -p rustty-vt` still
# runs the default feature set (the 3 gated string_map tests stay
# feature-gated, faithful to the Zig `SkipZigTest` arms).
#
# `wuffs` = the sys.zig decodePngWuffs default for the app tier (SharedDeps
# `.ghostty` terminalOptions analog; the standalone rustty-vt-c stays `.lib`/None).
#
# `simd` = `build/Config.zig:196-206` — `-Dsimd` defaults to TRUE for every
# non-WASM target ("Build with SIMD-accelerated code paths. Results in
# significant performance improvements."), and `SharedDeps` threads `cfg.simd`
# into the terminal module, so the reference app binary runs
# `stream.zig`'s SIMD `nextSlice` fast path. Rustty's app tier (this crate) turns
# it on to match. rustty-vt's OWN default stays empty — the Zig terminal module
# has no self-default either; consumers thread the knob — so `cargo test -p
# rustty-vt` keeps its scalar-arm coverage and `--features simd` its SIMD arm.
rustty-vt = { workspace = true, features = ["oniguruma", "simd", "wuffs"] }
# bc2f7d7d2: Surface.zig gains `const simd = @import("simd/main.zig")` for the
# OSC 52 strict base64 decode in `clipboardWrite`.
rustty-simd = { workspace = true }
rustty-config = { workspace = true }
# The three font-backend pass-throughs are default-on for this crate, exactly as
# before they became features; the workspace dependency sets
# `default-features = false` (see the root manifest) only so the crates on an
# embedder's path can opt out, so this consumer names them and builds
# byte-identically (R5).
rustty-renderer = { workspace = true, features = ["freetype", "harfbuzz", "fontconfig"] }
rustty-font = { workspace = true }
rustty-input = { workspace = true }
rustty-termio = { workspace = true }
rustty-os = { workspace = true }
rustty-crash = { workspace = true }
rustty-inspector = { workspace = true }
rustty-apprt-api = { workspace = true }
rustty-global = { workspace = true }
# Core C0 dep completion (CORE_BLUEPRINT §6 [ADV-FIX 5] — all leaves/
# downward-safe; the acyclic gate is the backstop):
# - rustty-util: `crash` scoped logging helpers etc. (reference `@import("util")`
#   surface reached throughout Surface.zig).
# - rustty-unicode: Surface.zig:23 `const unicode = @import("unicode/main.zig")`.
# - rustty-oniguruma: Surface.zig:24 `const oni = @import("oniguruma")` — a
#   DIRECT import (linkAtPos regex search), not via rustty-input.
# - rustty-datastruct: `App.Mailbox.Queue = BlockingQueue(Message, 64)` +
#   `blocking_queue::{Timeout, Size}` (App.zig:560).
# - rustty-zigstd: the guard-less `thread::Mutex` behind renderer `State.mutex`
#   (Surface owns the mutex the renderer state points at; CORE_BLUEPRINT §3).
# - rustty-xev: the shared xev handle placeholder types for the renderer thread
#   seam (`wakeup: xev.Async` handed to `termio::Options.renderer_wakeup`;
#   CORE_BLUEPRINT §5).
rustty-util = { workspace = true }
rustty-unicode = { workspace = true }
rustty-oniguruma = { workspace = true }
# Core C3 (renderer_seam): renderer/Options.zig `font_grid: *font.SharedGrid`
# — `SharedGrid`/`SharedGridSet` live in the D1 3-tier shaper crate ABOVE
# vt+font (rustty-font-shaper); Surface<A>/App<A> also need it
# (`font_grid_set: SharedGridSet`, CORE_BLUEPRINT §1). Downward-safe edge
# (core is the top tier); the acyclic gate is the backstop.
# The three vendored-C font backends are default-on for this crate, exactly as
# before they became features: the workspace dependency sets
# `default-features = false` (see the root manifest) purely so
# `rustty-renderer` can expose the opt-out an embedder needs, so every other
# consumer names them here and builds byte-identically (R5).
rustty-font-shaper = { workspace = true, features = ["freetype", "harfbuzz", "fontconfig"] }
rustty-datastruct = { workspace = true }
rustty-zigstd = { workspace = true }
rustty-xev = { workspace = true }
# Core C6 (Surface.init): the reference's `GHOSTTY_*` env-var names carry the
# product identity per R2 (the `GHOSTTY_LOG` removal + the
# `GHOSTTY_SURFACE_ID` put, Surface.zig:640/643 — the termio
# shell_integration `env_name` precedent). Leaf dep.
rustty-identity = { workspace = true }
# `alloc: Allocator` fields/params mirror the termio/vt convention
# (`allocator_api2::alloc::Global as Allocator`).
allocator-api2 = { workspace = true }

[dev-dependencies]
# Task R13-B (UD59): the window-size overflow tests load config text through
# `Config::load_iter`, which takes rustty-args' `LineIterator`.
rustty-args = { workspace = true }
