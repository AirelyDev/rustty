# rustty-vt — port crate (parity port order)
#
# Crate IDENTITY is `rustty-vt` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Build-time terminal options (ported from terminal/build_options.zig's Options /
# the generated `terminal_options` module). These are the build knobs the
# reference `build.zig` toggles; the ported `options` module reads them via
# `cfg!(feature = ...)`. Later vt sub-batches gate on `crate::options::*`.
[features]
# ---------------------------------------------------------------------------
# `-Dvt-features` (reference `terminal/build_options.zig` `Options.Features`,
# `1fdbb8c91`). "Optional features for lib artifacts. Disabling a feature
# removes its C API exports and any stream-integrated handling from the build,
# primarily so size-conscious embedders (e.g. wasm) can trim the binary. The
# Ghostty application itself always builds with every feature enabled."
#
# The ten names below are the accepted `-Dvt-features` tokens (the reference's
# `eqlName` makes `-` and `_` interchangeable, so the cargo-conventional hyphen
# spelling is the same token). They are ALL in `default`, which is what makes an
# additive cargo feature set equivalent to the reference's subtract-from-all
# model: an ordinary build gets `Features{}`. The reference's
# `-Dvt-features=-all,+render-state` is `--no-default-features --features
# render-state`.
#
# Each feature drives exactly one `options::*` const (src/options.rs), which the
# gated code branches on — and, in `rustty-vt-c`, decides whether the matching
# `#[no_mangle]` C exports exist at all (the `lib_vt.zig` `if (features.X)`
# blocks). Compiling the const to `false` leaves the guarded Rust code in the
# crate for the linker to drop, exactly as the reference relies on its comptime
# `false` branches being dead-code-eliminated.
#
# The reference default set: every feature enabled (`Features{}`). Named as
# `default` so an ordinary build, and the whole workspace, is unchanged.
# TEST-ONLY, CROSS-CRATE (parity S166-F2). Zig's `builtin.is_test` is true for
# the whole compilation unit at ANY optimize mode, so the reference's
# allocation-failure tests run under `zig build test -Doptimize=Release*`. In
# Rust `cfg(test)` is per-compilation-unit, so a fail point in THIS crate is
# invisible to a test in another crate, and `cfg(debug_assertions)` — the
# workaround that was used instead — deletes the fail point from every release
# build, test or not, which silently turned three fail-point tests into
# `#[cfg(debug_assertions)]` no-ops in the release lane. Downstream crates whose
# tests arm this crate's fail points turn this on as a DEV-dependency feature
# (`rustty-vt-c`), so it unifies only into test/bench/example builds; a
# production `cargo build --release` builds no dev-deps and compiles the fail
# points away.
tripwire-test = ["rustty-util/tripwire-test"]
default = [
    "snapshot",
    "formatter",
    "selection",
    "search",
    "render-state",
    "input-encode",
    "color",
    "grid-introspection",
    "glyph-protocol",
    "kitty-graphics",
]
# Terminal state serialization; C API `rustty_snapshot_*` (and, with
# `grid-introspection`, `rustty_tracked_grid_ref_snapshot`).
snapshot = []
# Textual export as plain text / VT / HTML; C API `rustty_formatter_*` (and,
# with `selection`, `rustty_terminal_selection_format_*`).
formatter = []
# Text selection + the click/drag gesture state machine; C API
# `rustty_terminal_select_*`, `rustty_terminal_selection_*`,
# `rustty_selection_gesture_*`.
selection = []
# Terminal search: find matches for a string in the active area and scrollback
# (ASCII case-insensitive), with results that survive primary/alternate screen
# switches, resize, and scrollback pruning, plus match selection with
# wrap-around and viewport scrolling; C API `rustty_search_*` (oracle
# `32601cd79`/`f9202919f`, `build_options.zig` `Features.search`).
search = []
# The render state API (the primary embedder read path); C API
# `rustty_render_state_*`.
render-state = []
# Host input-event encoding; C API `rustty_key_event_*`, `rustty_key_encode_*`,
# `rustty_mouse_event_*`, `rustty_mouse_encode_*`.
input-encode = []
# Color utilities; C API `rustty_color_*`.
color = []
# Direct grid introspection; C API `rustty_cell_*`, `rustty_row_*`.
grid-introspection = []
# The APC glyph protocol. No C API surface of its own; this gates the stream
# handling and glossary storage.
glyph-protocol = []
# The Kitty graphics protocol; C API `rustty_kitty_graphics_*`. NOTE this
# feature is necessary but not sufficient: `options::KITTY_GRAPHICS` ANDs it
# with a target check, because the protocol needs OS timestamps and is always
# off on freestanding targets (`target_os = "none"`, any arch — `3376153a4`)
# regardless of the setting (the reference `Options.kittyGraphics` override).
#
# It also links `rustty-wuffs` (DECISIONS B8 as amended by Ruling 30,
# `4b86e3594`): the reference wires wuffs into the vt module only when Kitty
# graphics is enabled for the target (`src/build/GhosttyZig.zig:140-152`, for
# the pixel swizzles and, since `4b86e3594`, the zlib decoder), so not on a
# freestanding target: its lib-vt wasm artifact (`wasm32-freestanding`, rustty's
# `wasm32-unknown-unknown`) has neither Kitty graphics nor wuffs. The dep is
# declared in the target table below, which excludes exactly those targets, so
# this enables nothing there (build.rs: `cfg(rustty_kitty_graphics)`).
# `wasm32-wasip1` (Zig's `.wasi`) keeps both. This is separate from the `wuffs`
# feature below, which only selects the `sys.decode_png` default.
kitty-graphics = ["dep:rustty-wuffs"]
# ---------------------------------------------------------------------------
# Whether Oniguruma regex support is available (reference `oniguruma`). Gates
# Kitty graphics protocol and Tmux control mode. Off by default, matching a build
# without the optional regex dependency. Wires in the `rustty-oniguruma` safe
# wrapper (imported as `oni`, the reference module binding) so the gated
# `string_map.rs` search surface compiles.
oniguruma = ["dep:rustty-oniguruma"]
# Whether to build SIMD-accelerated code paths (reference `-Dsimd`). Off in THIS
# crate's own default set — the Zig terminal module has no self-default either,
# consumers thread the knob (rustty-core / rustty-vt-c / rustty-apprt-c turn it
# on, matching `-Dsimd`'s non-wasm default) — so `cargo test -p rustty-vt` keeps
# its scalar-arm coverage and `--features simd` its SIMD arm. NOTE the reference
# default is target-conditional (`build/Config.zig:200-206` forces it false for
# wasm); that arm lives in `options::SIMD`, which overrides this feature on
# wasm32 targets.
#
# It also switches `rustty-simd` (N420): the reference's `src/simd/*.zig` read
# the SAME `build_options.simd` (`GhosttyZig.zig:125-156` hands the terminal
# module `cfg.simd` and adds the SIMD kernels only when it is set), so with this
# feature off the base64/indexOf/codepoint-width helpers the terminal calls run
# their scalar fallbacks and no highway/simdutf code is compiled or linked.
simd = ["rustty-simd/simd"]
# P3-W0 T7 step 3 — the decommit SIMULATION, gated CRATE-EXTERNALLY.
#
# `mem.rs` branches on `cfg!(test) || cfg!(miri)` to port Zig's
# `builtin.is_test`. Those are NOT equivalent: `zig build test` compiles the
# whole terminal module with `is_test = true`, so upstream's BENCHMARK tests see
# the zeroing simulation, whereas `cfg(test)` is per-compilation-unit and is
# FALSE when `rustty-bench` links `rustty-vt` — so rustty's bench tests exercise
# the real kernel `MADV_FREE_REUSABLE` path instead. They pass on macOS/arm64
# today, but `scrollback_compression_restores_cold_terminal_pages` asserts
# `compressed_pages > 0`, which then depends on a real kernel call succeeding:
# on any target where `can_reclaim(Strict)` is false (non-Darwin, non-Linux,
# non-64-bit) it FAILS where upstream's passes.
#
# This feature is the crate-EXTERNAL switch that restores `is_test` semantics
# for such a consumer. `rustty-bench` enables it on its `rustty-vt` dependency.
# It must stay off in production builds.
test-decommit-sim = []
# Whether the wuffs image-decode binding is available (the reference
# `@import("wuffs")` inside sys.zig's `decodePngWuffs`). The reference default
# is comptime: `artifact == .lib` -> null, else `&decodePngWuffs` — and ONLY the
# standalone libghostty-vt build passes `.lib` (GhosttyZig.zig:67); every app
# artifact incl. the macOS embedded lib uses `.ghostty` (SharedDeps.zig:136).
# Mapped as a cargo feature: rustty-core (the SharedDeps analog) turns it ON for
# the whole application tier; rustty-vt-c (the GhosttyZig `.lib` analog) leaves
# it OFF so a `-p rustty-vt-c` build keeps the reference `null` default.
# (Workspace-wide dev builds unify the feature onto rustty-vt-c too — additive
# and harmless; the SHIPPED standalone vt lib is built `-p rustty-vt-c`.)
# Since DECISIONS B8 the crate is also LINKED under `kitty-graphics` (above), so
# this feature no longer decides whether wuffs is in the graph, only the
# `decode_png` default.
wuffs = ["dep:rustty-wuffs"]
# Parity-harness identity profile (R2). Flips the vt LIBRARY version (the
# reference's deliberate app/lib version split, `build.zig:10` `lib_version`)
# to the reference ghostty value by forwarding to `rustty-identity`'s feature
# of the same name, so the G4 differential output (c-vt-build-info) matches
# the oracle byte-for-byte. Harness only — never for published artifacts.
# Also forwarded to `rustty-terminfo` so the XTGETTCAP static-map responses
# (`74efadb44`, stream_terminal.rs) carry a coherent identity profile.
identity-oracle = [
    "rustty-identity/identity-oracle",
    "rustty-terminfo/identity-oracle",
]
# Whether the apprt-layer `dcimgui` (cimgui) binding is available. Gates
# `input::key::Key::imgui_key` (the Key->cimgui-constant mapping), an apprt-layer
# GUI-glue dependency (R3). Off by default so the VT crate has no GUI dependency;
# the apprt `gtk` feature turns it on (rustty-apprt Cargo.toml). When ON it pulls
# the `dcimgui-sys` FFI leaf (the `ImGuiKey_*` constants `imgui_key` returns).
# `dcimgui-sys/freetype` is named here (rather than inherited) because the
# workspace dependency now sets `default-features = false` — see the root
# manifest. Enabling `imgui` is therefore byte-identical to before (R5), and with
# `imgui` off, as it is by default, `dcimgui-sys` is not in the graph at all.
imgui = ["dep:dcimgui-sys", "dcimgui-sys/freetype"]
# OFF-BY-DEFAULT bench instrumentation: compiles the PageList page-allocation
# tracking seam (`pagelist::page_tracking` + the `TrackingAllocator` child of the
# page pool) into a NON-test build, so the standalone `alloc_bench` example can
# count page allocs/bytes with production page geometry (`std_capacity`'s
# `cfg!(test)` stays false => grapheme_bytes 8192, std_size 589824) and without
# libtest overhead. The seam sites are `cfg(any(test, feature = "alloc-bench"))`;
# with the feature OFF a production build compiles exactly the code it always
# did (the tracker is observation-only even when compiled in). Never enable for
# published artifacts.
alloc-bench = ["rustty-zigstd/tracking"]
# TEST-ONLY: exposes `alloc::testing` (the `std.testing.FailingAllocator` port
# and the counting allocator on the C `RusttyAllocator` ABI) to dependents'
# tests. rustty-vt-c enables it from `[dev-dependencies]` only, so no
# production build compiles it (parity tail S7-1).
test-allocators = []

# The standalone equal-scope PageList allocation bench (see the Zig twin at
# .port/phase-1/bench-zig-pagelist). `required-features` makes cargo skip it
# entirely unless the alloc-bench seam is compiled in.
[[example]]
name = "alloc_bench"
required-features = ["alloc-bench"]

[dependencies]
# R2 identity source of truth: provides the vt LIBRARY version consumed by
# `options.rs` (`VT_LIB_VERSION`), porting the reference's separate
# `lib_version` (`build.zig:7-10`, "We use a separate version from the app")
# instead of coincidentally reusing the workspace/app version. Leaf constants
# crate — no dependency edges.
rustty-identity = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-unicode = { workspace = true }
# D1 (Option C): rustty-font is PURE and BELOW vt. apc/glyph deps the glyf
# decoder DIRECTLY (mandatory decode, not a runtime hook). rustty-font must
# NEVER gain a rustty-vt edge (prod or dev) — enforced by check_acyclic.sh.
rustty-font = { workspace = true }
rustty-simd = { workspace = true }
# `74efadb44` "lib-vt: answer XTGETTCAP queries" — "This is the first
# dependency from src/terminal on src/terminfo": stream_terminal answers
# XTGETTCAP from the static terminfo map. Acyclic (rustty-terminfo depends only
# on the leaf rustty-identity); verified by check_acyclic.sh.
rustty-terminfo = { workspace = true }
rustty-os = { workspace = true }
rustty-lib = { workspace = true }
rustty-util = { workspace = true }
rustty-render-types = { workspace = true }
# task 14b (DECISION-logging.md §6r IMPORTANT 5, call shape 3): `rustty-vt` sits
# below `rustty-core`/`rustty-vt-c` in R4's acyclic layering (neither may be
# depended on here without inverting it), so restored `log.{warn,info,err,debug}`
# sites call the `log` crate's macros directly — reaching whichever of the two
# process-wide backends (`rustty-vt-c::sys::Logger` or
# `rustty-core::logging::AppLogger`) the running binary installed. First genuine
# runtime dependency of this crate (previously `log` was only a `bindgen`
# build-dependency transitively, per DECISION-logging.md §3).
log = { workspace = true }
# R3: the safe Oniguruma wrapper (imported as `oni`). Optional — only pulled in
# under `--features oniguruma`, which gates `string_map.rs`'s regex search
# surface (faithful to the reference's optional `oniguruma` build dependency).
rustty-oniguruma = { workspace = true, optional = true }
rustty-zigstd = { workspace = true }
# Faithful Rust map of Zig's `std.mem.Allocator` (the child threaded through the
# zigstd MemoryPool/ArenaAllocator). `Global` reproduces the prior `std::alloc`
# path, so PageList behavior is unchanged.
allocator-api2 = { workspace = true }
# Allocator-aware hash maps over the `alloc::VtAllocator` handle (the managed
# `std.AutoHashMap`s the reference builds over the caller's allocator, e.g.
# `PageList.Clone.TrackedPinsRemap`). Declared once in the workspace.
hashbrown = { workspace = true }
# Same libc the reference's std.posix binds (R3). Used by kitty/graphics_image
# for the POSIX shared-memory medium (shm_open/mmap/fstat/munmap/shm_unlink).
libc = "0.2"
# R3 GUI-glue FFI leaf (Dear ImGui + Dear Bindings C API): the `ImGuiKey_*`
# constants `input::key::Key::imgui_key` maps `Key` to. Optional — only pulled in
# under `--features imgui` (turned on by the apprt `gtk` feature), so a default VT
# build has no GUI dependency. A lower-tier `-sys` crate (acyclic).
dcimgui-sys = { workspace = true, optional = true }
# The pkg/wuffs parity crate: `decodePngWuffs`'s `wuffs.png.decode` (sys.zig,
# the `wuffs` feature), and the kitty graphics swizzles and zlib decoder
# (`wuffs.swizzle`, `wuffs.zlib.decode`, the `kitty-graphics` feature). Optional
# so a build without either has no wuffs, as the reference's has none without
# Kitty graphics. A strictly-earlier leaf (deps: wuffs-sys + allocator-api2), no
# cycle (R4).
#
# P7-W5 T2 (DECISIONS B8, amended by Ruling 30): kitty zlib decompression moved
# from the vendored C zlib (`zlib-sys`, excluded from wasm32 with an
# `Unsupported` stub there) to wuffs, as `4b86e3594` moved the reference's off
# `std.compress.flate`. So `zlib-sys` is no longer a rustty-vt dependency. The
# freestanding targets (`target_os = "none"`, `wasm32-unknown-unknown`) have
# Kitty graphics off, as the reference's, and link no wuffs: the freestanding
# wasm artifact stays pure Rust.
[target.'cfg(not(any(target_os = "none", all(target_arch = "wasm32", target_os = "unknown"))))'.dependencies]
rustty-wuffs = { workspace = true, optional = true }

[dev-dependencies]
# TEST-ONLY: enable the `tracking` feature of rustty-zigstd so the PageList tests
# can wrap the page pool's `PageAllocator` child in a `TrackingAllocator` (the
# scoped faithful equivalent of Zig's `pageAllocator()` returning
# `std.testing.allocator` under `is_test`) and assert ZERO outstanding page
# allocations after deinit — native-speed leak coverage where Miri times out (R6).
# A dev-dependency activates the feature ONLY for test/bench/example builds, so the
# tracking wrapper is compiled into the `cfg(test)` PageList page pool and is
# absent from the production library.
rustty-zigstd = { workspace = true, features = ["tracking"] }
# TEST-ONLY: enable rustty-util's `tripwire-test` feature so this crate's
# fail-point tests trip in the RELEASE test lane too. Zig's `builtin.is_test`
# (tripwire.zig: `pub const enabled = builtin.is_test`) is true for the whole
# compilation unit at ANY optimize mode, so the reference's allocation-failure
# tests run under `zig build test -Doptimize=Release*`; approximating it with
# `cfg!(debug_assertions)` alone lost that half of the coverage. A
# dev-dependency activates the feature ONLY for test/bench/example builds, so
# `cargo build --release` (no dev-deps) still compiles `tripwire::check` away.
rustty-util = { workspace = true, features = ["tripwire-test"] }
rustty-synthetic = { workspace = true }
# TEST-ONLY: the §4 alloc/latency/RSS bench harness (pagelist::bench) calls
# getrusage(RUSAGE_SELF) for peak RSS. Same libc the reference's std.posix binds
# (R3); dev-only so it never enters the production library.
libc = "0.2"
