# rustty-lib — port crate (parity port order)
#
# Crate IDENTITY is `rustty-lib` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# `parse_int` (ghostty `src/lib/parse_int.zig`) takes `std.fmt.ParseIntError` and
# `std.fmt.charToDigit` from Zig's std; their one port is `rustty_zigstd::fmt`.
# rustty-zigstd is a leaf over rustty-util, so the graph stays acyclic.
rustty-zigstd = { workspace = true }
