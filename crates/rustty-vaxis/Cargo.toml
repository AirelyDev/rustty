# rustty-vaxis — pure-Rust port of the vendored `libvaxis` 0.5.1 subset (R3 vendored dep).
#
# Crate IDENTITY is `rustty-vaxis` (R4), the vendored-dep-port pattern like
# `rustty-z2d`/`rustty-zf`. libvaxis (rockorager, 0.5.1, hash
# `BWNV_LosCQAGmCCNOLljCIw6j6-yt53tji6n6rwJ2BhS`) is the TUI dependency of
# ghostty's interactive CLI — a DEPENDENCY, not ghostty source; therefore its own
# `test {}` blocks are not part of the src/ parity test contract and this crate is
# absent from that crate_map. Its value-type semantics must nonetheless be
# byte-faithful (the Key matchers rely on `std.meta.eql` over packed structs).
#
# PORT STATUS: the chunk sequence 1a-4b is FINISHED and, as of WS12, the IMAGE TIER IS
# LIVE. The only remaining seams are the `#[cfg(windows)]` family (`WindowsTty`, the
# windows `tty_run` arm, `TestTty::next_event`) — see src/lib.rs and DEFERRALS.md
# "rustty-vaxis Chunk 3b".
#
# HISTORY (this block previously asserted two things that are now false; corrected in
# WS12 T8 rather than left to rot):
#   - "gwidth.zig + unicode.zig are DEFERRED to Chunk 1b (uucode-0.1.0 width-table
#     blocker)" — FALSE since commit e0abb03 (2026-07-10). Chunk 1b LANDED: `build.rs`
#     regenerates the uucode-0.1.0 stage1/stage2 tables from the vendored UCD 16.0.0
#     corpus in `ucd/`, and `gwidth.rs`/`unicode.rs` are live. The uucode fork was
#     decided as Option B and RATIFIED 2026-07-29 (.port/phase-2/VAXIS_C1B_DESIGN.md,
#     "WS12 decisions"), with the non-vacuity of its table gate proven in WS12 T4.
#   - "Pure Rust, NO dependencies (R3/R4 acyclic leaf)" — FALSE. This crate has TWO
#     dependencies: `libc` (Chunk 3b's termios/ioctl/sigaction FFI, see below) and, since
#     WS12, `rustty-zigimg`. It is still an acyclic near-leaf (R4): neither dep has an
#     edge back here, and the new edge is `rustty-vaxis -> rustty-zigimg ->
#     {rustty-wuffs, zlib-sys}` with no back-edge.
#
# CHUNK 1a ported the CORE VALUE TYPES: Cell.zig (Style/Color/Segment/Cell + SGR bits),
# Key.zig (Key + constants + matchers + Modifiers/KittyFlags packed structs), Mouse.zig,
# GraphemeCache.zig, the Winsize struct (main.zig:38), and the Image STRUCT SHAPE.
#
# The leak/UB gate is Miri (R6). The crate is Miri-PRIMARY except for three documented
# exception classes, all in .port/phase-2/MIRI_EXCEPTIONS.md: the `tty.rs` libc FFI
# (Chunk 3b), the `tests/ucd_provenance.rs` file reads (WS12 T4), and the PNG arms of
# `tests/image_tier.rs`, which reach `rustty-zigimg`'s wuffs/zlib FFI (WS12 T8/T9). Every
# pure test — including the whole `Image::draw`/`cell_size` geometry KAT set — stays
# Miri-live.
[package]
name = "rustty-vaxis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# CHUNK 1b: build.rs parses the vendored UCD 16.0.0 corpus (`ucd/`) and emits the
# uucode-0.1.0 stage1/stage2 width/grapheme tables into OUT_DIR. std-only, NO
# build-dependencies (keeps rustty-vaxis a dep-free R4 leaf; Miri-clean at runtime).
build = "build.rs"

[lints]
workspace = true

# CHUNK 3b adds the IMPURE half of the backend (queue/tty/Loop). The tty layer needs
# the termios/ioctl/sigaction FFI, so this crate takes ONE new dependency: `libc`.
# `libc` is a LEAF (no rustty edges) pinned per-crate (matching rustty-os/rustty-vt/
# rustty-xev/… — a plain `libc = "0.2"` literal, NOT `workspace = true`), so
# rustty-vaxis stays acyclic (R4). No other new crate deps: queue is pure std; Loop
# consumes intra-crate parser/event/grapheme_cache/key/mouse/Winsize + the Vaxis
# placeholder. (It is otherwise a value-type/rendering/input crate, formerly dep-free.)
#
# WS12 adds the SECOND dependency: `rustty-zigimg`, the re-home of the six-operation
# zigimg surface `Vaxis::transmit_image`/`load_image` need (WS12 Decision 2, Option Z-C).
# It is a leaf over `rustty-wuffs` + `zlib-sys`, so `rustty-vaxis` stays acyclic (R4).
[dependencies]
libc = "0.2"
rustty-zigimg = { workspace = true }

# WS12: `tests/image_tier.rs` decodes the PNG payload it just watched
# `transmit_image`/`load_image` emit, to prove the escape carries a REAL image rather than
# plausible-looking bytes. That needs the decoder directly (and its allocator parameter).
# Test-only: neither is on any runtime path of this crate.
[dev-dependencies]
rustty-wuffs = { workspace = true }
allocator-api2 = { workspace = true }
