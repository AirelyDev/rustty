# rustty-identity — port crate (parity port order)
#
# Crate IDENTITY is `rustty-identity` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# R2 parity profile. When enabled, EVERY identity value flips from the rustty
# defaults to the reference ghostty values, so the differential harness produces
# byte-for-byte identical output to the reference oracle (no canonicalization
# hacks). This feature is for the parity harness ONLY — never enable it for a
# published rustty artifact. Default profile (feature off) = rustty.
identity-ghostty = []

[dependencies]
