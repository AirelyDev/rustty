# rustty-input — port crate (parity port order)
#
# Crate IDENTITY is `rustty-input` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-vt = { workspace = true }
# config's `RepeatableCommand.parseCLI` calls `cli.args.parseAutoStruct(Command, ...)`;
# the `AutoStruct` impl for `Command` lives here (orphan rule — `Command` is ours),
# so the CLI-args reflection traits/helpers (`AutoStruct`, `parse_auto_struct`,
# `parse_field_*`, `split_tagged_union`) are needed. rustty-args has NO dep on
# rustty-input, so this edge is acyclic.
rustty-args = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-util = { workspace = true }
rustty-cfg-fmt = { workspace = true }
rustty-render-types = { workspace = true }
# RemapSet's `map: AutoArrayHashMapUnmanaged(Mods, Mods)` (key_mods.rs) — the
# insertion-ordered hash map from the Zig-stdlib port (auto context = std hashing).
rustty-zigstd = { workspace = true }
# `Link.oniRegex` (link.rs) compiles the link's byte pattern into an `oni.Regex`.
# The reference imports `oniguruma` UNCONDITIONALLY in src/input/Link.zig — Link
# is core input, NOT gated behind `build_options.oniguruma`. Only the standalone
# libghostty-vt build disables oniguruma (GhosttyZig.zig sets vt_options.oniguruma
# = false), which is why the *vt* file terminal/StringMap.zig gates its regex
# surface on `build_options.oniguruma` and rustty-vt/rustty-config expose an
# off-by-default `oniguruma` feature. `src/input/` is always built with oniguruma
# present (SharedDeps.zig adds the module; Config.zig defaults `.oniguruma = true`),
# so `rustty-oniguruma` (lib name `oni`) is a NON-optional dependency here and
# `oni_regex` is always compiled (no cargo feature gate). This adds a transitive
# C-FFI edge (oniguruma-sys), so rustty-input is an FFI crate for G6 (ASan).
rustty-oniguruma = { workspace = true }
