# rustty-synthetic — port crate (parity port order)
#
# Crate IDENTITY is `rustty-synthetic` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-synthetic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-vt = { workspace = true }
rustty-os = { workspace = true }
# cli.args.parse / cli.args.argsIterator (Options parsing + argv iterator).
# rustty-args is member 15, strictly-earlier than rustty-synthetic (29) — acyclic (R4).
rustty-args = { workspace = true }

# main_gen.zig: `pub const main = synthetic.cli.main;`
[[bin]]
name = "rustty-synthetic"
path = "src/main_gen.rs"
