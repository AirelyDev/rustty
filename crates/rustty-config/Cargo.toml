# rustty-config — port crate (parity port order)
#
# Crate IDENTITY is `rustty-config` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The per-field `///` doc comments ported from ghostty `Config.zig` (R1) contain
# indented config-file examples (e.g. `language = de`, `font-family = ""`) which
# rustdoc would misinterpret as runnable Rust doc examples. These are config
# syntax, never Rust; this crate defines no intended doc examples (all tests live
# in `#[test]` blocks), so doctests are disabled rather than altering the faithful
# comment text (the same rationale as rustty-font / rustty-font-shaper).
[lib]
doctest = false

[features]
# WS14 T6 — the `impl rustty_renderer::config::RendererConfig for Config`
# accessor-trait impl (memory: renderer-config-accessor-trait-acyclic) is the ONLY
# use of the `rustty-renderer` edge in this crate, and that edge transitively pulls
# glslang / spirv-cross / wuffs / sentry C++ — impossible on
# `wasm32-unknown-unknown`, which has no libc sysroot for those build scripts to
# target. DEFAULT-ON, so every native build is byte-identical (R5); the wasm module
# builds with `--no-default-features --features wasm`.
default = ["renderer", "input-oniguruma", "freetype", "harfbuzz", "fontconfig"]
renderer = ["dep:rustty-renderer"]
# Pass-throughs for `rustty-font-shaper`'s three vendored-C font backends
# (FreeType / HarfBuzz / Fontconfig), forwarded through the `rustty-renderer` edge
# above. DEFAULT-ON, so every existing build of this crate is byte-identical (R5).
#
# They exist ONLY so an embedder can turn them off: Cargo permits one package per
# resolve graph per `links` value, the check spans the WHOLE graph regardless of
# target (a `cfg`-gated `-sys` dependency does NOT escape it), and cargo features
# UNIFY — so a crate on the path `rustty-termio` -> here -> `rustty-renderer` ->
# `rustty-font-shaper` that named the features outright would silently override
# the embedder's opt-out. The `?` in `rustty-renderer?/...` keeps these from
# activating the OPTIONAL `rustty-renderer` dependency, so the wasm module's
# `--no-default-features --features wasm` build is unaffected. Full rationale is
# in the `[features]` header of `crates/rustty-font-shaper/Cargo.toml`.
freetype = ["rustty-renderer?/freetype"]
harfbuzz = ["rustty-renderer?/harfbuzz"]
fontconfig = ["rustty-renderer?/fontconfig"]
# WS14 T6 — the second of the two edges that gate the freestanding wasm link:
# `rustty-input`'s own default-on `oniguruma` feature (its `Link::oni_regex`), which
# pulls `oniguruma-sys`. This crate's `rustty-input` dependency therefore sets
# `default-features = false` and re-enables it HERE, default-on, so every native
# build is byte-identical (R5) and only `--no-default-features` (the wasm module)
# drops it. Distinct from this crate's own `oniguruma` feature below, which gates the
# `url.zig` regex TEST and its direct `rustty-oniguruma` edge.
input-oniguruma = ["rustty-input/oniguruma"]
# The single `url.zig` test uses oniguruma. It is gated behind this off-by-default
# feature which pulls in the `oni` safe wrapper crate (`rustty-oniguruma`). The url
# regex string-assembly logic is always compiled; only its test requires this
# feature. See .port/phase-2/DEFERRALS.md (RESOLVED).
oniguruma = ["dep:rustty-oniguruma"]
# Browser/wasm `Config` C ABI (`config/Wasm.zig`). Off by default and never
# compiled in the desktop config cluster; the gate flips on with the wasm
# app-runtime (see src/wasm.rs and .port/phase-2/DEFERRALS.md).
wasm = []
# `identity-oracle` no longer compiles any `ghostty_config_*` C-ABI alias layer (that
# forwarder layer was deleted by the rebrand — rebrand Task 1); the canonical product
# exports only `rustty_config_*` (R2), always. Enabling `identity-oracle` now only
# flips the `rustty-identity` string identity this crate reads (e.g. default `TERM`,
# config subdir); apprt-c enables this feature from its own `identity-oracle` so the
# flip is consistent across the linked staticlib.
identity-oracle = ["rustty-identity/identity-oracle"]

[dependencies]
rustty-build-config = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-identity = { workspace = true }
rustty-os = { workspace = true }
# P3-W7 T3 (area-E `E15`): the captured environment accessors. Upstream's
# `config/Config.zig` calls `global.environMap()` at its `expandHome`/`home`/
# `xdg.config` call sites (`:4684`, `:5415`). rustty-global is the LEAF
# state-holder (break #1), so this edge is strictly downward (G7 stays green).
rustty-global = { workspace = true }
rustty-render-types = { workspace = true }
rustty-util = { workspace = true }
rustty-vt = { workspace = true }
rustty-zigstd = { workspace = true }
rustty-font = { workspace = true }
rustty-renderer = { workspace = true, optional = true }
# WS14 T6: declared by PATH rather than `workspace = true` — cargo IGNORES a
# member's `default-features = false` on an inherited workspace dependency (it
# warns and may become a hard error), and this is the one edge that must be able to
# turn rustty-input's default-on `oniguruma` feature OFF so `oniguruma-sys` stays
# out of a freestanding `wasm32-unknown-unknown` link. The default-on
# `input-oniguruma` feature above re-enables it for every native build (R5).
rustty-input = { path = "../rustty-input", default-features = false }
rustty-args = { workspace = true }
rustty-cfg-fmt = { workspace = true }
# The `oni` safe wrapper (lib name `oni`), pulled in only by the `oniguruma`
# feature for the url.zig `url regex` test.
rustty-oniguruma = { workspace = true, optional = true }

# Build-time codegen of the `help_strings.Config` table (R1 port of
# helpgen.genConfig): build.rs scans config_struct.rs for each field's `///` doc.
[build-dependencies]
rustty-helpgen = { workspace = true }

# Task R13-B (NEW-FINDINGS N45): this test re-executes itself with a non-UTF-8
# argv. A libtest binary cannot be started with one (libtest's own `main` calls
# `std::env::args()`), so it has its own `main`.
[[test]]
name = "load_cli_args_non_utf8_argv"
harness = false
