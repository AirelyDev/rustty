# rustty-config — port crate (parity port order)
#
# Crate IDENTITY is `rustty-config` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The per-field `///` doc comments ported from ghostty `Config.zig` (R1) contain
# indented config-file examples (e.g. `language = de`, `font-family = ""`) which
# rustdoc would misinterpret as runnable Rust doc examples. These are config
# syntax, never Rust; this crate defines no intended doc examples (all tests live
# in `#[test]` blocks), so doctests are disabled rather than altering the faithful
# comment text (the same rationale as rustty-font / rustty-font-shaper).
[lib]
doctest = false

[features]
# The single `url.zig` test uses oniguruma. It is gated behind this off-by-default
# feature which pulls in the `oni` safe wrapper crate (`rustty-oniguruma`). The url
# regex string-assembly logic is always compiled; only its test requires this
# feature. See .port/phase-2/DEFERRALS.md (RESOLVED).
oniguruma = ["dep:rustty-oniguruma"]
# Browser/wasm `Config` C ABI (`config/Wasm.zig`). Off by default and never
# compiled in the desktop config cluster; the gate flips on with the wasm
# app-runtime (see src/wasm.rs and .port/phase-2/DEFERRALS.md).
wasm = []
# Branch A `ghostty_config_*` symbol identity (PREPORT_SWIFT_APP §3). OFF by default so
# the canonical product exports only `rustty_config_*` (R2); enabling `identity-ghostty`
# compiles `src/ghostty_alias.rs`, adding a `ghostty_config_<name>` thin forwarder per
# `Config` C-ABI export. apprt-c enables this feature from its own `identity-ghostty` so
# these aliases land in the linked staticlib alongside the app-C-ABI ones.
identity-ghostty = []

[dependencies]
rustty-build-config = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-identity = { workspace = true }
rustty-os = { workspace = true }
rustty-render-types = { workspace = true }
rustty-util = { workspace = true }
rustty-vt = { workspace = true }
rustty-zigstd = { workspace = true }
rustty-font = { workspace = true }
rustty-renderer = { workspace = true }
rustty-input = { workspace = true }
rustty-args = { workspace = true }
rustty-cfg-fmt = { workspace = true }
# The `oni` safe wrapper (lib name `oni`), pulled in only by the `oniguruma`
# feature for the url.zig `url regex` test.
rustty-oniguruma = { workspace = true, optional = true }

# Build-time codegen of the `help_strings.Config` table (R1 port of
# helpgen.genConfig): build.rs scans config_struct.rs for each field's `///` doc.
[build-dependencies]
rustty-helpgen = { workspace = true }
