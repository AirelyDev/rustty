# rustty-config — port crate (parity port order)
#
# Crate IDENTITY is `rustty-config` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The single `url.zig` test uses oniguruma. oniguruma-sys is not built yet, so
# the test is gated behind this off-by-default feature (SkipZigTest-style defer;
# see .port/phase-2/DEFERRALS.md). The url regex string-assembly logic is always
# compiled; only its test requires this feature.
oniguruma = []

[dependencies]
rustty-build-config = { workspace = true }
rustty-datastruct = { workspace = true }
rustty-identity = { workspace = true }
rustty-os = { workspace = true }
rustty-render-types = { workspace = true }
rustty-util = { workspace = true }
rustty-vt = { workspace = true }
rustty-zigstd = { workspace = true }
rustty-font = { workspace = true }
rustty-renderer = { workspace = true }
rustty-input = { workspace = true }
rustty-args = { workspace = true }
rustty-cfg-fmt = { workspace = true }
