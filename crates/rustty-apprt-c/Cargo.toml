# rustty-apprt-c — port crate (parity port order)
#
# Crate IDENTITY is `rustty-apprt-c` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-apprt-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The libghostty C ABI layer (apprt/embedded): a shared lib (cdylib) and static
# lib (staticlib) for the librustty.{so,dylib,a} outputs, plus rlib so other Rust
# crates can link it. This is the rustty analogue of `src/main_c.zig` — the C API
# hub that `@export`s the `ghostty_*` symbols for `apprt.embedded`. cbindgen later
# emits include/rustty-apprt.h with `rustty_*` symbols (R2, wired in chunk E11).
#
# Mirrors the rustty-vt-c precedent exactly: the pure-Rust backend logic lives in
# `rustty-apprt` (the `embedded`/`none`/`browser` modules, unit-testable rlib);
# this thin crate holds ONLY the `#[no_mangle] extern "C"` wrappers + the CAPI-only
# extern structs + cbindgen.toml + the D2 const-asserts.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rustty-apprt = { workspace = true }
# The reference `CAPI` extern structs' conversion methods reach the terminal types
# directly (`Point.pin` -> `terminal.Screen`/`Pin`/`point.{Tag,Point,Coordinate}`/
# `size.CellCountInt`; `Selection.core` -> `terminal.Selection`/`Bounds`;
# `KeyEvent.keyEvent` -> `input.{Action,Mods}`), so apprt-c names `rustty-vt`
# directly (E5). This is a forward edge to a crate far below apprt-c in the graph
# (apprt-c stays the top sink), so `check_acyclic.sh` remains GREEN.
rustty-vt = { workspace = true }
# The app-lifecycle exports (E6) construct + drive the core App: the reference
# `app_new_` does `CoreApp.create(global.alloc)` and stores `core_app: *CoreApp`
# on the embedded `App`, and `ghostty_app_{tick,free,update_config,needs_confirm_quit,
# set_color_scheme}` call the core App methods (`tick`/`destroy`/`updateConfig`/
# `needsConfirmQuit`/`colorSchemeEvent`). `CoreApp = rustty_core::app::App<embedded::App>`.
# Forward edge (core is far below apprt-c) — apprt-c stays the top sink, `check_acyclic.sh`
# GREEN.
rustty-core = { workspace = true }
# `ghostty_app_new`/`_update_config` take `*const Config` and `ghostty_config_key_is_binding`
# takes `*Config` (the `rustty_config::Config` the config C-ABI (`rustty_config_new`) hands
# out) — named directly here.
rustty-config = { workspace = true }
# `Target`/`Action`/`ColorScheme` + the `apprt_api::App` trait (`perform_action`) the
# app-lifecycle exports drive (`ghostty_app_open_config` -> `perform_action(.app,
# .open_config)`).
rustty-apprt-api = { workspace = true }
# The E8 input exports reach two rustty-input decls the reference names as
# `input.Mods.translation` + `input.Binding.Flags.C`: `ghostty_surface_key_translation_mods`
# calls `key_mods::translation` (the `Mods.translation` method, ported as a free fn
# since it needs the apprt-layer `OptionAsAlt`), and `ghostty_surface_key_is_binding`
# writes a `binding::FlagsC` (`?*input.Binding.Flags.C`). Forward edge (far below
# apprt-c) — apprt-c stays the top sink, `check_acyclic.sh` GREEN.
rustty-input = { workspace = true }
# The process-global allocator seam (`global.alloc`): `CoreApp::create` takes an
# `allocator_api2 Global` (rustty's `std.mem.Allocator` map), matching
# `rustty_apprt::init`'s `()` alloc seam.
allocator-api2 = { workspace = true }
# Same libc the reference's C API binds (R3): the `c_int`/`c_char` types the
# `ghostty_*` (rustty `rustty_*`) exports cross the ABI with.
libc = "0.2"
# W4-2/W4-3: the blur leaf's objc msgSend(windowNumber) needs the objc2 runtime;
# the display_id leaf pushes rustty_renderer::Message::MacosDisplayId over the
# render-thread rustty_datastruct BlockingQueue with a Timeout. Forward edges to
# crates far below apprt-c (the top sink) — check_acyclic.sh stays GREEN.
objc2 = { version = "0.6" }
rustty-renderer = { workspace = true }
rustty-datastruct = { workspace = true }

[dev-dependencies]
# W4-4 macos_window_host.rs. The HEADLESS proof hands a plain-NSObject MockHostView
# layer-host double across the C-ABI (renderer golden_presents_frame_on_screen
# precedent) => it needs only objc2 (already a normal dep) + quartz-core + io-surface,
# NO app-kit and NO main-thread marker. objc2-app-kit is dev-only and consumed ONLY
# by the #[ignore] on-device visible-window test (real NSWindow). objc2-core-graphics
# supplies CGMainDisplayID. All 0.3 crates are the SAME family already resolved in-lock
# by rustty-renderer against objc2 0.6.
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGDirectDisplay"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2", "objc2-core-foundation"] }
objc2-app-kit    = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSResponder", "NSGraphics"] }
rustty-xev = { workspace = true }
