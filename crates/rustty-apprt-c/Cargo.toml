# rustty-apprt-c — port crate (parity port order)
#
# Crate IDENTITY is `rustty-apprt-c` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-apprt-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The libghostty C ABI layer (apprt/embedded): a shared lib (cdylib) and static
# lib (staticlib) for the librustty.{so,dylib,a} outputs, plus rlib so other Rust
# crates can link it. This is the rustty analogue of `src/main_c.zig` — the C API
# hub that `@export`s the `ghostty_*` symbols for `apprt.embedded`. cbindgen later
# emits include/rustty-apprt.h with `rustty_*` symbols (R2, wired in chunk E11).
#
# Mirrors the rustty-vt-c precedent exactly: the pure-Rust backend logic lives in
# `rustty-apprt` (the `embedded`/`none`/`browser` modules, unit-testable rlib);
# this thin crate holds ONLY the `#[no_mangle] extern "C"` wrappers + the CAPI-only
# extern structs + cbindgen.toml + the D2 const-asserts.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# `identity-oracle` no longer compiles any `ghostty_*` C-ABI alias layer (that
# forwarder layer was deleted by the rebrand — rebrand Task 1). The canonical product
# exports ONLY `rustty_*` (R2), always, in every profile. `identity-oracle` now flips
# ONLY the `rustty-identity` string identity (app name/version/TERM/terminfo/etc.) to
# the reference ghostty values, for the parity/differential harness — never for a
# published rustty artifact.
[features]
# Enabling apprt-c's `identity-oracle` also turns on rustty-config's + rustty-bench's
# `identity-oracle` (which themselves flip via `rustty-identity`), and flips
# `rustty-identity` directly too so the whole linked staticlib sees one consistent
# identity profile regardless of which crate in the graph first pulls it in.
identity-oracle = [
    "rustty-config/identity-oracle",
    "rustty-bench/identity-oracle",
    "rustty-identity/identity-oracle",
]
# SIMD acceleration passthrough (mirrors rustty-vt-c's `simd`): forwards to
# rustty-vt's `simd` feature so the shipped RusttyKit.xcframework can be built
# SIMD-on — matching upstream Ghostty's default-on library and consistent with
# the CMake wrapper's RUSTTY_VT_SIMD default. Off by default (rustty's default
# for a plain `cargo build`); `xtask xcframework` enables it.
simd = ["rustty-vt/simd"]

[dependencies]
# WS4 CLI-action-from-C (main_c.zig `ghostty_cli_try_action` non-null path):
# the action DETECTOR (`cli.action.detectIter`) + the concrete
# `cli.ghostty.Action` runner. rustty-cli deps rustty-core (so core can never
# name the Action type — the BREAK #1 generic stays `()` there); this TOP-SINK
# crate legitimately deps cli (no crate deps apprt-c) — acyclic (G7), the same
# ADV-FIX 2 shape as the `rustty` bin.
rustty-cli = { workspace = true }
rustty-apprt = { workspace = true }
# The `identity-oracle` feature above flips this crate's string identity directly
# (app name/version/etc.), independent of whatever rustty-config/rustty-bench do with
# their own copies of the feature. Not otherwise used by apprt-c's own logic.
rustty-identity = { workspace = true }
# The reference `CAPI` extern structs' conversion methods reach the terminal types
# directly (`Point.pin` -> `terminal.Screen`/`Pin`/`point.{Tag,Point,Coordinate}`/
# `size.CellCountInt`; `Selection.core` -> `terminal.Selection`/`Bounds`;
# `KeyEvent.keyEvent` -> `input.{Action,Mods}`), so apprt-c names `rustty-vt`
# directly (E5). This is a forward edge to a crate far below apprt-c in the graph
# (apprt-c stays the top sink), so `check_acyclic.sh` remains GREEN.
rustty-vt = { workspace = true }
# The app-lifecycle exports (E6) construct + drive the core App: the reference
# `app_new_` does `CoreApp.create(global.alloc)` and stores `core_app: *CoreApp`
# on the embedded `App`, and `ghostty_app_{tick,free,update_config,needs_confirm_quit,
# set_color_scheme}` call the core App methods (`tick`/`destroy`/`updateConfig`/
# `needsConfirmQuit`/`colorSchemeEvent`). `CoreApp = rustty_core::app::App<embedded::App>`.
# Forward edge (core is far below apprt-c) — apprt-c stays the top sink, `check_acyclic.sh`
# GREEN.
rustty-core = { workspace = true }
# `ghostty_app_new`/`_update_config` take `*const Config` and `ghostty_config_key_is_binding`
# takes `*Config` (the `rustty_config::Config` the config C-ABI (`rustty_config_new`) hands
# out) — named directly here.
rustty-config = { workspace = true }
# `Target`/`Action`/`ColorScheme` + the `apprt_api::App` trait (`perform_action`) the
# app-lifecycle exports drive (`ghostty_app_open_config` -> `perform_action(.app,
# .open_config)`).
rustty-apprt-api = { workspace = true }
# The E8 input exports reach two rustty-input decls the reference names as
# `input.Mods.translation` + `input.Binding.Flags.C`: `ghostty_surface_key_translation_mods`
# calls `key_mods::translation` (the `Mods.translation` method, ported as a free fn
# since it needs the apprt-layer `OptionAsAlt`), and `ghostty_surface_key_is_binding`
# writes a `binding::FlagsC` (`?*input.Binding.Flags.C`). Forward edge (far below
# apprt-c) — apprt-c stays the top sink, `check_acyclic.sh` GREEN.
rustty-input = { workspace = true }
# The process-global allocator seam (`global.alloc`): `CoreApp::create` takes an
# `allocator_api2 Global` (rustty's `std.mem.Allocator` map), matching
# `rustty_apprt::init`'s `()` alloc seam.
allocator-api2 = { workspace = true }
# Same libc the reference's C API binds (R3): the `c_int`/`c_char` types the
# `ghostty_*` (rustty `rustty_*`) exports cross the ABI with.
libc = "0.2"
# W4-2/W4-3: the blur leaf's objc msgSend(windowNumber) needs the objc2 runtime;
# the display_id leaf pushes rustty_renderer::Message::MacosDisplayId over the
# render-thread rustty_datastruct BlockingQueue with a Timeout. Forward edges to
# crates far below apprt-c (the top sink) — check_acyclic.sh stays GREEN.
rustty-renderer = { workspace = true }
rustty-datastruct = { workspace = true }
# `ghostty_info` reads `build_config.version_string` + `builtin.mode` (main_c.zig:131);
# rustty-build-config supplies `VERSION_STRING` + `mode_string()`. Forward edge (member 2,
# far below apprt-c the top sink) — check_acyclic.sh stays GREEN.
rustty-build-config = { workspace = true }
# WS13: `rustty_translate` forwards to the gettext `_` wrapper
# (`main_c.zig:150` -> `internal_os.i18n._`), i.e. `rustty_os::i18n::gettext_`, which
# WS9's vendored libintl (`crates-sys/gettext-sys` -> `librustty_intl.a`) makes
# linkable. Forward edge to a far-lower crate (already transitively present via
# rustty-renderer/rustty-core); apprt-c stays the top sink, so check_acyclic.sh
# stays GREEN.
rustty-os = { workspace = true }
# The benchmark C-ABI export (`ghostty_benchmark_cli` / canonical `rustty_benchmark_cli`)
# lives in rustty-bench (`benchmark/CApi.zig`). The reference `main_c.zig` force-references
# it via `comptime { _ = @import("benchmark/main.zig").CApi; }` so the export is linked into
# the C API lib; apprt-c (this hub) mirrors that with an `extern crate rustty_bench as _;`
# force-link in `lib.rs`, and enables its `identity-oracle` feature (above) for the alias.
# apprt-c is a TOP SINK (nothing depends on it), so this forward edge to member 28 keeps
# check_acyclic.sh GREEN.
rustty-bench = { workspace = true }
# `rustty_surface_quicklook_font` (P2.2) reads the surface renderer's shared font
# grid to name its primary CoreText face: `SharedGrid`/`Collection.Index`/`Style`
# (+ the coretext `Face.font: CFRetained<CTFont>`). Forward edge to a crate far
# below apprt-c (already transitively present via rustty-renderer) — apprt-c stays
# the top sink, check_acyclic.sh GREEN.
rustty-font-shaper = { workspace = true }

# macOS-only CoreText bindings for `rustty_surface_quicklook_font` (Darwin-gated,
# like the reference's `Darwin` struct export). objc2-core-text supplies `CTFont`
# + `copyWithAttributes` (`copy_with_attributes`) + `kCTFontSizeAttribute`;
# objc2-core-foundation supplies `CFRetained`/`CFNumber` (reading the `.size`
# attribute + transferring the +1 CTFontRef to the host, I16). Same objc2 0.6
# family + 0.3 framework crates rustty-font-shaper/rustty-renderer already resolve
# in-lock; feature-gated to just the tables this one export touches.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6" }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFNumber", "CFString"] }

[dev-dependencies]
rustty-xev = { workspace = true }

# W4-4 macos_window_host.rs. The HEADLESS proof hands a plain-NSObject MockHostView
# layer-host double across the C-ABI (renderer golden_presents_frame_on_screen
# precedent) => it needs only objc2 (already a normal dep) + quartz-core + io-surface,
# NO app-kit and NO main-thread marker. objc2-app-kit is dev-only and consumed ONLY
# by the #[ignore] on-device visible-window test (real NSWindow). objc2-core-graphics
# supplies CGMainDisplayID. All 0.3 crates are the SAME family already resolved in-lock
# by rustty-renderer against objc2 0.6.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGDirectDisplay"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2", "objc2-core-foundation"] }
# WS2-A quicklook regression KAT: CFRetained::from_raw to balance the +1 CTFontRef
# the quicklook_font export hands the host (I16). Same 0.3 family as the rest.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFBase"] }
objc2-app-kit    = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSResponder", "NSGraphics"] }
