# cbindgen configuration for rustty-apprt-c (R2 C ABI emission).
#
# Emits the published rustty libghostty C header (the apprt/embedded C ABI). Per
# R2 the symbols carry the `rustty_` prefix and the header is
# `include/rustty-apprt.h`. The reference's `include/ghostty.h` ABI-equivalence
# gate is DROPPED (R2); the standing gate is header self-consistency (compiles
# standalone as C AND C++) + the C compile+link smoke KAT (chunk E11) + behavioral
# parity via the `identity-ghostty` harness.
#
# Generate with (wired into `xtask header-gen` in chunk E11):
#   cbindgen --config crates/rustty-apprt-c/cbindgen.toml \
#            --crate rustty-apprt-c \
#            --output include/rustty-apprt.h
#
# NO ghostty dependency (R3): cbindgen reads only the rustty-apprt-c crate.

language = "C"
pragma_once = false
include_guard = "RUSTTY_APPRT_H"
autogen_warning = "/* Generated by cbindgen from rustty-apprt-c. DO NOT EDIT BY HAND. (R2) */"
include_version = false
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

header = """
/**
 * @file rustty-apprt.h
 *
 * librustty - libghostty embedding C API (rustty).
 *
 * Zig->Rust port of libghostty (src/apprt/embedded.zig + the src/main_c.zig
 * C API hub) at 100% functional parity. This header is generated by cbindgen
 * from the rustty-apprt-c crate; all symbols carry the `rustty_` prefix (R2).
 * Do not edit by hand.
 */
"""

# Cross-crate C-ABI types. The `ghostty_*` (rustty `rustty_*`) signatures
# reference a set of `#[repr(C)]` types DEFINED in the sibling `rustty-apprt`
# backend (`embedded::Options` = `ghostty_runtime_config_s`, the `Platform.C`
# union, `EnvVar`, `KeyEvent`, `SurfaceSize`, `ClipboardContent`, `Text`,
# `Point`/`PointC`, `Selection`) plus the apprt-api `TargetC`/`ActionC`/
# `ClipboardRequest`/`Clipboard`/`NewSurfaceContext`. With `parse_deps = false`
# cbindgen does not reach those crates, so — exactly as rustty-vt-c does — those
# layouts are hand-pinned here in `after_includes`, each mirroring its Rust
# `#[repr(C)]` definition byte-for-byte, so the header is self-consistent.
#
# CHUNK E0 (scaffold): the only export so far is `rustty_init` (the global-state
# precursor, all-scalar signature), so no cross-crate C-ABI type is referenced
# yet — `after_includes` is empty. The Options/Platform/KeyEvent/… pins land as
# chunks E1..E10 add the extern structs and E11 wires header generation.
after_includes = """
"""

[parse]
# cbindgen reads ONLY the rustty-apprt-c crate (R3). The cross-crate C-ABI types
# it would otherwise need to chase into `rustty-apprt`/`rustty-apprt-api` are
# instead pinned by hand in `after_includes` above (their exact `#[repr(C)]`
# layouts). We deliberately keep `parse_deps = false` (rustty-vt-c precedent):
# re-parsing the sibling crates is slow AND non-deterministic about which dep
# types it re-emits — the hand-pinned layouts are both fast and exact.
parse_deps = false

[export]
# Only items annotated for export (the `#[no_mangle] extern "C"` surface) are
# emitted. Symbols are already authored with the `rustty_` prefix in the crate,
# so no rename prefix is applied here (keeping symbol names verbatim).
prefix = ""

# Cross-crate types pinned by hand in `after_includes` are excluded here so
# cbindgen does not emit its own (incomplete / self-referential) versions.
# (Populated as the extern structs land in chunks E1..E10.)
exclude = []

[export.rename]
# (reserved) per-type renames land as the ABI is ported.

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"

[defines]
# (reserved) feature-gated declarations land as the ABI is ported.
