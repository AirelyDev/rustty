/* ---- apprt.ClipboardRequestType (#[repr(u8)]) ----
 * repr(u8): a C `enum` defaults to `int` width, so this is pinned as `uint8_t`
 * to stay size-faithful (values: paste=0, osc52_read=1, osc52_write=2). */
typedef uint8_t ClipboardRequestType;

/* ---- apprt.Target.C (apprt-api TargetC, #[repr(C)]; size 16, align 8) ---- */
typedef enum {
    RUSTTY_TARGET_KEY_APP = 0,
    RUSTTY_TARGET_KEY_SURFACE = 1,
} TargetKey;
typedef union {
    /* app arm is zero-sized (`()`); only `surface` occupies the union. */
    void *surface;
} TargetCValue;
typedef struct {
    TargetKey key;
    TargetCValue value;
} TargetC;

/* ---- apprt.Action.C (apprt-api ActionC, #[repr(C)]; size 32, align 8) ----
 * ActionKey is a large `#[repr(i32)]` enum and ActionCValue a 24-byte union;
 * apprt-api's BYTE-EXACT C-ABI projection of the value union is a DOCUMENTED
 * deferral (apprt-api action.rs "C-ABI PROJECTION (deferred pinning)"), so the
 * value is pinned size/align-faithful here (the smoke KAT never invokes the
 * `action` callback that would read it). ActionKey is pinned c_int-wide. */
typedef int32_t ActionKey;
typedef struct {
    uint64_t _opaque[3]; /* 24 bytes, align 8 */
} ActionCValue;
typedef struct {
    ActionKey key;
    ActionCValue value;
} ActionC;

/* ---- embedded.ClipboardContent (ghostty_clipboard_content_s, #[repr(C)]) ---- */
typedef struct {
    const char *mime;
    const char *data;
} ClipboardContent;

/* ---- embedded.EnvVar (#[repr(C)]) ---- */
typedef struct {
    const char *key;
    const char *value;
} EnvVar;

/* ---- Platform.C (embedded.PlatformC union; size == one pointer) ---- */
typedef struct { void *nsview; } PlatformCMacOS;
typedef struct { void *uiview; } PlatformCIOS;
typedef union {
    PlatformCMacOS macos;
    PlatformCIOS ios;
} PlatformC;

/* ---- Options (ghostty_runtime_config_s, embedded.Options, #[repr(C)]; size 64) ----
 * The 7 host callbacks (ADV-FIX 7: THIS typedef set + the smoke KAT's typed stubs
 * are the fn-ptr-ABI backstop). `close_surface` is nullable (reference `?*const fn`). */
typedef struct {
    void *userdata;
    bool supports_selection_clipboard;
    void (*wakeup)(void *userdata);
    bool (*action)(App *app, TargetC target, ActionC action);
    bool (*read_clipboard)(void *userdata, int req_type, ClipboardRequest *state);
    void (*confirm_read_clipboard)(void *userdata,
                                   const char *str,
                                   ClipboardRequest *state,
                                   ClipboardRequestType req_type);
    void (*write_clipboard)(void *userdata,
                            int req_type,
                            const ClipboardContent *contents,
                            uintptr_t len,
                            bool confirmed);
    void (*close_surface)(void *userdata, bool process_alive);
} Options;

/* ---- SurfaceOptions (ghostty_surface_config_s, embedded.SurfaceOptions, #[repr(C)]; size 88) ---- */
typedef struct {
    int platform_tag;
    PlatformC platform;
    void *userdata;
    double scale_factor;
    float font_size;
    const char *working_directory;
    const char *command;
    const EnvVar *env_vars;
    uintptr_t env_var_count;
    const char *initial_input;
    bool wait_after_command;
    NewSurfaceContext context;
} SurfaceOptions;
"""

[parse]
# cbindgen reads ONLY the rustty-apprt-c crate (R3). The cross-crate C-ABI types
# it would otherwise need to chase into `rustty-apprt`/`rustty-apprt-api` are
# instead pinned by hand in `after_includes` above (their exact `#[repr(C)]`
# layouts). We deliberately keep `parse_deps = false` (rustty-vt-c precedent):
# re-parsing the sibling crates is slow AND non-deterministic about which dep
# types it re-emits — the hand-pinned layouts are both fast and exact.
parse_deps = false

[export]
# Only items annotated for export (the `#[no_mangle] extern "C"` surface) are
# emitted. Symbols are already authored with the `rustty_` prefix in the crate,
# so no rename prefix is applied here (keeping symbol names verbatim).
prefix = ""

# Cross-crate types pinned by hand in `after_includes` are excluded here so
# cbindgen does not emit its own (incomplete / self-referential) versions.
# (Populated as the extern structs land in chunks E1..E10.)
exclude = []

[export.rename]
# (reserved) per-type renames land as the ABI is ported.

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"

[defines]
# (reserved) feature-gated declarations land as the ABI is ported.
