# cbindgen configuration for rustty-apprt-c (R2 C ABI emission).
#
# Emits the published rustty libghostty C header (the apprt/embedded C ABI). Per
# R2 the symbols carry the `rustty_` prefix and the header is
# `include/rustty-apprt.h`. The reference's `include/ghostty.h` ABI-equivalence
# gate is DROPPED (R2); the standing gate is header self-consistency (compiles
# standalone as C AND C++) + the C compile+link smoke KAT (chunk E11) + behavioral
# parity via the `identity-ghostty` harness.
#
# Generate with (wired into `xtask header-gen` in chunk E11):
#   cbindgen --config crates/rustty-apprt-c/cbindgen.toml \
#            --crate rustty-apprt-c \
#            --output include/rustty-apprt.h
#
# NO ghostty dependency (R3): cbindgen reads only the rustty-apprt-c crate.

language = "C"
pragma_once = false
include_guard = "RUSTTY_APPRT_H"
autogen_warning = "/* Generated by cbindgen from rustty-apprt-c. DO NOT EDIT BY HAND. (R2) */"
include_version = false
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

header = """
/**
 * @file rustty-apprt.h
 *
 * librustty - libghostty embedding C API (rustty).
 *
 * Zig->Rust port of libghostty (src/apprt/embedded.zig + the src/main_c.zig
 * C API hub) at 100% functional parity. This header is generated by cbindgen
 * from the rustty-apprt-c crate; all symbols carry the `rustty_` prefix (R2).
 * Do not edit by hand.
 */
"""

# Cross-crate C-ABI types (E11 header generation). The `rustty_*` signatures
# reference a set of `#[repr(C)]` / handle types DEFINED in sibling crates that
# cbindgen — with `parse_deps = false` (see `[parse]`) — cannot reach, so it emits
# only their bare names. Exactly as `rustty-vt-c` does, their C layouts are pinned
# BY HAND here, each mirroring its Rust definition byte-for-byte, so the header is
# self-consistent (compiles standalone as C AND C++). This stays within R3: these
# are rustty's OWN types, transcribed by hand; cbindgen never reads a sibling crate
# and the ghostty tree is not a dependency at all.
#
# The pinned SIZES are gated on the Rust side by the E5/E11 D2 const-asserts
# (`crates/rustty-apprt-c/src/capi.rs`): `Options`==64, `SurfaceOptions`==88,
# `EnvVar`==16, `ClipboardContent`==16, `PlatformC`==8, `TargetC`==16, `ActionC`==32,
# and the `key::Action`/`key::Key`/mouse/split enums are c_int-width — so any layout
# drift fails the build before it can desync this header (ADV-FIX 7 fn-ptr backstop:
# the callback typedefs below + the smoke KAT's typed stubs, not `size_of`).
#
# NOTE cbindgen also emits the apprt-c-LOCAL structs (`KeyEvent`/`String`/`Text`/
# `Point`/`Selection`/`SurfaceSize` + `PointTag`/`PointCoordTag`) after this block;
# `KeyEvent` uses `Action` (below), so this block MUST precede them (it does —
# `after_includes` is emitted right after the `#include`s, before generated types).
after_includes = """

/* ---- Opaque handles (crossed only behind pointers) ---- */
/* rustty_apprt::embedded::App — the runtime app handle. */
typedef struct App App;
/* rustty_apprt::embedded::Surface — the heap-pinned surface handle (ADV-FIX 8). */
typedef struct Surface Surface;
/* rustty_apprt::embedded::Inspector — the dcimgui inspector handle. */
typedef struct Inspector Inspector;
/* rustty_config::Config — the config handle built by the config C-ABI. */
typedef struct Config Config;
/* rustty_apprt_api::ClipboardRequest — the boxed clipboard request handle. */
typedef struct ClipboardRequest ClipboardRequest;
/* rustty_input::binding::FlagsC — the `input.Binding.Flags.C` out-param. */
typedef struct FlagsC FlagsC;

/* ---- input.Action (rustty_vt key::Action, #[repr(C)] -> c_int) ---- */
typedef enum {
    RUSTTY_INPUT_ACTION_RELEASE = 0,
    RUSTTY_INPUT_ACTION_PRESS = 1,
    RUSTTY_INPUT_ACTION_REPEAT = 2,
} Action;

