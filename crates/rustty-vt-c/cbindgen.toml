# cbindgen configuration for rustty-vt-c (R2 C ABI emission).
#
# Emits the published rustty C header. Per R2 the symbols carry the `rustty_`
# prefix and the header is `include/rustty.h` (with the `rustty/vt/*` family
# carved out as the ABI is ported). The reference's `include/ghostty.h` ABI-
# equivalence gate is DROPPED (R2); the standing gate is header
# self-consistency + behavioral parity via the `identity-ghostty` harness.
#
# Generate with:
#   cbindgen --config crates/rustty-vt-c/cbindgen.toml \
#            --crate rustty-vt-c \
#            --output include/rustty.h
# or via `cargo run -p xtask -- header-gen` (which invokes cbindgen).
#
# NO ghostty dependency (R3): cbindgen reads only the rustty-vt-c crate.

language = "C"
pragma_once = false
include_guard = "RUSTTY_H"
autogen_warning = "/* Generated by cbindgen from rustty-vt-c. DO NOT EDIT BY HAND. (R2) */"
include_version = false
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

header = """
/**
 * @file rustty.h
 *
 * librustty-vt - Virtual terminal emulator library (rustty).
 *
 * Zig->Rust port of libghostty-vt at 100% functional parity. This header is
 * generated by cbindgen from the rustty-vt-c crate; all symbols carry the
 * `rustty_` prefix (R2). Do not edit by hand.
 */
"""

[parse]
parse_deps = false

[export]
# Only items annotated for export (the `#[no_mangle] extern "C"` surface) are
# emitted. Symbols are already authored with the `rustty_` prefix in the crate,
# so no rename prefix is applied here (keeping symbol names verbatim).
prefix = ""

[export.rename]
# (reserved) per-type renames land as the ABI is ported.

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"

[defines]
# (reserved) feature-gated declarations land as the ABI is ported.
