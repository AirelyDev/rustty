# rustty-vt-c — port crate (parity port order)
#
# Crate IDENTITY is `rustty-vt-c` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-vt-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The C ABI layer: a shared lib (cdylib) and static lib (staticlib) for the
# librustty-vt.{so,dylib,a} outputs, plus rlib so other Rust crates can link it.
# cbindgen later emits include/rustty.h + rustty/vt/* with rustty_* symbols (R2).
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Parity-harness identity profile (R2). Forwards to `rustty-vt`'s feature of
# the same name (which forwards to `rustty-identity`), flipping the vt LIBRARY
# version reported by `build_info.rs` to the reference's separate libghostty
# version (`build.zig:10` `lib_version = "0.1.0-dev"`), so the G4
# c-vt-build-info golden matches byte-for-byte. Harness only — never enable
# for a published rustty artifact.
identity-oracle = ["rustty-vt/identity-oracle"]
# Expose rustty-vt's SIMD build knob at the C-ABI level so the oracle-parity
# build (c-vt examples vs ghostty's default simd=true) can enable it.
simd = ["rustty-vt/simd"]

[dependencies]
rustty-vt = { workspace = true }
# R4: rustty-unicode is a leaf below rustty-vt (acyclic). Needed for the
# unicode codepoint/grapheme width C exports (BL-5 fc5a72772 + 65e61282a).
rustty-unicode = { workspace = true }
rustty-lib = { workspace = true }
rustty-render-types = { workspace = true }
allocator-api2 = { workspace = true }
