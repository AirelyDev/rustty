# rustty-vt-c — port crate (parity port order)
#
# Crate IDENTITY is `rustty-vt-c` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-vt-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The C ABI layer: a shared lib (cdylib) and static lib (staticlib) for the
# librustty-vt.{so,dylib,a} outputs, plus rlib so other Rust crates can link it.
# cbindgen later emits include/rustty.h + rustty/vt/* with rustty_* symbols (R2).
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# `-Dsimd` defaults to TRUE for every non-WASM target
# (`ghostty/src/build/Config.zig:196-206`), and `GhosttyZig.zig` force-disables
# only `oniguruma` for the lib-vt module (:67-72) while still adding the SIMD
# deps when `cfg.simd` (:140-143) — so the reference's DEFAULT libghostty-vt
# runs `stream.zig`'s SIMD `nextSlice` fast path and reports `.simd = true`
# through the build-info C ABI. A default `cargo build -p rustty-vt-c` matches.
# (The default is TARGET-CONDITIONAL though: Config.zig:200-206 breaks
# `simd = false` for wasm because the reference "can't build our SIMD
# dependencies for Wasm", which is why ghostty ships `ghostty-vt.wasm` built
# simd=false. Cargo cannot express a per-target `default`, so that arm of the
# `orelse` is resolved in `rustty-vt`'s `options::SIMD` instead — see
# `crates/rustty-vt/src/options.rs` — and a wasm build of THIS crate resolves the
# option off even though `default` names `simd`. Verified: `cargo build
# -p rustty-vt-c --target wasm32-unknown-unknown --release`.)
default = ["simd", "vt-features-default"]
# The `-Dvt-features` default set: every feature enabled (`Features{}`).
# See the block below and `crates/rustty-vt/Cargo.toml`.
#
# Named as an AGGREGATE rather than spelled into `default` so that "all VT
# features, SIMD off" is expressible without restating the ten. That
# combination is not hypothetical: CMakeLists.txt's `RUSTTY_VT_SIMD=OFF` path
# is exactly it, and example/c-vt-cmake-static sets that option. When the nine
# were inline in `default`, that path passed a bare `--no-default-features` and
# silently dropped the whole C API surface — the example failed to link on
# `_rustty_formatter_terminal_new` and friends.
vt-features-default = [
    "snapshot",
    "formatter",
    "selection",
    "search",
    "render-state",
    "input-encode",
    "color",
    "grid-introspection",
    "glyph-protocol",
    "kitty-graphics",
]
# Parity-harness identity profile (R2). Forwards to `rustty-vt`'s feature of
# the same name (which forwards to `rustty-identity`), flipping the vt LIBRARY
# version reported by `build_info.rs` to the reference's separate libghostty
# version (`build.zig:10` `lib_version = "0.1.0-dev"`), so the G4
# c-vt-build-info golden matches byte-for-byte. Harness only — never enable
# for a published rustty artifact.
identity-oracle = ["rustty-vt/identity-oracle"]
# rustty-vt's SIMD build knob, exposed at the C-ABI level (the `-Dsimd` analog).
# ON by default (see `default` above, matching ghostty's non-WASM default); the
# c-vt examples still name it explicitly, and `--no-default-features` is the
# `-Dsimd=false` analog.
simd = ["rustty-vt/simd"]
# ---------------------------------------------------------------------------
# `-Dvt-features` at the C-ABI level. Each forwards to `rustty-vt`'s feature of
# the same name (which drives the matching `options::*` const) AND decides
# whether this crate compiles the corresponding `#[no_mangle]` exports at all —
# the port of `lib_vt.zig`'s `if (features.X) { @export(...); ... }` blocks,
# symbol for symbol. Disabling a feature therefore removes its C API surface
# from the artifact, which is the whole point: "size-conscious embedders (e.g.
# wasm) can trim the binary".
#
# All ten are in `default`, so a plain `cargo build -p rustty-vt-c` is the
# reference's default all-enabled lib. The reference's
# `-Dvt-features=-all,+render-state` (its "read-only viewer subset" example) is:
#
#     cargo build -p rustty-vt-c --no-default-features --features simd,render-state
#
# NOTE `--no-default-features` also drops `simd`, which is a SEPARATE knob
# (`-Dsimd`), so a trimmed build that still wants the SIMD stream fast path must
# name it explicitly, as above.
snapshot = ["rustty-vt/snapshot"]
formatter = ["rustty-vt/formatter"]
selection = ["rustty-vt/selection"]
search = ["rustty-vt/search"]
render-state = ["rustty-vt/render-state"]
input-encode = ["rustty-vt/input-encode"]
color = ["rustty-vt/color"]
grid-introspection = ["rustty-vt/grid-introspection"]
glyph-protocol = ["rustty-vt/glyph-protocol"]
kitty-graphics = ["rustty-vt/kitty-graphics"]
# ---------------------------------------------------------------------------

[dependencies]
# `default-features = false`: the ten `-Dvt-features` gates are re-declared as
# this crate's own features (above) and forwarded explicitly, so a trimmed
# `--no-default-features` build of THIS crate actually reaches `rustty-vt`
# instead of being re-enabled by the dependency's defaults.
#
# NOTE this is the ONE crate that spells the dependency by path instead of
# `{ workspace = true }`. Cargo IGNORES a member's `default-features = false`
# when the `[workspace.dependencies]` entry does not itself specify
# `default-features` (it warns, and says it may become a hard error) — inherited
# dependencies can only ADD features, never subtract. Setting
# `default-features = false` on the workspace entry instead would silently strip
# the ten features from all 15 crates that inherit it, which is the opposite of
# the intent: every application-tier consumer must keep the reference's
# all-enabled default. A direct path dep here is the narrow, local escape, and
# it is the only crate that ever needs a trimmed build.
rustty-vt = { path = "../rustty-vt", default-features = false }
# R4: rustty-unicode is a leaf below rustty-vt (acyclic). Needed for the
# unicode codepoint/grapheme width C exports (BL-5 fc5a72772 + 65e61282a).
rustty-unicode = { workspace = true }
rustty-lib = { workspace = true }
rustty-render-types = { workspace = true }
# `terminal/c/sys.zig` imports `os/stderr.zig` for `logStderr`'s raw write
# (parity S178-F2). rustty-vt already depends on rustty-os, so this adds no
# crate to the graph.
rustty-os = { workspace = true }
allocator-api2 = { workspace = true }
# The `log` facade backend (task-14a/DECISION-logging.md §"the wiring
# pattern"): rustty-vt-c installs a `log::Log` impl (`sys::Logger`) that
# forwards every restored `log::warn!`/etc. call site — in this crate AND, once
# 14b-14e restore them, in `rustty-vt`/`rustty-font-shaper`/`rustty-renderer`/
# etc. — into the existing `sys::log_fn` C-ABI sink. This crate's OWN internal
# sites (mouse_encode.rs/osc.rs/sgr.rs/key_encode.rs) call `sys::log_fn`
# directly (the established pattern already used by render.rs/lib.rs/
# terminal.rs/selection.rs/selection_gesture.rs/search.rs) and do not need the
# macro layer — this dependency exists to BACK the facade for crates below
# this one, which cannot reach `sys::log_fn` directly without a layering cycle.
log = { workspace = true }

# Wasm-only: the `os/wasm/log.zig` sink that `lib_vt.zig`'s `std_options`
# installs for wasm Debug builds (`d61920d80`; see `sys::log_fn`). rustty-os is
# already below rustty-vt (R4 acyclic) and builds on wasm32.
#
# task-14wasm: `log`'s `release_max_level_off` feature is the actual analog of
# the oracle's comptime `options.log_level = .err` wasm guard
# (`lib_vt.zig:447-455`) — it sets the facade's `STATIC_MAX_LEVEL` const to
# `Off` for `!debug_assertions` builds (`log-0.4.33/src/lib.rs:1637-1643`),
# which makes every `log::warn!`/etc. call site's `if lvl <= STATIC_MAX_LEVEL
# && ...` check foldable to `if false { .. }` AT COMPILE TIME — the compiler
# then has license to strip the format-string/`Debug`-impl/`Record`-
# construction code the call site brings in, matching Zig's comptime erasure.
# This is NOT what `sys::install_log_backend`'s `set_max_level(Off)` runtime
# cap does (see its own corrected PORT NOTE and DECISION-logging.md §6-CORR):
# that is an `AtomicUsize` load checked at call time, so the surrounding
# machinery is still compiled in and only the call is skipped — it cannot,
# by itself, keep the restored strings out of a release wasm binary.
#
# Declared here, target-gated to `wasm32`, rather than in
# `[workspace.dependencies]` or unconditionally on the `log = { workspace =
# true }` line above: `release_max_level_off` is a global, crate-wide switch
# on the ONE `log` crate compilation every crate in the dependency graph
# shares (feature unification), so enabling it unconditionally would also
# silence `rustty-core::logging::AppLogger`'s native `rustty` app-binary sink
# under any `!debug_assertions` build — exactly the outcome task-14wasm rules
# out. Gating it on this crate's own `[target.'cfg(target_arch =
# "wasm32")'.dependencies]` table means the feature is only ever activated
# when the compilation's target is `wasm32-unknown-unknown` — the native app
# binary compiles for `x86_64`/`aarch64` and never sees this table at all, so
# its own release build keeps logging live. Feature unification then carries
# the effect to every OTHER crate's `log` call sites compiled into the SAME
# wasm artifact (`rustty-vt`, and whichever of `rustty-font-shaper`/
# `rustty-renderer`/etc. 14c-14e restore into crates reachable from a wasm
# build) for free — one declaration, one artifact class, no per-crate repeat
# needed as later stages add sites.
[target.'cfg(target_arch = "wasm32")'.dependencies]
log = { workspace = true, features = ["release_max_level_off"] }

[dev-dependencies]
# Test-only: the `rustty_util::tripwire` reset mode used by the
# `get vt_processing_error` C-API test (rustty-vt's `set_string_tw_end`
# accessor names it). rustty-util is a leaf below rustty-vt (R4 acyclic).
rustty-util = { workspace = true }
# TEST-ONLY (parity S166-F2): turn on rustty-vt's `tripwire-test` feature so the
# `set_title` fail point that `get vt_processing_error` arms EXISTS in the
# release test lane too. As a dev-dependency it unifies only into
# test/bench/example builds, so `cargo build --release` still compiles the fail
# point away.
rustty-vt = { path = "../rustty-vt", features = ["tripwire-test"] }
