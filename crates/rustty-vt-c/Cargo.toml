# rustty-vt-c — port crate (parity port order)
#
# Crate IDENTITY is `rustty-vt-c` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-vt-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The C ABI layer: a shared lib (cdylib) and static lib (staticlib) for the
# librustty-vt.{so,dylib,a} outputs, plus rlib so other Rust crates can link it.
# cbindgen later emits include/rustty.h + rustty/vt/* with rustty_* symbols (R2).
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# `-Dsimd` defaults to TRUE for every non-WASM target
# (`ghostty/src/build/Config.zig:196-206`), and `GhosttyZig.zig` force-disables
# only `oniguruma` for the lib-vt module (:67-72) while still adding the SIMD
# deps when `cfg.simd` (:140-143) — so the reference's DEFAULT libghostty-vt
# runs `stream.zig`'s SIMD `nextSlice` fast path and reports `.simd = true`
# through the build-info C ABI. A default `cargo build -p rustty-vt-c` matches.
# (The default is TARGET-CONDITIONAL though: Config.zig:200-206 breaks
# `simd = false` for wasm because the reference "can't build our SIMD
# dependencies for Wasm", which is why ghostty ships `ghostty-vt.wasm` built
# simd=false. Cargo cannot express a per-target `default`, so that arm of the
# `orelse` is resolved in `rustty-vt`'s `options::SIMD` instead — see
# `crates/rustty-vt/src/options.rs` — and a wasm build of THIS crate resolves the
# option off even though `default = ["simd"]` is active. Verified: `cargo build
# -p rustty-vt-c --target wasm32-unknown-unknown --release`.)
default = ["simd"]
# Parity-harness identity profile (R2). Forwards to `rustty-vt`'s feature of
# the same name (which forwards to `rustty-identity`), flipping the vt LIBRARY
# version reported by `build_info.rs` to the reference's separate libghostty
# version (`build.zig:10` `lib_version = "0.1.0-dev"`), so the G4
# c-vt-build-info golden matches byte-for-byte. Harness only — never enable
# for a published rustty artifact.
identity-oracle = ["rustty-vt/identity-oracle"]
# rustty-vt's SIMD build knob, exposed at the C-ABI level (the `-Dsimd` analog).
# ON by default (see `default` above, matching ghostty's non-WASM default); the
# c-vt examples still name it explicitly, and `--no-default-features` is the
# `-Dsimd=false` analog.
simd = ["rustty-vt/simd"]

[dependencies]
rustty-vt = { workspace = true }
# R4: rustty-unicode is a leaf below rustty-vt (acyclic). Needed for the
# unicode codepoint/grapheme width C exports (BL-5 fc5a72772 + 65e61282a).
rustty-unicode = { workspace = true }
rustty-lib = { workspace = true }
rustty-render-types = { workspace = true }
allocator-api2 = { workspace = true }

# Wasm-only: the `os/wasm/log.zig` sink that `lib_vt.zig`'s `std_options`
# installs for wasm Debug builds (`d61920d80`; see `sys::log_fn`). rustty-os is
# already below rustty-vt (R4 acyclic) and builds on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustty-os = { workspace = true }

[dev-dependencies]
# Test-only: the `rustty_util::tripwire` reset mode used by the
# `get vt_processing_error` C-API test (rustty-vt's `set_string_tw_end`
# accessor names it). rustty-util is a leaf below rustty-vt (R4 acyclic).
rustty-util = { workspace = true }
