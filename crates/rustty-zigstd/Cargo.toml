# rustty-zigstd — Zig stdlib equivalents (ADDITIVE INFRASTRUCTURE GLUE, R1).
#
# Crate IDENTITY is `rustty-zigstd` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
#
# This crate ports ZIG STDLIB types (std.heap.ArenaAllocator, std.heap.MemoryPool /
# MemoryPoolAligned, std.array_hash_map.AutoArrayHashMap, std.Thread.Mutex) AS
# THE PORT USES THEM.
# These types are NOT in ghostty src/, so they are NOT in the 3234-test contract and
# this crate is intentionally absent from the test-contract crate_map. It is
# necessary glue (R1 allows necessary additions) and is faithful to the EXACT
# observable semantics of the Zig stdlib types (arena reset modes; memory-pool
# LIFO free-list reuse; insertion-order hash map; guard-less manual-unlock
# mutex). Backing memory is the Rust
# system allocator (std::alloc) — the faithful map of Zig's gpa/page_allocator.
#
# unsafe-heavy: the leak/UB gate is Miri (R6) — `check_leaks.sh --crate rustty-zigstd`.
[package]
name = "rustty-zigstd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# TEST-ONLY: expose `tracking_allocator::TrackingAllocator` (the scoped faithful
# equivalent of Zig's `std.testing.allocator`) to downstream test builds — e.g.
# rustty-vt enables it as a dev-dependency feature to leak-check the PageList page
# pool natively where Miri times out (R6). OFF by default; never in production.
tracking = []

[dependencies]
rustty-util.workspace = true
# Faithful Rust map of Zig's `std.mem.Allocator` (the child allocator threaded
# through `ArenaAllocator`). `Global` reproduces the prior `std::alloc` path.
allocator-api2.workspace = true
# The index of `array_hash_map::AutoArrayHashMapUnmanaged` over the map's
# allocator (the `allocator-api2` feature makes `HashMap<K, V, S, A>` take an
# allocator_api2 `Allocator`). No default features: the map supplies std's
# `RandomState`, as it did with `std::collections::HashMap`. Declared once in
# the workspace.
hashbrown = { workspace = true }
