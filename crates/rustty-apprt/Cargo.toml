# rustty-apprt — port crate (parity port order)
#
# Crate IDENTITY is `rustty-apprt` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-apprt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rustty-core = { workspace = true }
rustty-apprt-api = { workspace = true }
rustty-vt = { workspace = true }
rustty-font = { workspace = true }
rustty-renderer = { workspace = true }
rustty-inspector = { workspace = true }
# The inspector's ImGui context lifecycle (`apprt.embedded.Inspector`
# init/deinit — ImGui_CreateContext/DestroyContext, SetCurrentContext, GetIO,
# ImGui_ImplMetal_Shutdown). Vendored Dear ImGui + Dear Bindings C API leaf
# (`links = "dcimgui"`); a lower-tier -sys crate (acyclic).
dcimgui-sys = { workspace = true }
rustty-config = { workspace = true }
rustty-input = { workspace = true }
rustty-os = { workspace = true }
# `zig_string_escape` (the rustty port of `std.zig.stringEscape`) — used by
# `embedded::Surface::init` to escape `initial_input` for the config `raw` field
# (embedded.zig:561). Reused, not reimplemented (R3/R5). Acyclic: rustty-args deps
# only {os, util, build-config}, none of which reach apprt.
rustty-args = { workspace = true }
# allocator-api2 Allocator trait (the workspace's `std.mem.Allocator` map): the
# `none::App::perform_ipc` static fn takes a passed-in allocator (reference
# none.zig `performIpc(_: Allocator, ...)`), matching `rustty_apprt_api::ipc`.
allocator-api2 = { workspace = true }
# `rustty_xev::Async` — `Inspector::render`'s wakeup-handle parameter (the R4
# acyclic Surface seam's `&rustty_xev::Async` leaf standing in for the whole
# core-local `renderer_thread: Thread<A>`; INV-12). Already a transitive dep via
# rustty-core; named directly here so `embedded::Inspector::renderMetal` can
# reach `core_surface.renderer_thread.wakeup` by its real type.
rustty-xev = { workspace = true }

# objc2/Metal msgSends (renderMetal's MTLRenderCommandEncoder construction, the
# device/command_buffer/desc release balances) are Darwin-only, exactly like
# rustty-renderer/rustty-apprt-c/rustty-os's own objc2 deps below.
[target.'cfg(target_os = "macos")'.dependencies]
# objc2: the ObjC runtime (`msg_send!`), pinned to the same 0.6 the rest of the
# workspace uses (rustty-renderer/rustty-apprt-c/rustty-os). `renderMetal`'s
# `MTLRenderCommandEncoder` construction (`renderCommandEncoderWithDescriptor:`
# + `endEncoding`) and the `device`/`command_buffer`/`desc` release msgSends
# operate on OPAQUE ids crossing the C ABI (never a compile-time Metal type),
# exactly mirroring the reference's untyped `objc.Object.fromId(...).msgSend(...)`
# — the same raw-`AnyObject` + `msg_send!` idiom already used by the
# `rustty_set_window_background_blur` blur leaf (rustty-apprt-c/src/lib.rs), so
# no objc2-metal/objc2-foundation typed bindings are needed for this leaf.
objc2 = { version = "0.6" }
