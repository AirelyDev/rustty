# rustty-apprt — port crate (parity port order)
#
# Crate IDENTITY is `rustty-apprt` (R4). This is NOT the published artifact name; the
# library/binary artifacts are renamed to the `rustty` product identity later (R2).
# NO dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-apprt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `-Dsimd` (N420), default-on as the reference's is: threaded to `rustty-core`,
# whose workspace edge sets `default-features = false` so it can be turned off.
# See `crates/rustty-core/Cargo.toml`.
default = ["simd"]
simd = ["rustty-core/simd"]

# The NATIVE GTK4/libadwaita apprt backend (`src/gtk.rs`, port of
# `src/apprt/gtk/**`). OFF by default (R5): the macOS/embedded build never
# enables it, so it stays byte-behavior-identical. The module itself is gated
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "gtk"))]`
# (lib.rs), and every dep below is ALSO
# `cfg(any(target_os = "linux", target_os = "freebsd"))`-tabled — so `--features
# gtk` on a host that is neither resolves to a no-op rather than a broken dep
# graph.
#
# `Runtime::Gtk` (rustty-build-config) is already `default_for` BOTH Linux and
# FreeBSD (`apprt.rs:26-36`, the port of `apprt/runtime.zig:14-24`
# `.linux, .freebsd => .gtk`); the `rustty` bin turns this on via a matching
# target-gated `features = ["gtk"]` edge (L5.5). W2D/F-002 widened the OS half of
# every gate here from `linux` to `any(linux, freebsd)`: the reference puts NO
# os.tag guard on the gtk apprt, and gtk4-rs finds its libraries via pkg-config
# (FreeBSD ports ships gtk4/libadwaita/gtk4-layer-shell/wayland/x11).
# `rustty-vt/imgui` turns on `Key::imgui_key` (the Key->cimgui-constant mapping)
# so the gtk inspector's ImGui key routing has the real mapping — it is an
# apprt-layer GUI-glue dependency (R3) that only the gtk backend needs.
gtk = ["dep:glib", "dep:gio", "dep:gdk4", "dep:gtk4", "dep:libadwaita", "rustty-vt/imgui"]
# TEST-ONLY (P7-W7 T2): exposes `render_surface::FORCE_DMABUF_IMPORT_FAILURE`, which
# makes GDK reject the renderer's DMA-BUFs so the live KAT
# `render_surface_falls_back_to_cpu_when_dmabuf_import_fails` can drive the
# `DmabufBuildFailed` → unhealthy → CPU-readback fallback end to end. GTK >= 4.14
# imports a linear DMA-BUF on every backend (broadway by CPU download), so without
# it the fallback is unreachable on the hosts we test on. The `rustty-core`
# `init-fault-inject` precedent: never enabled by a product build.
render-surface-fault-inject = ["gtk"]
# The reference's `-Dsentry` build option, forwarded to `rustty-crash` — where it
# is BOTH `build_options::SENTRY` and the `SharedDeps.zig:407` link gate for
# sentry-native + breakpad (see that crate's `[features]` header).
#
# OFF by default, and that is the per-target default doing its job rather than a
# divergence: `build/Config.zig:224-236` resolves the option to true on
# macOS/iOS and false everywhere else, a cargo `default = [...]` list cannot be
# target-conditional, so the switch lives in build orchestration — exactly where
# `-Dsimd` already lives (`xtask/src/main.rs`, the `--features simd` arm). The
# Apple xcframework build passes `--features sentry`; a Linux/GTK build does not, matching the reference's own Linux default.
sentry = ["rustty-crash/sentry"]


# The reference's `-Dflatpak=true`, forwarded down to termio (which welds it to
# `rustty-build-config/flatpak`). This crate needs no `cfg` of its own —
# `src/gtk/flatpak.rs` reads `rustty_build_config::flatpak()` at both its call
# sites, exactly as the reference reads `build_config.flatpak` — but the edge
# has to exist here because `rustty` reaches termio through this crate.
# Implies `gtk` for the reason SharedDeps.zig:663 states ("when we're targeting
# flatpak we ALWAYS link GTK"): GIO/GLib come in with the GTK stack, and
# `src/gtk/flatpak.rs` lives inside the gtk module anyway.
flatpak = ["gtk", "rustty-termio/flatpak"]

# OPT-IN GTK 4.20 API surface — the ghostty-mirrored analog of building against a
# >= 4.20 header. DEFAULT OFF: the AD-3 baseline (above) pins gtk4 to `v4_14`, so
# the stock build has NO `gtk::InterfaceColorScheme` and omits the
# `handleStyleManagerDark` `prefers-color-scheme` push entirely — byte-for-byte
# what ghostty compiles when its build box is on the 4.14 floor (the comptime fold
# in `gtk_version.atLeast` collapses the branch, `gtk_version.zig:58-62`). Turning
# this on selects gtk4-rs's `v4_20` API surface (raising the compile-time CEILING
# so `gtk4::InterfaceColorScheme` exists) and lights the `#[cfg(feature =
# "gtk-v4_20")]` push in `class/application/imp.rs`; that push STILL carries the live
# runtime `gtk_version::at_least(4, 20, 0)` guard, so it self-disables at runtime
# on a < 4.20 shared library. Recorded in the `L5 GTK baseline pin` DEFERRALS row.
# `gtk-v4_20` implies `gtk-v4_16`: a build box with >= 4.20 headers also has the
# >= 4.16 ones, so ghostty compiled there takes BOTH modern arms.
gtk-v4_20 = ["gtk", "gtk-v4_16", "gtk4/v4_20"]

# OPT-IN GTK 4.22 API surface — the third member of the `gtk-v4_16`/`gtk-v4_20`
# convention, added for B8 (3263fc6c4, native blur). DEFAULT OFF: at the AD-3
# `v4_14` baseline gtk4-rs exposes none of `Snapshot::push_copy`/`push_blur`/
# `append_paste` (all `#[cfg(feature = "v4_22")]`, gtk4-0.11.4
# `src/auto/snapshot.rs`), so the stock build compiles the `Surface::snapshot`
# blur arm OUT — exactly the reference's `comptime !gtk_version.atLeast(4, 22,
# 0)` fold ("if you compile Ghostty on an older GTK version, you won't get
# blur", `surface.zig:2033-2037`). Turning this on raises the compile-time
# ceiling and lights the `#[cfg(feature = "gtk-v4_22")]` blur push in
# `class/surface.rs`; that push STILL carries the live runtime
# `gtk_version::runtime_until(4, 23, 3)` guard, so it self-disables at runtime
# on older loaded GTK. Same DEFERRALS row as `gtk-v4_20`.
gtk-v4_22 = ["gtk", "gtk-v4_20", "gtk4/v4_22"]

# OPT-IN GTK 4.16 API surface — the sibling of `gtk-v4_20` above, and the second
# (and last) of the two arms the `v4_14` ceiling forces to their legacy shape.
# DEFAULT OFF: at `v4_14` gtk4-rs does not expose `CssSection::bytes()`
# (`#[cfg(feature = "v4_16")]`, gtk4-0.11.4 `src/auto/css_section.rs:57`), so the
# stock build logs the CSS-parse-error location/domain/code/message WITHOUT the
# offending source bytes — byte-for-byte what ghostty compiles on the 4.14 floor
# (the comptime fold in `gtk_version.atLeast` collapses the `if (comptime
# gtk_version.atLeast(4, 16, 0)) bytes: {...}` arm at `application.zig:1261`).
# Turning this on selects gtk4-rs's `v4_16` API surface (raising the compile-time
# CEILING so `CssSection::bytes` exists) and lights the `#[cfg(feature =
# "gtk-v4_16")]` byte-dump in `class/application/imp.rs`; that dump STILL carries the
# live runtime `gtk_version::at_least(4, 16, 0)` guard, so it self-disables at
# runtime on a < 4.16 shared library. Recorded in the same `L5 GTK baseline pin`
# DEFERRALS row as `gtk-v4_20`.
gtk-v4_16 = ["gtk", "gtk4/v4_16"]

# Windowing-protocol backends behind the `gtk::winproto` union. Both are DECLARED
# here so the `#[cfg(feature = …)]` arms in `src/gtk/winproto.rs` are recognized
# cfgs (no `unexpected_cfgs` lint), but neither is wired into `gtk` yet: L5.1 T8
# ships the noop-only build (PREPORT_GTK §5.4), so with only `--features gtk`
# selected these stay OFF and zero Wayland/X11 protocol crates are pulled. The
# `wayland` arm lands in L5.4, `x11` in L6, each turning its arm on and adding its
# own protocol-crate deps.
wayland = ["gtk", "dep:gdk4-wayland", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:wayland-protocols-plasma", "dep:wayland-scanner", "dep:bitflags", "dep:gtk4-layer-shell", "dep:gtk4-layer-shell-sys"]
x11 = ["gtk", "dep:gdk4-x11"]

[dependencies]
# WS4 `initSignals` (global.zig): the SIGPIPE-ignore sigaction. R3: libc binds
# the SAME syscalls the reference's std.posix wraps (the rustty-cli precedent).
libc = "0.2"
# DECISION-logging.md §6/§6r: the `log` facade the restored `log.*` sites in this
# crate emit through. Plain and unconditional — `release_max_level_*` belongs only
# on wasm artifact ROOT crates (§8r), and this crate is in no wasm artifact. The
# backend is whichever the running binary installed
# (`rustty_core::logging::AppLogger` for the `rustty` app binary, which this
# crate's only consumers are).
log = { workspace = true }
rustty-core = { workspace = true }
rustty-apprt-api = { workspace = true }
# R2 single-source-of-truth for the product identity. `gtk::build_info` sources
# `BASE_APPLICATION_ID`/`RESOURCE_PATH` from `rustty_identity::BUNDLE_ID` (never a
# hardcoded `com.mitchellh.ghostty`). Plain (non-optional) dep: it is a small,
# pure-const crate and the `gtk`-gated modules are its only consumers here, so on
# a macOS/default build it is compiled but unreferenced — behavior-identical.
rustty-identity = { workspace = true }
rustty-vt = { workspace = true }
rustty-font = { workspace = true }
# `rustty_font_shaper::face::DesiredSize` — the `font.face.DesiredSize` the gtk
# `Surface` boxes as its `font-size-request` property (`class/surface.zig:583`).
# The three vendored-C font backends are default-on for this crate, exactly as
# before they became features: the workspace dependency sets
# `default-features = false` (see the root manifest) purely so
# `rustty-renderer` can expose the opt-out an embedder needs, so every other
# consumer names them here and builds byte-identically (R5).
rustty-font-shaper = { workspace = true, features = ["freetype", "harfbuzz", "fontconfig"] }
# The three font-backend pass-throughs are default-on for this crate, exactly as
# before they became features; the workspace dependency sets
# `default-features = false` (see the root manifest) only so the crates on an
# embedder's path can opt out, so this consumer names them and builds
# byte-identically (R5).
rustty-renderer = { workspace = true, features = ["freetype", "harfbuzz", "fontconfig"] }
rustty-inspector = { workspace = true }
# The inspector's ImGui context lifecycle (`apprt.embedded.Inspector`
# init/deinit — ImGui_CreateContext/DestroyContext, SetCurrentContext, GetIO,
# ImGui_ImplMetal_Shutdown). Vendored Dear ImGui + Dear Bindings C API leaf
# (`links = "dcimgui"`); a lower-tier -sys crate (acyclic).
# `freetype` is default-on for this crate exactly as before it became a feature;
# the workspace dependency sets `default-features = false` (see the root manifest)
# only so `rustty-inspector` can forward it for an embedder.
dcimgui-sys = { workspace = true, features = ["freetype"] }
# V13 (`gtk::{pre_exec,post_fork}`): `rustty_termio::command::{Command,
# RtPreExecInfo, RtPostForkInfo, PostForkError, install_rt_hooks}`. The apprt is
# the crate that OWNS the `rt_*` hook pair the reference picks at comptime
# (`Exec.zig:1034-1037`), so it installs it into termio; the reverse edge
# (rustty-termio -> rustty-apprt) is the one R4 forbids and it is NOT added —
# see the seam PORT NOTE above `rustty_termio::command::RtPreExecInfo`. This
# edge is DOWNWARD and already existed transitively (rustty-apprt ->
# rustty-core -> rustty-termio); naming it directly is what Rust needs to `use`
# the crate. It was already carried as a Linux dev-dependency for the
# first-light KAT; that entry is now redundant and removed. Plain
# (non-optional), like the other lower-tier crates here: on a macOS / default
# build it is compiled but unreferenced (the sole consumers are
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "gtk"))]`).
rustty-termio = { workspace = true }
rustty-config = { workspace = true }
rustty-input = { workspace = true }
# WS15 (GTK GlobalShortcuts): `Binding.Action::format` is generic over
# `rustty_cfg_fmt::Writer`; the portal `BindShortcuts` payload needs each action
# rendered in its parse/format spelling for the shortcut `description` field.
# Already in the graph transitively (rustty-input deps it); named directly here
# because Rust needs a direct edge to `use` the crate. Acyclic: rustty-cfg-fmt is
# a strictly-earlier workspace member with no apprt edge.
rustty-cfg-fmt = { workspace = true }
rustty-os = { workspace = true }
# `rustty_datastruct::blocking_queue::Timeout` — named by the gtk-gated
# `Application::bind_core_app` seam so `activate` can push `Message::NewWindow`
# onto the core `App<A>` mailbox with the reference's `.forever` timeout
# (`application.zig:1464-1466`). Plain (non-optional) dep like the other pure
# lower-tier crates here: on a macOS/default build it is compiled but unreferenced
# (the sole consumer is
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "gtk"))]`).
rustty-datastruct = { workspace = true }
# WS4 full `GlobalState.init` wiring (the BREAK #1 body, global.zig):
# crash.init (sentry), oni.init (regex), the Logging type + ResourceLimits
# seam, and build-config for the init info-log lines. All strictly-lower
# members — acyclic (G7). rustty-cli is NOT here (apprt stays cli-free,
# ADV-FIX 2: detection lives in the bin / in rustty-apprt-c).
rustty-crash = { workspace = true }
rustty-oniguruma = { workspace = true }
rustty-global = { workspace = true }
rustty-build-config = { workspace = true }
# `build_config.version_string` / `release_channel`: the version derived from
# the checkout, in its own leaf crate so a commit rebuilds only its readers.
rustty-version = { workspace = true }
# The init log lines `dependency harfbuzz=...` / `dependency fontconfig=...`
# (global.zig:133-138), emitted only when the runtime font_backend has them.
# Path deps like rustty-font-shaper's own edges (already in the build graph).
harfbuzz-sys = { path = "../../crates-sys/harfbuzz-sys" }
# (`fontconfig-sys` is in the non-Windows table below.)
# `zig_string_escape` (the rustty port of `std.zig.stringEscape`) — used by
# `embedded::Surface::init` to escape `initial_input` for the config `raw` field
# (embedded.zig:561). Reused, not reimplemented (R3/R5). Acyclic: rustty-args deps
# only {os, util, build-config}, none of which reach apprt.
rustty-args = { workspace = true }
# allocator-api2 Allocator trait (the workspace's `std.mem.Allocator` map): the
# `none::App::perform_ipc` static fn takes a passed-in allocator (reference
# none.zig `performIpc(_: Allocator, ...)`), matching `rustty_apprt_api::ipc`.
allocator-api2 = { workspace = true }
# `rustty_xev::Async` — `Inspector::render`'s wakeup-handle parameter (the R4
# acyclic Surface seam's `&rustty_xev::Async` leaf standing in for the whole
# core-local `renderer_thread: Thread<A>`; INV-12). Already a transitive dep via
# rustty-core; named directly here so `embedded::Inspector::renderMetal` can
# reach `core_surface.renderer_thread.wakeup` by its real type.
rustty-xev = { workspace = true }

# objc2/Metal msgSends (renderMetal's MTLRenderCommandEncoder construction, the
# device/command_buffer/desc release balances) are Darwin-only, exactly like
# rustty-renderer/rustty-apprt-c/rustty-os's own objc2 deps below. Darwin means
# `macos || ios` (the reference's `isDarwin()`); task 20 (S46-F4) widened this from
# macOS alone, with the Metal gates in `src/embedded/inspector.rs` that use it.
# The `dependency fontconfig=...` log line's library, kept off Windows as
# `rustty-font-shaper`'s own fontconfig edge is: the reference's Windows
# default backend is `freetype_windows` ("Avoid fontconfig on Windows because
# its libxml2 dependency may not unpack", `font/backend.zig:49-55`), so it
# never builds fontconfig or libxml2 there. CORRECTION (task W-1): this edge
# was unconditional, so every crate above rustty-apprt (rustty, rustty-cli,
# rustty-apprt-c, xtask) built libxml2 on Windows and failed there (measured:
# its vendored config includes `iconv.h`, which Windows does not have).
[target.'cfg(not(target_os = "windows"))'.dependencies]
fontconfig-sys = { path = "../../crates-sys/fontconfig-sys" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# objc2: the ObjC runtime (`msg_send!`), pinned to the same 0.6 the rest of the
# workspace uses (rustty-renderer/rustty-apprt-c/rustty-os). `renderMetal`'s
# `MTLRenderCommandEncoder` construction (`renderCommandEncoderWithDescriptor:`
# + `endEncoding`) and the `device`/`command_buffer`/`desc` release msgSends
# operate on OPAQUE ids crossing the C ABI (never a compile-time Metal type),
# exactly mirroring the reference's untyped `objc.Object.fromId(...).msgSend(...)`
# — the same raw-`AnyObject` + `msg_send!` idiom already used by the
# `rustty_set_window_background_blur` blur leaf (rustty-apprt-c/src/lib.rs), so
# no objc2-metal/objc2-foundation typed bindings are needed for this leaf.
objc2 = { version = "0.6" }

# The gtk4-rs stack backing the NATIVE `gtk` apprt backend (`src/gtk.rs`).
# Target-gated EXACTLY like the macOS `objc2` block above (the crate's own
# precedent) and, on top of that, `optional` behind the `gtk` feature — the two
# gates together are the R5 guarantee: neither a macOS build nor a
# default-feature Linux build resolves, downloads, or compiles a line of this.
#
# R3: these are gtk-rs *bindings* to the SAME C libraries the reference links
# (`pkg-config gtk4` 4.22.4 / `libadwaita-1` 1.9.2 / `glib-2.0` 2.88.2 on this
# host) — explicitly permitted by `.port/PORT_RULES.md:47-58` ("Rust *bindings*
# to the same C libs (gtk-rs, objc) are fine"), the same standing the `objc2`
# dep above enjoys. No `-sys` crate of our own, and (deliberately) NOTHING here
# pulls an EGL/GL *dev header* dependency: gtk4-sys links `libgtk-4.so` via
# pkg-config only. The GL context is GTK's own `GLArea` (L5/L4 seam).
#
# Versions are declared HERE rather than in `[workspace.dependencies]`, matching
# the `objc2` precedent above: these are consumed by exactly one crate.
#
# AD-3 BASELINE PIN — the `v4_14`/`v1_5` features ARE the "gtk >= 4.14 /
# adw >= 1.5" baseline, expressed where Cargo can enforce it: they select the
# 4.14/1.5 API surface and make gtk4-sys's build script REJECT an older system
# lib. Do NOT bump these to `v4_22`/`v1_9` to match this host: the baseline is a
# COMPATIBILITY floor (what rustty is allowed to assume), not the dev box's
# version. See the DEFERRALS row cited at the bottom of this block for the one
# behavior the floor costs us.
#
# WHAT THE PIN DOES AND DOES NOT KILL (read before porting a version branch in
# L5.0 T2). State the rule first; the buckets then FALL OUT of it.
#
# THE ORACLE'S FOLD IS UNIVERSAL, NOT CALL-SITE-CONDITIONAL. `atLeast` opens with
# `if (comptime comptime_version.order(threshold) == .lt) return false;`
# (`gtk_version.zig:58-62`, mirrored `adw_version.zig:55-59`). That condition is
# a compile-time CONSTANT inside an `inline fn` whose params are `comptime`, so
# it collapses at EVERY call site — runtime sites included. Its own doc comment
# says exactly this (`gtk_version.zig:47-48`): "This is inlined so that the
# comptime checks will disable the runtime checks if the comptime checks fail."
# The `@inComptime()` arm below it only decides what happens when the fold does
# NOT fire. So `comptime_version` — not the call site's context — is what picks
# the arm.
#
# RUSTTY HAS NO SUCH CONSTANT. The oracle's `comptime_version` is read from the
# BUILD BOX's headers (`gtk_version.zig:7,14-18`: `@cInclude("gtk/gtk.h")` ->
# `c.GTK_MAJOR_VERSION`), so on this host it is 4.22, not 4.14. rustty has no
# header include: `gtk4::minor_version()` is ALWAYS a runtime read of the real
# shared library, and the `v4_14`/`v1_5` Cargo features are an API-SURFACE
# CEILING (which symbols exist) — not a version oracle. Hence:
#
#   THE RULE: every `atLeast` site ports as a LIVE runtime predicate, with
#   exactly two exceptions —
#
#   (1) CEILING -> forced LEGACY arm, and the loss MUST be recorded. The modern
#       arm names a symbol `v4_14`/`v1_5` does not expose, so it cannot compile:
#         - `application.zig:1261` — `CssSection::bytes()` is
#           `#[cfg(feature = "v4_16")]` (gtk4-0.11.4 `src/auto/css_section.rs:57`)
#         - `application.zig:1565` — `gtk::InterfaceColorScheme` is
#           `#[cfg(feature = "v4_20")]` (gtk4-0.11.4 `src/auto/enums.rs:5985`)
#       These two are the SAME case. That 1261 is written `if (comptime ...)` and
#       1565 is a plain `if` is IRRELEVANT here — neither arm exists at `v4_14`.
#       Both are losses against ghostty-on-this-host, and both are recorded in
#       `.port/phase-2/DEFERRALS.md` ("L5 GTK baseline pin (AD-3) — `v4_14` API
#       ceiling costs `prefers-color-scheme`").
#
#   (2) COMPILE-TIME ARTIFACT -> collapse; at/below the floor that is the MODERN
#       arm. The branch picks a Rust *type*, a file-level `const`, or a
#       build-time artifact (the blueprint manifest) — Rust cannot defer those to
#       runtime. All `adw`, all thresholds <= the 1.5 floor:
#         - `dialog.zig:21`, `debug_warning.zig:14`,
#           `surface_child_exited.zig:15`  (`pub const Parent`/type alias)
#         - `clipboard_confirmation_dialog.zig:17` (file-level `const can_remember`)
#         - `debug_warning.zig:42`, `clipboard_confirmation_dialog.zig:301`
#           (inside `comptime gresource.blueprint(...)` — the resource manifest)
#       This is the set AD-3 enumerates, and it is why the manifest is 19, not 21.
#
# WHAT THE RULE GIVES AT THE REMAINING SITES:
#   * `window.zig:695` (`!gtk_version.atLeast(4, 16, 0)` gating the
#     `window-theme-ghostty` CSS class) -> LIVE. Threshold is ABOVE the floor and
#     the arm needs no gated symbol, so neither exception fires.
#   * `window.zig:1181` (`if (!gtk_version.atLeast(4, 10, 0)) return;` — "Debian
#     12 is stuck on GTK 4.8") -> LIVE. The threshold is BELOW the floor, so the
#     guard is true on every AD-3-supported runtime and could in principle be
#     dropped — but AD-3's deletion set is ENUMERATED (the five `adw`
#     `supports_*` helpers) and this is not in it. Port it live: oracle-exact,
#     and a no-op on any supported host. Do not widen AD-3 to reach it.
#   * every `runtimeAtLeast`/`runtimeUntil` site (`gtk_version.zig:75,90`) ->
#     unconditionally LIVE.
#
# AD-3's ONE EXTENSION BEYOND THE RULE — `window.zig:1799`. The rule alone would
# keep it live (`adw_version.supportsDialogs()` = `atLeast(1, 5, 0)`,
# `adw_version.zig:104-106`; a plain runtime `if` around two `showAboutDialog`
# arms, not a compile-time artifact; and NOT ceiling-blocked — `adw::AboutDialog`
# is `#[cfg(feature = "v1_5")]`, libadwaita-0.9.2 `src/auto/mod.rs:6-11`, i.e.
# available exactly AT the floor; verified by probe). AD-3 nevertheless DELETES
# it: the plan (`docs/superpowers/plans/2026-07-17-L5-gtk-apprt.md:101`) names
# `supports_dialogs()` among the five deleted helpers and directs inlining the
# modern arm at each of their 6 call sites, and `window.zig:1799` is one of those
# 6 (it is also the ONLY `adw_version.` call site in `window.zig` — the plan's
# "tab-overview/toolbar-view" label there is a mislabel; `supportsTabOverview`/
# `supportsToolbarView` have zero call sites repo-wide). PORT AS RATIFIED: the
# `adw` arm unconditionally, no predicate, dropping the `gtk.showAboutDialog`
# legacy arm (`window.zig:1817-1830`). This is behavior-preserving inside the
# supported envelope — `runtime_at_least(1, 5, 0)` is true on every runtime AD-3
# admits — and is observable only on an adw < 1.5 runtime, which AD-3 declares
# unsupported. Recorded as a deviation from ghostty-on-this-host, NOT as an
# unflagged silent narrowing.
#
# T20 SHAPE NOTE: the oracle's `adw.showAboutDialog(...)`/`gtk.showAboutDialog(...)`
# are C VARARGS functions; gtk-rs binds no such free fn. The modern arm ports as
# an `adw::AboutDialog` built with the same property names and `present()`ed.
#
# T2 NOTE (unreconciled, do not silently pick): plan:96 specs `at_least(..)` as a
# "const fn over BASELINE". Under the rule above that manufactures a header fold
# rustty does not have, and it would const-FALSE `window.zig:695` — the very site
# DEFERRALS:3625 ratifies as live. Under the rule, `at_least` degenerates to
# `runtime_at_least` (the oracle only distinguishes them BECAUSE of the header
# fold). T2 must either implement it as a live delegate or get plan:96 amended.
# W2D/F-002: `any(linux, freebsd)`, not `linux` — FreeBSD's default app runtime
# is GTK too (`apprt/runtime.zig:18` `.linux, .freebsd => .gtk`) and the whole
# gtk4-rs stack below discovers its libraries through pkg-config, which FreeBSD
# ports satisfies. Every crate here is still `optional` behind `gtk`, so the
# FreeBSD default build (no `--features gtk`) pulls none of them.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# glib 0.22 — `glib::Object`/`WeakRef`/`Variant`/`MainContext` + the
# `#[glib::object_subclass]`/`#[derive(glib::Properties)]` macro triad that
# re-expresses ghostty's `class.zig::Common(Self, Private)` helper (PREPORT_GTK
# §0). Version-locked to gtk4 0.11's own glib edge (one `glib` in the tree, or
# the GObject type registrations would not share a GType registry).
glib = { version = "0.22", optional = true }
# gio 0.22 — `gio::{Resource, SimpleAction, SimpleActionGroup, Settings}`: the
# gresource registration at class-init, the `ext/actions.zig` action-map
# helpers, and the `gsettings.zig` typed reads.
gio = { version = "0.22", optional = true }
# gdk4 0.11 — `gdk::{Display, Surface, Key, ModifierType, Clipboard}`: the
# `key.zig` encoder/`translateMods` and the winproto display probes.
gdk4 = { version = "0.11", optional = true }
# gtk4 0.11 — the widget layer (`gtk::{Widget, GLArea, Scrollable, ...}`) and
# the `CompositeTemplate` machinery the 19 `.blp` blueprints bind against.
gtk4 = { version = "0.11", features = ["v4_14"], optional = true }
# libadwaita 0.9 — `adw::{Application, ApplicationWindow, Bin, AlertDialog,
# SwitchRow, ...}`. AD-3 makes `adw.AlertDialog`/`adw.Bin`/`adw.SwitchRow`
# unconditional (dropping the `adw.MessageDialog`/`gtk.Box`/`void` legacy arms),
# which is exactly what the `v1_5` floor buys.
libadwaita = { version = "0.9", features = ["v1_5"], optional = true }
# Wayland winproto backend (feature = "wayland"): gdk4-wayland to reach GDK's
# wl_display, wayland-client/backend to bind the registry over that foreign
# display, and the protocol crates for xdg_activation (staging) + the KDE globals.
gdk4-wayland = { version = "0.11", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true, features = ["client_system"] }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", optional = true, features = ["client"] }
# `vicinae_hotkey_v1` has no crates.io binding (it is not in `wayland-protocols`:
# unratified, testing-phase, authored by the vicinae launcher project), so the
# client bindings are generated in-tree from the vendored
# `protocols/vicinae-hotkey-v1.xml` by `wayland-scanner`'s `generate_interfaces!` /
# `generate_client_code!` proc macros — the exact mechanism `wayland-protocols`
# uses internally. See `src/gtk/winproto/wayland/vicinae.rs`. This is the Rust
# counterpart of the reference's `build.zig` `wayland_scanner.addCustomProtocol`
# step for the same XML. NOT a build-dependency: wayland-rs 0.31 moved scanning
# from a build script into proc macros, which read the XML at macro-expansion time
# relative to `CARGO_MANIFEST_DIR` (`build.rs` still emits the `rerun-if-changed`).
wayland-scanner = { version = "0.31", optional = true }
# `wayland-scanner` expands a protocol's `bitfield="true"` enum into a
# `bitflags::bitflags!` invocation referring to the crate by bare path, so the
# generating crate must have `bitflags` in scope. `vicinae_hotkey_manager_v1`'s
# `modifiers` is such an enum. Same major version wayland-client itself uses (one
# copy in the lock).
bitflags = { version = "2", optional = true }
# Quick-terminal layer-shell backend (feature = "wayland"): gtk4-layer-shell binds
# libgtk4-layer-shell (pkg-config gtk4-layer-shell-0), the wlr-layer-shell wrapper
# GTK's own toplevel does not expose. 0.8 tracks gtk4-rs 0.11, matching the stack
# above. Only the wayland winproto arm's quick-terminal paths consume it.
gtk4-layer-shell = { version = "0.8", optional = true }
# The same library's raw C binding, for `gtk_layer_set_namespace` on the config's
# raw bytes (the reference's `setNamespace` takes `[:0]const u8`; the crate's
# `set_namespace` takes `&str`, S33-F1). The version gtk4-layer-shell 0.8 itself
# depends on (one copy in the lock).
gtk4-layer-shell-sys = { version = "0.6", optional = true }
# X11 winproto backend (feature = "x11"): gdk4-x11 to reach the xlib Display + the
# window XID, x11-dl for the XChangeProperty property sets (_MOTIF_WM_HINTS CSD,
# _KDE_NET_WM_BLUR_BEHIND_REGION blur, _NET_WM_STATE urgency).
gdk4-x11 = { version = "0.11", features = ["xlib"], optional = true }

# The gresource asset pipeline. build.rs runs blueprint-compiler over the 19
# `.blp`, generates the gresource XML, drives `glib-compile-resources`, and
# `cc`-compiles the generated `rustty_resources.c` into the crate. The whole
# pipeline is a no-op unless BOTH `CARGO_FEATURE_GTK` and
# `CARGO_CFG_TARGET_OS == "linux"` hold, so on macOS / a default Linux build the
# script returns immediately (R5: the compiled artifact is unchanged). Declared
# here (not `[workspace.dependencies]`) for the same reason as the gtk4-rs stack
# above: exactly one crate consumes them.
[build-dependencies]
# R2: build.rs bakes the gresource prefixes / icon aliases from the SAME single
# source of truth the library reads — `rustty_identity::BUNDLE_ID` — so the XML
# it emits matches `gtk::build_info` exactly. Per R2 this crate lists
# `rustty-identity` as BOTH a `[dependencies]` and a `[build-dependencies]` edge.
rustty-identity = { workspace = true }
# `cc` compiles the `glib-compile-resources`-generated `rustty_resources.c` (the
# embedded gresource blob) and links it into the crate, exactly as the
# workspace's `-sys` crates use `cc` for their vendored C.
cc = "1"

# `gio` is the lib's own (gtk-feature-gated, Linux-target-gated) binding; an
# integration test (`tests/gtk_resources.rs`) needs it in scope to look up the
# registered gresource, and integration tests can only reach dev-dependencies,
# not the lib's optional deps. Target-gated to mirror the `[dependencies]`
# edge (W2D/F-002: Linux AND FreeBSD, the two `.gtk` runtimes); the test file
# itself is `#[cfg(feature = "gtk")]`, so without `--features gtk` nothing here is
# referenced. Resolves to the SAME `gio` 0.22 instance as the library edge, so the
# process-global gresource registry is shared.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
gio = { version = "0.22" }
# `glib` in scope for the integration KATs: `tests/gtk_application.rs` builds a
# `GhosttyApplication` via `glib::Object::builder` and compares GObject identity.
# Integration tests reach only dev-dependencies, not the lib's optional `glib`
# edge; this resolves to the SAME `glib` 0.22 instance so the GType registry and
# the process-global `GApplication` default are shared with the library.
glib = { version = "0.22" }
# The widget-layer bindings the FIRST-LIGHT KAT (`tests/gtk_first_light.rs`) needs
# directly: it hosts the real `class::Surface` in an `adw::ApplicationWindow`
# (`libadwaita`), sets it as the window content + unparents it at teardown, and reads
# the widget tree via the `gtk4` prelude. Integration tests reach only
# dev-dependencies (not the lib's optional gtk4-rs edges), so the same versions +
# features as the library's `[dependencies]` are declared here so cargo unifies to
# ONE instance of each — the GType registry / GApplication default the KAT shares
# with the library. Target-gated like `gio`/`glib` above; the test file is
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "gtk"))]`,
# so a non-gtk build compiles none of it.
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
# `rustty_vt::input::key_mods::Mods` in scope for the X11 winproto KATs
# (`tests/gtk_x11_event_mods.rs`), which compare the dispatched modifier state.
# Integration tests reach only dev-dependencies, not the lib's `[dependencies]`
# edge; this resolves to the SAME rustty-vt instance as the library's.
rustty-vt = { workspace = true }
# `rustty_os::cgroup::current` in scope for the cgroup-scope KAT
# (`tests/gtk_cgroup_scope.rs`), which reads `/proc/<pid>/cgroup` to check that
# `cgroup::create_scope` really moved the child — the same predicate
# `post_fork.zig:104-115` polls. Same reason as the rows above: integration tests
# reach only dev-dependencies, and this resolves to the SAME rustty-os instance
# as the library's `[dependencies]` edge.
rustty-os = { workspace = true }
# `gdk4_x11::X11Surface` in scope for the same KATs, which read the realized
# window's XID to check `WINDOWID`. Same version + features as the library's
# Linux-gated optional edge so cargo unifies to ONE instance. Unconditional here
# (like `gtk4`/`libadwaita` above) — the test files are
# `#[cfg(all(any(target_os = "linux", target_os = "freebsd"), feature = "x11"))]`,
# so nothing of them compiles on
# a non-x11 build; the cost is that a Linux `cargo test -p rustty-apprt` needs
# `libX11-devel` present (it is, on the VM).
gdk4-x11 = { version = "0.11", features = ["xlib"] }
# The FAKE COMPOSITOR half of the `vicinae_hotkey_v1` wire-path harness
# (`src/gtk/winproto/wayland/hotkeys.rs`,
# `hotkeys_wire_path_bound_pressed_denied_revoked`). `wayland-server` 0.31 is the
# SIBLING of the vendored `wayland-client` 0.31, so `wayland-scanner`'s
# `generate_server_code!` scans the SAME
# `protocols/vicinae-hotkey-v1.xml` the client bindings are generated from — the
# only way to drive `bound`/`pressed`/`denied`/`revoked` over a real socket when no
# mainstream compositor implements the protocol (V22).
#
# DEV-ONLY, deliberately: this must never enter the shipped dependency graph
# (`check_acyclic.sh` is the enforcement). It is used exclusively by a
# `#[cfg(test)]` module.
wayland-server = { version = "0.31" }
