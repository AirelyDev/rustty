# rustty-wasm — WASM/web target module (port of ghostty src/main_wasm.zig)
#
# Crate IDENTITY is `rustty-wasm` (R4). This is the headless C-ABI wasm module
# entry: a TOP SINK (nothing depends on it) that force-retains the config + font
# atlas wasm C-ABI exports and installs the `os/wasm/log` freestanding sink,
# mirroring the reference `comptime { _ = @import(...); }` retention block. NO
# dependency on the ghostty tree (R3) — reference is an external oracle only.
[package]
name = "rustty-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
# cdylib: emits the `rustty_wasm.wasm` bearing the unmangled `config_*`/`atlas_*`
# C-ABI exports for the JS host (the `main_wasm.zig` artifact — build it with
# `.port/tools/build-main-wasm.sh --release`). rlib: keeps the retention/logging
# logic host-buildable so native `cargo build --workspace` stays green.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `_ = @import("os/wasm.zig");` — the wasm allocator/shared-mem helpers, the
# `os/wasm/log.zig` freestanding log sink installed as `std_options.logFn`, and
# (WS14 T3) the resurrected host-ownership tracker `Atlas.Wasm` calls.
rustty-os = { workspace = true, features = ["wasm-host-owned"] }
# `_ = @import("config.zig").Wasm;` — the `config_new`/`config_free`/
# `config_load_string`/`config_finalize` C-ABI exports (behind the `wasm` feature).
# `default-features = false` (WS14 T6): the renderer accessor-trait impl and the
# `oniguruma` link highlighting are NOT part of the wasm module — their C/C++
# `-sys` deps (glslang, spirv-cross, wuffs, sentry, oniguruma) cannot target
# `wasm32-unknown-unknown`, which has no libc sysroot.
#
# Declared by PATH rather than `workspace = true`: cargo IGNORES a member's
# `default-features = false` on an inherited workspace dependency (it warns, and
# that may become a hard error), and turning those defaults off is the whole point
# of this edge.
rustty-config = { path = "../rustty-config", default-features = false, features = [
    "wasm",
] }
# `_ = @import("terminal/main.zig");` — the VT core (the wasm module re-exports
# the terminal C-ABI surface; retained by depending on the crate).
rustty-vt = { workspace = true }
# `_ = @import("font/main.zig");` — the `Atlas.Wasm` C-ABI/JS surface (WS14 T4).
# This edge was MISSING before WS14: the reference retains `font/main.zig`, so the
# `atlas_*` exports belong in this artifact.
rustty-font = { workspace = true, features = ["wasm"] }
# `_ = @import("font/main.zig");`, continued — the OTHER THREE wasm groups that
# comptime block retains (`_ = DeferredFace.Wasm; _ = face.web_canvas.Wasm;
# _ = shape.web_canvas.Wasm;`): the unprefixed `deferred_face_*`/`face_*`/
# `shaper_*` C-ABI exports. Under the D1 three-tier split those modules live in
# the SHAPER tier, so the `font/main.zig` retention needs this second edge
# (legal: the layering doctrine only forbids `rustty-font` → shaper edges, and
# `rustty-web-canvas` already links the shaper freestanding). The exports are
# behind the `ghostty-wasm-abi` feature so the separate `rustty_web_canvas.wasm`
# deliverable keeps its documented `rustty_wc_*`-only surface.
rustty-font-shaper = { workspace = true, features = ["ghostty-wasm-abi"] }

# NOT depended on: `_ = @import("App.zig").Wasm;`. The reference's `App.Wasm` is an
# EMPTY struct whose three exports are commented out upstream (App.zig:577-604), so
# retaining it emits zero symbols and pulls no App implementation. A `rustty-core`
# edge would over-retain an entire application tier (and transitively drag
# rustty-inspector → dcimgui-sys → freetype-sys → zlib-sys into a freestanding wasm
# link, which cannot build at all). The block itself IS ported, in
# `rustty-core/src/app.rs` (WS14 T5) — dropping the edge is the MORE faithful
# choice, not a shortcut.
