# PORTS: ghostty snap/snapcraft.yaml.
#
# ============================== UNVERIFIED ==================================
# NOT built. snapcraft is distributed as a snap, and snapd itself is absent
# from the Linux box this branch was developed on; installing it needs root.
# Unlike flatpak/ — which IS verified, because flatpak-builder ships as a
# flatpak and installs at user level — this carries no verification claim.
#
# To verify (needs root once, for snapd):
#     sudo dnf install snapd && sudo ln -s /var/lib/snapd/snap /snap
#     sudo snap install snapcraft --classic
#     cargo run -p xtask -- dist        # the vendored tarball this consumes
#     mkdir snapsrc && tar -xzf dist/rustty-*.tar.gz --strip-components 1 -C snapsrc
#     cd snapsrc && snapcraft --verbose # from the EXTRACTED tarball (VERSION,
#                                       # vendor/ and .cargo/ live only there)
#     sudo snap install --dangerous --classic ./rustty_*.snap
#     rustty +version
#
# Expect the `libs`/`mesa` stage-package lists to need adjusting: they are
# carried over from the reference and pin Ubuntu 24.04 (core24) package names.
# The flatpak build DID surface one thing that likely applies here too: bindgen
# needs libclang at build time, which is why `clang` is in build-packages below.
#
# .github/workflows/snap.yml runs exactly this on GitHub's runners once the
# RUSTTY_SNAP_ENABLED repository variable is set; it is UNVERIFIED too.
# Deferred verification is tracked in .port/phase-2/VERIFICATION_DEBT.md (P-1).
# ============================================================================
#
# THREE STRUCTURAL DIFFERENCES FROM THE REFERENCE:
#
# 1. No `zig` part. The reference downloads a Zig tarball at build time; the
#    Rust toolchain comes from the `rust` plugin's own snapcraft support, so
#    the whole part disappears.
#
# 2. The source is the PRE-VENDORED tarball `xtask dist` produces, for the same
#    reason as the flatpak manifest: snapcraft builds without network access in
#    the store, and the tarball already ships `vendor/` plus a
#    `.cargo/config.toml` redirecting crates.io to it. The reference solves the
#    equivalent problem with its Zig package cache.
#
# 3. gtk4-layer-shell is its own `meson` part (see that part) instead of the
#    reference's `-fno-sys=gtk4-layer-shell`, because rustty has no vendored
#    copy of it to fall back to.
name: rustty
base: core24
summary: A terminal emulator
description: |
  Rustty is a fast, feature-rich, and cross-platform terminal emulator that
  uses platform-native UI and GPU acceleration.
grade: stable
confinement: classic
contact: https://github.com/AirelyDev/rustty/discussions
issues: https://github.com/AirelyDev/rustty/issues
website: https://rustty.sh
license: MIT
icon: images/icons/icon_512.png
adopt-info: rustty

platforms:
  amd64:
  arm64:

apps:
  rustty:
    command: bin/rustty
    command-chain: [app/launcher]
    completer: share/bash-completion/completions/rustty.bash
    desktop: share/applications/io.airely.rustty.desktop
    #refresh-mode: ignore-running # Store rejects this, needs fix in review-tools
    environment:
      PATH: /snap/rustty/current/bin:/snap/rustty/current/usr/bin:$PATH
      LC_ALL: C.UTF-8
      RUSTTY_RESOURCES_DIR: /snap/rustty/current/share/rustty

parts:
  launcher:
    plugin: dump
    source: snap/local
    source-type: local
    organize:
      launcher: app/

  # PORTS the reference's `-fno-sys=gtk4-layer-shell`: core24 (Ubuntu 24.04)
  # does not package gtk4-layer-shell, so the reference builds its vendored
  # copy instead of linking a system one. rustty links gtk4-layer-shell through
  # pkg-config (gtk4-layer-shell-sys) and has no vendored copy, so the snap
  # builds the same library from source as its own part — the same release the
  # flatpak's dependencies.yml builds, for the same reason.
  gtk4-layer-shell:
    plugin: meson
    source: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.1.0.tar.gz
    # Keep this version synchronized with flatpak/dependencies.yml.
    source-checksum: sha256/98284281260a5eef5b4f63a55f16c4bf6a788a1020a6db037ecb0f71fa336988
    meson-parameters:
      - --prefix=/usr
      - -Dintrospection=false
      - -Dvapi=false
    build-packages:
      - meson
      - ninja-build
      - libgtk-4-dev
      - libwayland-dev
      - wayland-protocols

  rustty:
    source: .
    after: [gtk4-layer-shell]
    plugin: nil
    build-attributes: [enable-patchelf]
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - libxml2-utils
      - git
      - patchelf
      - gettext
      - clang # bindgen (crates-sys/libxml2-sys and friends) dlopens libclang
      - pkg-config
    build-snaps:
      # rust-toolchain.toml pins 1.93.1; the `rustup` snap honours it.
      - rustup
    # TODO: Remove the gtk4-layer-shell part when we upgrade to a version that packages it Ubuntu 24.10+
    override-build: |
      craftctl set version=$(cat VERSION)
      # `snap` is the port of the reference's `-Dsnap`, which its own
      # snapcraft.yaml passes. It drives `build_config.snap`, which
      # `os/open.rs` reads to handle `xdg-open` under snap confinement — the
      # confined `xdg-open` cannot reach the host's handlers. Without the
      # feature that guard is dead and URL/file opening silently misbehaves
      # inside the snap.
      cargo build --release --offline --locked \
        -p rustty --no-default-features --features "gtk wayland x11 snap"
      # `-Dpatch-rpath=...`: cargo has no post-link hook, so the port of the
      # reference's patch-rpath option is `xtask patchelf`, run on the built
      # binary (S63-F4).
      cargo run --release --offline --locked -p xtask -- patchelf \
        --patch-rpath \$ORIGIN/../usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/snap/core24/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR \
        target/release/rustty
      # `--optimize ReleaseFast` is the resource half of the reference's
      # `-Doptimize=ReleaseFast`: a release build installs only the compiled
      # terminfo database, not the terminfo source and termcap a Debug build
      # adds (Config.zig emit-terminfo/emit-termcap defaults).
      cargo run --release --offline --locked -p xtask -- resources \
        --target-os linux --prefix /snap/rustty/current --optimize ReleaseFast
      install -Dm755 target/release/rustty $CRAFT_PART_INSTALL/bin/rustty
      cp -rp zig-out/share $CRAFT_PART_INSTALL/
      sed -i 's|Icon=io.airely.rustty|Icon=${SNAP}/share/icons/hicolor/512x512/apps/io.airely.rustty.png|g' \
        $CRAFT_PART_INSTALL/share/applications/io.airely.rustty.desktop

  libs:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libadwaita-1-0
      - libglib2.0-0t64
      - libgtk-4-1
      - libgtk-4-media-gstreamer
      - ibus-gtk4
      - libpciaccess0
      - libtinfo6
      - libedit2
      - libelf1t64
      - libsensors5
      - libllvm17
      - libunistring5
      - librsvg2-2
      - librsvg2-common
      - libgdk-pixbuf-2.0-0
      - on amd64:
          [
            i965-va-driver,
            libdrm-intel1,
            libdrm-nouveau2,
            libdrm-amdgpu1,
            libdrm-radeon1,
          ]
    stage:
      # The libraries in dri need no-patchelf, so they come from the mesa-unpatched part
      - -usr/lib/*/dri

  mesa:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libglu1-mesa
      - libgl1-mesa-dri
      - libegl-mesa0
      - libegl1
      - libglx-mesa0
      - mesa-libgallium
    stage:
      # The libraries in dri need no-patchelf, so they come from the mesa-unpatched part
      - usr/lib/*/*.so*
      - usr/lib/*/dri/libdril_dri.so
      - -usr/lib/*/libxml2.so.*
      - -usr/lib/*/libgallium*so
      - -usr/lib/*/dri

  mesa-gl1-dri:
    plugin: nil
    stage-packages:
      - libgl1-mesa-dri
    build-attributes: [no-patchelf]
    stage:
      # Only the libraries in dri need to not be patched, the rest come from the mesa part
      # Otherwise snapcraft may strip the build ID and cause the driver to crash
      - usr/lib/*/libgallium*so
      - -usr/lib/*/dri/libdril_dri.so
      - usr/lib/*/dri
