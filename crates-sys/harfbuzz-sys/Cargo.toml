# harfbuzz-sys — vendored C++ dependency (R3: self-contained, no ghostty dep)
#
# This crate vendors the SAME upstream library the reference uses — HarfBuzz
# 11.0.0, the text shaping engine — copied in-tree under `vendor/` and built
# standalone via `cc` + `bindgen`. It mirrors the reference's
# pkg/harfbuzz/build.zig `buildLib`: the same single amalgamation translation
# unit (`src/harfbuzz.cc`, which `#include`s the whole `src/` tree), the same
# C++ toolchain (`linkLibCpp`), and the same `-D` flags
# (`-DHAVE_STDBOOL_H`; off-Windows `-DHAVE_UNISTD_H -DHAVE_SYS_MMAN_H
# -DHAVE_PTHREAD=1`; FreeType `-DHAVE_FREETYPE=1` + the four
# `HAVE_FT_*` capability flags the reference hard-enables). CoreText is OFF for
# the vendored build (the reference defaults `enable-coretext` to false).
# FreeType is wired to `freetype-sys` (the reference's
# `lib.linkLibrary(freetype)`): its vendored headers arrive via
# `DEP_FREETYPE_INCLUDE` (for `hb-ft.h`/`hb-ft.cc`), and its static archive is
# kept on the link line by `extern crate freetype_sys;` in lib.rs
# (one-version linking). `links` declares the native lib so Cargo enforces a
# single linkage.
[package]
name = "harfbuzz-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "harfbuzz"
build = "build.rs"

[lib]
# The FFI is bindgen-generated: the "doctests" harvested from HarfBuzz's C
# documentation comments are not Rust and must not be compiled/run. (This
# crate's real test is the KAT in the unit-test harness.)
doctest = false

[lints]
workspace = true

[dependencies]
# HarfBuzz is built with `-DHAVE_FREETYPE=1`, so `src/hb-ft.cc` does
# `#include <ft2build.h>` / `FT_FREETYPE_H` and references the FreeType API. A
# normal dependency on `freetype-sys` (a) exposes its vendored FreeType headers
# to this build script as `DEP_FREETYPE_INCLUDE` (for compiling `hb-ft.cc` and
# for bindgen over `hb-ft.h`), and (b) propagates its static `freetype` archive
# to the final link of the KAT test binary — the reference wires FreeType the
# same way via `lib.linkLibrary(freetype)`. The dependency is link-only;
# harfbuzz-sys uses none of freetype-sys's Rust API beyond the FFI types the KAT
# needs to build an `FT_Face`.
freetype-sys = { path = "../freetype-sys" }

[build-dependencies]
# R3: compile the vendored HarfBuzz C++ standalone (`cc` in C++17 mode) with the
# reference's flags, and auto-generate the FFI (`bindgen`) from the same public
# headers the reference's `c.zig` @cImports (`hb.h` + `hb-ft.h`).
cc = "1"
bindgen = "0.72"
